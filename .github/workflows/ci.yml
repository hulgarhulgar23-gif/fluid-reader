name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-14

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Check docs
        run: zsh scripts/check_docs.sh

      - name: Check growth assets
        run: zsh scripts/check_growth.sh

      - name: Check app build
        run: zsh scripts/check_fast.sh
