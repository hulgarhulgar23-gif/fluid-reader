          if [[ -n "${GITHUB_REPOSITORY:-}" ]]; then
            exceptional_loop_comment_command+=(--repo "$GITHUB_REPOSITORY")
          fi
          if [[ -n "$exceptional_loop_comment_issue" ]]; then
            exceptional_loop_comment_command+=(--issue "$exceptional_loop_comment_issue")
          fi
          if [[ "$post_exceptional_loop_comment" == "true" ]]; then
            "${exceptional_loop_comment_command[@]}"
          else
            exceptional_loop_comment_command+=(--dry-run)
            "${exceptional_loop_comment_command[@]}"
          fi

          exceptional_loop_verify_args=(
            zsh scripts/verify_founder_fame_exceptional_loop_run.sh
            --exceptional-loop "$exceptional_loop_path"
