name: Founder Fame Pack

on:
  schedule:
    - cron: '35 3 * * 1'
  workflow_dispatch:
    inputs:
      week:
        description: 'Current week label (optional, format: YYYY-Www)'
        required: false
        default: ''
        type: string
      previous_week:
        description: 'Previous week label (optional, format: YYYY-Www)'
        required: false
        default: ''
        type: string
      current_mrr:
        description: 'Current week MRR'
        required: false
        default: '49000'
        type: string
      target_mrr:
        description: 'Weekly target MRR'
        required: false
        default: '50000'
        type: string
      target_margin:
        description: 'Weekly target margin percent'
        required: false
        default: '55'
        type: string
      target_cac:
        description: 'Weekly target CAC'
        required: false
        default: '150'
        type: string
      target_ltv_cac:
        description: 'Weekly target LTV/CAC'
        required: false
        default: '3.5'
        type: string
      target_new_customers:
        description: 'Weekly target new customers'
        required: false
        default: '95'
        type: string
      product:
        description: 'Product name for post drafts'
        required: false
        default: 'Fluid Reader'
        type: string
      skip_founder_checks:
        description: 'Skip founder workflow verification script before artifact generation'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  generate-founder-fame-pack:
    name: Generate founder weekly and fame artifacts
    runs-on: macos-14
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run founder pack pipeline
        shell: zsh {0}
        env:
          INPUT_WEEK: ${{ github.event.inputs.week || '' }}
          INPUT_PREVIOUS_WEEK: ${{ github.event.inputs.previous_week || '' }}
          INPUT_PREVIOUS_MRR: ''
          INPUT_PREVIOUS_DELIVERY_COST: ''
          INPUT_PREVIOUS_ACQUISITION_SPEND: ''
          INPUT_PREVIOUS_NEW_CUSTOMERS: ''
          INPUT_PREVIOUS_MONTHLY_CONTRIBUTION: ''
          INPUT_PREVIOUS_LIFETIME_MONTHS: ''
          INPUT_PREVIOUS_FIXED_COST: ''
          INPUT_PREVIOUS_PRICE: ''
          INPUT_PREVIOUS_VARIABLE_COST: ''
          INPUT_CURRENT_MRR: ${{ github.event.inputs.current_mrr || '' }}
          INPUT_CURRENT_DELIVERY_COST: ''
          INPUT_CURRENT_ACQUISITION_SPEND: ''
          INPUT_CURRENT_NEW_CUSTOMERS: ''
          INPUT_CURRENT_MONTHLY_CONTRIBUTION: ''
          INPUT_CURRENT_LIFETIME_MONTHS: ''
          INPUT_CURRENT_FIXED_COST: ''
          INPUT_CURRENT_PRICE: ''
          INPUT_CURRENT_VARIABLE_COST: ''
          INPUT_TARGET_MRR: ${{ github.event.inputs.target_mrr || '' }}
          INPUT_TARGET_MARGIN: ${{ github.event.inputs.target_margin || '' }}
          INPUT_TARGET_CAC: ${{ github.event.inputs.target_cac || '' }}
          INPUT_TARGET_LTV_CAC: ${{ github.event.inputs.target_ltv_cac || '' }}
          INPUT_TARGET_NEW_CUSTOMERS: ${{ github.event.inputs.target_new_customers || '' }}
          INPUT_PRODUCT: ${{ github.event.inputs.product || '' }}
          INPUT_PRIMARY_CHANNEL: ''
          INPUT_BACKUP_CHANNEL: ''
          INPUT_CTA: ''
          INPUT_FIRST48H_PRIMARY_CHAR_LIMIT: '280'
          INPUT_FIRST48H_BACKUP_CHAR_LIMIT: '500'
          INPUT_FIRST48H_PRIMARY_TONE: 'x-punchy'
          INPUT_FIRST48H_BACKUP_TONE: 'linkedin-context'
          INPUT_FOUNDER_TRANSCRIPT: ''
          INPUT_FOUNDER_FAME_DAILY_MISSION: ''
          INPUT_CREATOR_TARGET_LIST: ''
          INPUT_DISTRIBUTION_PLAN: ''
          INPUT_FOUNDER_FAME_ACTION_QUEUE: ''
          INPUT_GUESTING_SIGNAL_ENTRIES: 'n/a'
          INPUT_GUESTING_SIGNAL_REPLIED: 'n/a'
          INPUT_GUESTING_SIGNAL_BOOKED: 'n/a'
          INPUT_GUESTING_SIGNAL_PUBLISHED: 'n/a'
          INPUT_GUESTING_SIGNAL_TOP_FORMAT: 'n/a'
          INPUT_GUESTING_SIGNAL_TOP_TARGET: 'n/a'
          INPUT_GUESTING_SIGNAL_ENRICHMENT_SCORE: 'n/a'
          INPUT_GUESTING_SIGNAL_RECOMMENDATION: 'Capture founder guesting signal comments before Friday review.'
          INPUT_SKIP_FOUNDER_CHECKS: ${{ github.event.inputs.skip_founder_checks || 'true' }}
          INPUT_POST_WAR_ROOM_COMMENT: 'false'
          INPUT_WAR_ROOM_COMMENT_ISSUE: ''
          INPUT_POST_EXCEPTIONAL_LOOP_COMMENT: 'false'
          INPUT_EXCEPTIONAL_LOOP_COMMENT_ISSUE: ''
          INPUT_TRIGGER: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/fixtures/founder/sample_inputs.env

          resolve_value() {
            local preferred="$1"
            local fallback="$2"
            if [[ -n "$preferred" ]]; then
              echo "$preferred"
            else
              echo "$fallback"
            fi
          }

          previous_mrr="$(resolve_value "$INPUT_PREVIOUS_MRR" "$PREVIOUS_MRR")"
          previous_delivery_cost="$(resolve_value "$INPUT_PREVIOUS_DELIVERY_COST" "$PREVIOUS_DELIVERY_COST")"
          previous_acquisition_spend="$(resolve_value "$INPUT_PREVIOUS_ACQUISITION_SPEND" "$PREVIOUS_ACQUISITION_SPEND")"
          previous_new_customers="$(resolve_value "$INPUT_PREVIOUS_NEW_CUSTOMERS" "$PREVIOUS_NEW_CUSTOMERS")"
          previous_monthly_contribution="$(resolve_value "$INPUT_PREVIOUS_MONTHLY_CONTRIBUTION" "$PREVIOUS_MONTHLY_CONTRIBUTION")"
          previous_lifetime_months="$(resolve_value "$INPUT_PREVIOUS_LIFETIME_MONTHS" "$PREVIOUS_LIFETIME_MONTHS")"
          previous_fixed_cost="$(resolve_value "$INPUT_PREVIOUS_FIXED_COST" "$PREVIOUS_FIXED_COST")"
          previous_price="$(resolve_value "$INPUT_PREVIOUS_PRICE" "$PREVIOUS_PRICE")"
          previous_variable_cost="$(resolve_value "$INPUT_PREVIOUS_VARIABLE_COST" "$PREVIOUS_VARIABLE_COST")"

          current_mrr="$(resolve_value "$INPUT_CURRENT_MRR" "$PACK_MRR")"
          current_delivery_cost="$(resolve_value "$INPUT_CURRENT_DELIVERY_COST" "$PACK_DELIVERY_COST")"
          current_acquisition_spend="$(resolve_value "$INPUT_CURRENT_ACQUISITION_SPEND" "$PACK_ACQUISITION_SPEND")"
          current_new_customers="$(resolve_value "$INPUT_CURRENT_NEW_CUSTOMERS" "$PACK_NEW_CUSTOMERS")"
          current_monthly_contribution="$(resolve_value "$INPUT_CURRENT_MONTHLY_CONTRIBUTION" "$PACK_MONTHLY_CONTRIBUTION")"
          current_lifetime_months="$(resolve_value "$INPUT_CURRENT_LIFETIME_MONTHS" "$PACK_LIFETIME_MONTHS")"
          current_fixed_cost="$(resolve_value "$INPUT_CURRENT_FIXED_COST" "$PACK_FIXED_COST")"
          current_price="$(resolve_value "$INPUT_CURRENT_PRICE" "$PACK_PRICE")"
          current_variable_cost="$(resolve_value "$INPUT_CURRENT_VARIABLE_COST" "$PACK_VARIABLE_COST")"

          target_mrr="$(resolve_value "$INPUT_TARGET_MRR" "$TARGET_MRR")"
          target_margin="$(resolve_value "$INPUT_TARGET_MARGIN" "$TARGET_MARGIN")"
          target_cac="$(resolve_value "$INPUT_TARGET_CAC" "$TARGET_CAC")"
          target_ltv_cac="$(resolve_value "$INPUT_TARGET_LTV_CAC" "$TARGET_LTV_CAC")"
          target_new_customers="$(resolve_value "$INPUT_TARGET_NEW_CUSTOMERS" "$TARGET_NEW_CUSTOMERS")"

          product_name="$(resolve_value "$INPUT_PRODUCT" "$PRODUCT_NAME")"
          primary_channel="$(resolve_value "$INPUT_PRIMARY_CHANNEL" "$PRIMARY_CHANNEL")"
          backup_channel="$(resolve_value "$INPUT_BACKUP_CHANNEL" "$BACKUP_CHANNEL")"
          cta_text="$(resolve_value "$INPUT_CTA" "$CTA_TEXT")"
          first48h_primary_char_limit="$(resolve_value "$INPUT_FIRST48H_PRIMARY_CHAR_LIMIT" "280")"
          first48h_backup_char_limit="$(resolve_value "$INPUT_FIRST48H_BACKUP_CHAR_LIMIT" "500")"
          first48h_primary_tone="$(resolve_value "$INPUT_FIRST48H_PRIMARY_TONE" "x-punchy")"
          first48h_backup_tone="$(resolve_value "$INPUT_FIRST48H_BACKUP_TONE" "linkedin-context")"
          post_war_room_comment="$(resolve_value "$INPUT_POST_WAR_ROOM_COMMENT" "false")"
          post_war_room_comment="$(print -r -- "$post_war_room_comment" | tr '[:upper:]' '[:lower:]')"
          war_room_comment_issue="$(resolve_value "$INPUT_WAR_ROOM_COMMENT_ISSUE" "")"
          post_exceptional_loop_comment="$(resolve_value "$INPUT_POST_EXCEPTIONAL_LOOP_COMMENT" "false")"
          post_exceptional_loop_comment="$(print -r -- "$post_exceptional_loop_comment" | tr '[:upper:]' '[:lower:]')"
          exceptional_loop_comment_issue="$(resolve_value "$INPUT_EXCEPTIONAL_LOOP_COMMENT_ISSUE" "")"

          week="$INPUT_WEEK"
          if [[ -z "$week" ]]; then
            week="$(date '+%Y-W%V')"
          fi

          previous_week="$INPUT_PREVIOUS_WEEK"
          if [[ -z "$previous_week" ]]; then
            previous_week="$(date -v-7d '+%Y-W%V')"
          fi

          output_dir=".build/founder"
          mkdir -p "$output_dir"
          previous_review_path="$output_dir/weekly-review-${previous_week}.md"

          if [[ "$INPUT_SKIP_FOUNDER_CHECKS" != "true" ]]; then
            zsh scripts/check_founder_workflow.sh
          fi

          zsh scripts/generate_founder_weekly_review.sh \
            --week "$previous_week" \
            --mrr "$previous_mrr" \
            --delivery-cost "$previous_delivery_cost" \
            --acquisition-spend "$previous_acquisition_spend" \
            --new-customers "$previous_new_customers" \
            --monthly-contribution "$previous_monthly_contribution" \
            --lifetime-months "$previous_lifetime_months" \
            --fixed-cost "$previous_fixed_cost" \
            --price "$previous_price" \
            --variable-cost "$previous_variable_cost" \
            --out "$previous_review_path"

          zsh scripts/generate_founder_weekly_pack.sh \
            --week "$week" \
            --previous-review "$previous_review_path" \
            --previous-label "$previous_week" \
            --mrr "$current_mrr" \
            --delivery-cost "$current_delivery_cost" \
            --acquisition-spend "$current_acquisition_spend" \
            --new-customers "$current_new_customers" \
            --monthly-contribution "$current_monthly_contribution" \
            --lifetime-months "$current_lifetime_months" \
            --fixed-cost "$current_fixed_cost" \
            --price "$current_price" \
            --variable-cost "$current_variable_cost" \
            --target-mrr "$target_mrr" \
            --target-margin "$target_margin" \
            --target-cac "$target_cac" \
            --target-ltv-cac "$target_ltv_cac" \
            --target-new-customers "$target_new_customers" \
            --product "$product_name" \
            --primary-channel "$primary_channel" \
            --backup-channel "$backup_channel" \
            --guesting-signal-entries "$(resolve_value "$INPUT_GUESTING_SIGNAL_ENTRIES" "n/a")" \
            --guesting-signal-replied "$(resolve_value "$INPUT_GUESTING_SIGNAL_REPLIED" "n/a")" \
            --guesting-signal-booked "$(resolve_value "$INPUT_GUESTING_SIGNAL_BOOKED" "n/a")" \
            --guesting-signal-published "$(resolve_value "$INPUT_GUESTING_SIGNAL_PUBLISHED" "n/a")" \
            --guesting-signal-top-format "$(resolve_value "$INPUT_GUESTING_SIGNAL_TOP_FORMAT" "n/a")" \
            --guesting-signal-top-target "$(resolve_value "$INPUT_GUESTING_SIGNAL_TOP_TARGET" "n/a")" \
            --guesting-signal-enrichment-score "$(resolve_value "$INPUT_GUESTING_SIGNAL_ENRICHMENT_SCORE" "n/a")" \
            --guesting-signal-recommendation "$(resolve_value "$INPUT_GUESTING_SIGNAL_RECOMMENDATION" "Capture founder guesting signal comments before Friday review.")" \
            --cta "$cta_text" \
            --out-dir "$output_dir"

          review_path="$output_dir/weekly-review-${week}.md"
          delta_path="$output_dir/weekly-delta-${week}.md"
          scoreboard_path="$output_dir/scoreboard-${week}.md"
          post_path="$output_dir/founder-update-${week}.md"
          fame_path="$output_dir/founder-fame-pack-${week}.md"
          press_path="$output_dir/founder-press-kit-${week}.md"
          media_blast_path="$output_dir/founder-media-blast-${week}.md"
          guesting_queue_path="$output_dir/founder-guesting-queue-${week}.md"
          guesting_brief_path="$output_dir/founder-guesting-brief-${week}.md"
          founder_fame_distribution_plan_path="$output_dir/founder-fame-distribution-plan-${week}.md"
          founder_fame_social_proof_wall_path="$output_dir/founder-fame-social-proof-wall-${week}.md"
          founder_fame_ops_brief_path="$output_dir/founder-fame-ops-brief-${week}.md"
          founder_fame_action_queue_path="$output_dir/founder-fame-action-queue-${week}.md"
          interview_prep_path="$output_dir/founder-fame-interview-prep-${week}.md"
          transcript_ingestion_path="$output_dir/founder-fame-transcript-ingestion-${week}.md"
          repurpose_plan_path="$output_dir/founder-fame-repurpose-plan-${week}.md"
          uplift_tracker_path="$output_dir/founder-fame-uplift-tracker-${week}.md"
          weight_profile_path="$output_dir/founder-fame-weight-profile-${week}.md"
          momentum_brief_path="$output_dir/founder-fame-momentum-brief-${week}.md"
          opportunity_radar_path="$output_dir/founder-fame-opportunity-radar-${week}.md"
          execution_sprint_path="$output_dir/founder-fame-execution-sprint-${week}.md"
          execution_scorecard_path="$output_dir/founder-fame-execution-scorecard-${week}.md"
          risk_response_path="$output_dir/founder-fame-risk-response-plan-${week}.md"
          escalation_queue_path="$output_dir/founder-fame-escalation-queue-${week}.md"
          command_center_path="$output_dir/founder-fame-command-center-${week}.md"
          next_move_handoff_path="$output_dir/founder-fame-next-move-handoff-${week}.md"
          next_move_draft_pack_path="$output_dir/founder-fame-next-move-draft-pack-${week}.md"
          spotlight_path="$output_dir/founder-fame-spotlight-pack-${week}.md"
          breakout_path="$output_dir/founder-fame-breakout-plan-${week}.md"
          outreach_sprint_path="$output_dir/founder-fame-outreach-sprint-${week}.md"
          proof_loop_path="$output_dir/founder-fame-proof-loop-${week}.md"
          proof_loop_check_path="$output_dir/founder-fame-proof-loop-check-${week}.md"
          kpi_snapshot_path="$output_dir/founder-fame-kpi-snapshot-${week}.md"
          velocity_scoreboard_path="$output_dir/founder-fame-velocity-scoreboard-${week}.md"
          exceptional_loop_path="$output_dir/founder-fame-exceptional-loop-${week}.md"
          exceptional_loop_live_check_path="$output_dir/founder-fame-exceptional-loop-live-check-${week}.md"
          narrative_lab_path="$output_dir/founder-fame-narrative-lab-${week}.md"
          war_room_path="$output_dir/founder-fame-war-room-${week}.md"
          war_room_check_path="$output_dir/founder-fame-war-room-check-${week}.md"
          war_room_live_check_path="$output_dir/founder-fame-war-room-live-check-${week}.md"
          war_room_comment_path=""
          exceptional_loop_comment_path="$output_dir/founder-fame-exceptional-loop-comment-${week}.md"
          first48h_post_pack_path="$output_dir/founder-first48h-post-pack-${week}.md"

          zsh scripts/generate_founder_fame_interview_prep.sh \
            --week "$week" \
            --product "$product_name" \
            --press-kit "$press_path" \
            --media-blast "$media_blast_path" \
            --guesting-brief "$guesting_brief_path" \
            --out "$interview_prep_path"

          transcript_source_path="$interview_prep_path"
          if [[ -n "$INPUT_FOUNDER_TRANSCRIPT" ]]; then
            if [[ ! -f "$INPUT_FOUNDER_TRANSCRIPT" ]]; then
              echo "Founder transcript source file not found: $INPUT_FOUNDER_TRANSCRIPT" >&2
              exit 1
            fi
            transcript_source_path="$INPUT_FOUNDER_TRANSCRIPT"
          fi

          creator_target_list_path=""
          if [[ -n "$INPUT_CREATOR_TARGET_LIST" ]]; then
            if [[ ! -f "$INPUT_CREATOR_TARGET_LIST" ]]; then
              echo "Creator target list source file not found: $INPUT_CREATOR_TARGET_LIST" >&2
              exit 1
            fi
            creator_target_list_path="$INPUT_CREATOR_TARGET_LIST"
          fi

          distribution_plan_path=""
          if [[ -n "$INPUT_DISTRIBUTION_PLAN" ]]; then
            if [[ ! -f "$INPUT_DISTRIBUTION_PLAN" ]]; then
              echo "Distribution plan source file not found: $INPUT_DISTRIBUTION_PLAN" >&2
              exit 1
            fi
            distribution_plan_path="$INPUT_DISTRIBUTION_PLAN"
          fi

          founder_fame_daily_mission_path=""
          if [[ -n "$INPUT_FOUNDER_FAME_DAILY_MISSION" ]]; then
            if [[ ! -f "$INPUT_FOUNDER_FAME_DAILY_MISSION" ]]; then
              echo "Founder fame daily mission source file not found: $INPUT_FOUNDER_FAME_DAILY_MISSION" >&2
              exit 1
            fi
            founder_fame_daily_mission_path="$INPUT_FOUNDER_FAME_DAILY_MISSION"
          fi

          zsh scripts/generate_distribution_followup_plan.sh \
            --week "$week" \
            --metric-focus "Founder fame momentum and reply quality" \
            --strongest-metric-label "Current MRR" \
            --strongest-metric-value "$current_mrr" \
            --command "Run Fame Next Move" \
            --primary-channel "$primary_channel" \
            --backup-channel "$backup_channel" \
            --primary-channel-roi-score "n/a" \
            --backup-channel-roi-score "n/a" \
            --channel-roi-preferred-channel "balanced" \
            --channel-roi-recommendation "Run weekly ROI review before forcing a single-channel route." \
            --channel-mix-recommendation "Keep channel mix balanced until founder mission freshness and reply deltas stabilize." \
            --reply-goal "12" \
            --outreach-goal "5" \
            --out "$founder_fame_distribution_plan_path"

          zsh scripts/generate_social_proof_wall.sh \
            --week "$week" \
            --metric-focus "Founder fame momentum and reply quality" \
            --strongest-metric-label "Current MRR" \
            --strongest-metric-value "$current_mrr" \
            --primary-channel "$primary_channel" \
            --backup-channel "$backup_channel" \
            --win-card "0" \
            --win-card-delta "n/a" \
            --replies-sent "0" \
            --replies-sent-delta "n/a" \
            --outreach-replies "0" \
            --outreach-collabs "0" \
            --outreach-cross-posts "0" \
            --primary-top-variant "A" \
            --backup-top-variant "B" \
            --creator-signal-top-handle "n/a" \
            --creator-signal-top-segment "n/a" \
            --guesting-signal-top-target "$(resolve_value "$INPUT_GUESTING_SIGNAL_TOP_TARGET" "n/a")" \
            --channel-mix-recommendation "Keep channel mix balanced until founder mission freshness and reply deltas stabilize." \
            --variant-recommendation "Use proof-loop deltas to choose next-week default variant." \
            --outreach-recommendation "$(resolve_value "$INPUT_GUESTING_SIGNAL_RECOMMENDATION" "Capture founder guesting signal comments before Friday review.")" \
            --out "$founder_fame_social_proof_wall_path"

          distribution_plan_for_ops="$founder_fame_distribution_plan_path"
          if [[ -n "$distribution_plan_path" ]]; then
            distribution_plan_for_ops="$distribution_plan_path"
          fi

          zsh scripts/generate_founder_fame_ops_brief.sh \
            --week "$week" \
            --distribution-plan "$distribution_plan_for_ops" \
            --social-proof-wall "$founder_fame_social_proof_wall_path" \
            --fame-pack "$fame_path" \
            --media-blast "$media_blast_path" \
            --guesting-brief "$guesting_brief_path" \
            --out "$founder_fame_ops_brief_path"

          founder_fame_action_queue_args=(
            --week "$week"
            --ops-brief "$founder_fame_ops_brief_path"
            --out "$founder_fame_action_queue_path"
          )
          if [[ -n "$founder_fame_daily_mission_path" ]]; then
            founder_fame_action_queue_args+=(--daily-mission "$founder_fame_daily_mission_path")
            founder_fame_action_queue_args+=(--require-fresh-daily-mission)
          fi
          zsh scripts/generate_founder_fame_action_queue.sh "${founder_fame_action_queue_args[@]}"

          founder_fame_action_queue_overlay_path="$founder_fame_action_queue_path"
          if [[ -n "$INPUT_FOUNDER_FAME_ACTION_QUEUE" ]]; then
            if [[ ! -f "$INPUT_FOUNDER_FAME_ACTION_QUEUE" ]]; then
              echo "Founder fame action queue source file not found: $INPUT_FOUNDER_FAME_ACTION_QUEUE" >&2
              exit 1
            fi
            founder_fame_action_queue_overlay_path="$INPUT_FOUNDER_FAME_ACTION_QUEUE"
          fi

          founder_fame_daily_mission_source_line="$(rg -m1 '^- Daily mission source: ' "$founder_fame_action_queue_overlay_path" || true)"
          founder_fame_daily_mission_source="${founder_fame_daily_mission_source_line#"- Daily mission source: "}"
          if [[ -z "$founder_fame_daily_mission_source" ]]; then
            founder_fame_daily_mission_source="n/a (missing Daily mission source line in founder_fame_action_queue overlay)"
          fi

          founder_fame_daily_mission_freshness_line="$(rg -m1 '^- Mission freshness: ' "$founder_fame_action_queue_overlay_path" || true)"
          founder_fame_daily_mission_freshness="${founder_fame_daily_mission_freshness_line#"- Mission freshness: "}"
          if [[ -z "$founder_fame_daily_mission_freshness" ]]; then
            founder_fame_daily_mission_freshness="n/a (missing Mission freshness line in founder_fame_action_queue overlay)"
          fi

          zsh scripts/generate_founder_fame_interview_prep.sh \
            --week "$week" \
            --product "$product_name" \
            --ops-brief "$founder_fame_ops_brief_path" \
            --action-queue "$founder_fame_action_queue_path" \
            --press-kit "$press_path" \
            --media-blast "$media_blast_path" \
            --guesting-brief "$guesting_brief_path" \
            --out "$interview_prep_path"

          zsh scripts/generate_founder_fame_transcript_ingestion.sh \
            --week "$week" \
            --product "$product_name" \
            --transcript "$transcript_source_path" \
            --interview-prep "$interview_prep_path" \
            --media-blast "$media_blast_path" \
            --out "$transcript_ingestion_path"

          zsh scripts/generate_founder_fame_repurpose_plan.sh \
            --week "$week" \
            --product "$product_name" \
            --interview-prep "$interview_prep_path" \
            --transcript-ingestion "$transcript_ingestion_path" \
            --media-blast "$media_blast_path" \
            --action-queue "$founder_fame_action_queue_path" \
            --guesting-brief "$guesting_brief_path" \
            --out "$repurpose_plan_path"

          zsh scripts/generate_founder_fame_uplift_tracker.sh \
            --week "$week" \
            --product "$product_name" \
            --campaign-dir "docs/campaigns" \
            --out "$uplift_tracker_path"

          zsh scripts/generate_founder_fame_weight_profile.sh \
            --week "$week" \
            --product "$product_name" \
            --campaign-dir "docs/campaigns" \
            --uplift-tracker "$uplift_tracker_path" \
            --out "$weight_profile_path"

          zsh scripts/generate_founder_fame_momentum_brief.sh \
            --week "$week" \
            --product "$product_name" \
            --fame-pack "$fame_path" \
            --repurpose-plan "$repurpose_plan_path" \
            --transcript-ingestion "$transcript_ingestion_path" \
            --press-kit "$press_path" \
            --media-blast "$media_blast_path" \
            --weight-profile "$weight_profile_path" \
            --out "$momentum_brief_path"

          zsh scripts/generate_founder_fame_opportunity_radar.sh \
            --week "$week" \
            --product "$product_name" \
            --momentum-brief "$momentum_brief_path" \
            --weight-profile "$weight_profile_path" \
            --uplift-tracker "$uplift_tracker_path" \
            --out "$opportunity_radar_path"

          zsh scripts/generate_founder_fame_execution_sprint.sh \
            --week "$week" \
            --product "$product_name" \
            --opportunity-radar "$opportunity_radar_path" \
            --momentum-brief "$momentum_brief_path" \
            --out "$execution_sprint_path"

          zsh scripts/generate_founder_fame_execution_scorecard.sh \
            --week "$week" \
            --product "$product_name" \
            --execution-sprint "$execution_sprint_path" \
            --opportunity-radar "$opportunity_radar_path" \
