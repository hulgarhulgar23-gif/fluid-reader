          echo "spotlight_path=$spotlight_path" >> "$GITHUB_OUTPUT"
          echo "breakout_path=$breakout_path" >> "$GITHUB_OUTPUT"
          echo "outreach_sprint_path=$outreach_sprint_path" >> "$GITHUB_OUTPUT"
          echo "proof_loop_path=$proof_loop_path" >> "$GITHUB_OUTPUT"
          echo "proof_loop_check_path=$proof_loop_check_path" >> "$GITHUB_OUTPUT"
          echo "kpi_snapshot_path=$kpi_snapshot_path" >> "$GITHUB_OUTPUT"
          echo "velocity_scoreboard_path=$velocity_scoreboard_path" >> "$GITHUB_OUTPUT"
