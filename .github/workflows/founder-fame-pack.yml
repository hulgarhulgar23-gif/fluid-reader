            comment_command=(
              zsh scripts/post_founder_fame_war_room_comment.sh
              --war-room "$war_room_path"
              --strict
              --out "$war_room_comment_path"
            )
            if [[ -n "$founder_fame_action_queue_overlay_path" ]]; then
