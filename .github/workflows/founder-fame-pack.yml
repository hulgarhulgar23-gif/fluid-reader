            "$uplift_tracker_path" \
            "$weight_profile_path" \
            "$momentum_brief_path" \
            "$opportunity_radar_path" \
            "$execution_sprint_path" \
            "$execution_scorecard_path" \
            "$risk_response_path" \
            "$escalation_queue_path" \
            "$command_center_path" \
            "$next_move_handoff_path" \
            "$next_move_draft_pack_path" \
            "$spotlight_path" \
            "$breakout_path" \
            "$outreach_sprint_path" \
            "$proof_loop_path" \
            "$proof_loop_check_path" \
            "$kpi_snapshot_path" \
            "$velocity_scoreboard_path" \
            "$exceptional_loop_path" \
            "$exceptional_loop_comment_path" \
            "$exceptional_loop_live_check_path" \
            "$narrative_lab_path" \
            "$war_room_path" \
            "$war_room_check_path" \
            "$war_room_live_check_path" \
            "$first48h_post_pack_path"; do
            if [[ ! -s "$generated_file" ]]; then
              echo "Generated founder artifact missing or empty: $generated_file" >&2
              exit 1
            fi
          done

          if [[ "$post_war_room_comment" == "true" ]] && [[ ! -s "$war_room_comment_path" ]]; then
            echo "Generated founder artifact missing or empty: $war_room_comment_path" >&2
            exit 1
          fi

          echo "week=$week" >> "$GITHUB_OUTPUT"
          echo "previous_week=$previous_week" >> "$GITHUB_OUTPUT"
          echo "previous_review_path=$previous_review_path" >> "$GITHUB_OUTPUT"
          echo "review_path=$review_path" >> "$GITHUB_OUTPUT"
          echo "delta_path=$delta_path" >> "$GITHUB_OUTPUT"
          echo "scoreboard_path=$scoreboard_path" >> "$GITHUB_OUTPUT"
          echo "post_path=$post_path" >> "$GITHUB_OUTPUT"
          echo "fame_path=$fame_path" >> "$GITHUB_OUTPUT"
          echo "press_path=$press_path" >> "$GITHUB_OUTPUT"
          echo "media_blast_path=$media_blast_path" >> "$GITHUB_OUTPUT"
          echo "guesting_queue_path=$guesting_queue_path" >> "$GITHUB_OUTPUT"
          echo "guesting_brief_path=$guesting_brief_path" >> "$GITHUB_OUTPUT"
          echo "founder_fame_action_queue_overlay_path=$founder_fame_action_queue_overlay_path" >> "$GITHUB_OUTPUT"
          echo "founder_fame_daily_mission_source=$founder_fame_daily_mission_source" >> "$GITHUB_OUTPUT"
          echo "founder_fame_daily_mission_freshness=$founder_fame_daily_mission_freshness" >> "$GITHUB_OUTPUT"
          echo "interview_prep_path=$interview_prep_path" >> "$GITHUB_OUTPUT"
          echo "transcript_ingestion_path=$transcript_ingestion_path" >> "$GITHUB_OUTPUT"
          echo "repurpose_plan_path=$repurpose_plan_path" >> "$GITHUB_OUTPUT"
          echo "uplift_tracker_path=$uplift_tracker_path" >> "$GITHUB_OUTPUT"
          echo "weight_profile_path=$weight_profile_path" >> "$GITHUB_OUTPUT"
          echo "momentum_brief_path=$momentum_brief_path" >> "$GITHUB_OUTPUT"
          echo "opportunity_radar_path=$opportunity_radar_path" >> "$GITHUB_OUTPUT"
          echo "execution_sprint_path=$execution_sprint_path" >> "$GITHUB_OUTPUT"
          echo "execution_scorecard_path=$execution_scorecard_path" >> "$GITHUB_OUTPUT"
          echo "risk_response_path=$risk_response_path" >> "$GITHUB_OUTPUT"
          echo "escalation_queue_path=$escalation_queue_path" >> "$GITHUB_OUTPUT"
          echo "command_center_path=$command_center_path" >> "$GITHUB_OUTPUT"
