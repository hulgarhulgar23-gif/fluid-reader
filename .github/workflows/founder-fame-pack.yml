          echo "war_room_check_path=$war_room_check_path" >> "$GITHUB_OUTPUT"
          echo "war_room_live_check_path=$war_room_live_check_path" >> "$GITHUB_OUTPUT"
          echo "war_room_comment_path=$war_room_comment_path" >> "$GITHUB_OUTPUT"
          echo "first48h_post_pack_path=$first48h_post_pack_path" >> "$GITHUB_OUTPUT"

          {
            echo "## Founder Fame Pack Generated"
            echo ""
            echo "- Week: \`$week\`"
            echo "- Trigger: \`$INPUT_TRIGGER\`"
            echo "- Previous week baseline: \`$previous_week\`"
            echo "- Baseline review: \`$previous_review_path\`"
            echo "- Current review: \`$review_path\`"
            echo "- Weekly delta: \`$delta_path\`"
            echo "- Scoreboard: \`$scoreboard_path\`"
            echo "- Founder update post: \`$post_path\`"
            echo "- Founder fame pack: \`$fame_path\`"
