            echo "- Optional distribution plan overlay: \`${distribution_plan_path:-n/a}\`"
            echo "- Optional founder fame action queue overlay: \`${founder_fame_action_queue_overlay_path:-n/a}\`"
            echo "- Founder fame daily mission source: \`$founder_fame_daily_mission_source\`"
            echo "- Founder fame daily mission freshness: \`$founder_fame_daily_mission_freshness\`"
            echo "- Founder fame repurpose plan: \`$repurpose_plan_path\`"
            echo "- Founder fame uplift tracker: \`$uplift_tracker_path\`"
            echo "- Founder fame weight profile: \`$weight_profile_path\`"
            echo "- Founder fame momentum brief: \`$momentum_brief_path\`"
            echo "- Founder fame opportunity radar: \`$opportunity_radar_path\`"
            echo "- Founder fame execution sprint: \`$execution_sprint_path\`"
            echo "- Founder fame execution scorecard: \`$execution_scorecard_path\`"
            echo "- Founder fame risk response plan: \`$risk_response_path\`"
            echo "- Founder fame escalation queue: \`$escalation_queue_path\`"
            echo "- Founder fame command center: \`$command_center_path\`"
            echo "- Founder fame next-move handoff: \`$next_move_handoff_path\`"
            echo "- Founder fame next-move draft pack: \`$next_move_draft_pack_path\`"
            echo "- In-app fast loop: run \`Fame -> Run Fame Next Move\`, then log artifact link + owner update in \`Monday Publish Checklist <week>\`."
            echo "- Founder fame spotlight pack: \`$spotlight_path\`"
            echo "- Founder fame breakout plan: \`$breakout_path\`"
            echo "- Founder fame outreach sprint: \`$outreach_sprint_path\`"
            echo "- Founder fame proof loop: \`$proof_loop_path\`"
            echo "- Founder fame proof loop verification: \`$proof_loop_check_path\`"
            echo "- Founder fame KPI snapshot: \`$kpi_snapshot_path\`"
            echo "- Founder fame velocity scoreboard: \`$velocity_scoreboard_path\`"
            echo "- Founder fame exceptional loop: \`$exceptional_loop_path\`"
            if [[ "$post_exceptional_loop_comment" == "true" ]]; then
              echo "- Founder fame exceptional-loop checklist comment: \`$exceptional_loop_comment_path\` (upsert enabled)."
              echo "- Founder fame exceptional-loop live verification: \`$exceptional_loop_live_check_path\` (strict)."
            else
              echo "- Founder fame exceptional-loop checklist comment: \`$exceptional_loop_comment_path\` (draft-only; set \`post_exceptional_loop_comment=true\` to enable)."
              echo "- Founder fame exceptional-loop live verification: \`$exceptional_loop_live_check_path\` (non-strict draft validation)."
            fi
            echo "- Founder fame narrative lab: \`$narrative_lab_path\`"
            echo "- Founder fame war room: \`$war_room_path\`"
            echo "- Founder fame war-room verification: \`$war_room_check_path\`"
            if [[ -n "$war_room_comment_path" ]]; then
              echo "- Founder fame war-room checklist comment: \`$war_room_comment_path\`"
              echo "- Founder fame war-room live verification: \`$war_room_live_check_path\` (strict)."
            else
              echo "- Founder fame war-room checklist comment: skipped (set \`post_war_room_comment=true\` to enable)."
              echo "- Founder fame war-room live verification: \`$war_room_live_check_path\` (non-strict draft validation)."
            fi
            echo "- Founder first-48h post pack: \`$first48h_post_pack_path\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload founder artifacts
        uses: actions/upload-artifact@v4
        with:
          name: founder-fame-pack-${{ github.run_id }}
          path: |
            .build/founder/*.md
          if-no-files-found: error
