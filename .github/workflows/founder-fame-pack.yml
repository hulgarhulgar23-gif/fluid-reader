              comment_command+=(--issue "$war_room_comment_issue")
            fi
            "${comment_command[@]}"
          fi

          war_room_verify_args=(
            zsh scripts/verify_founder_fame_war_room_run.sh
            --war-room "$war_room_path"
            --out "$war_room_live_check_path"
          )
