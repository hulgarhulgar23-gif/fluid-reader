            war_room_verify_args+=(--issue "$war_room_comment_issue")
          fi
          if [[ "$post_war_room_comment" == "true" ]]; then
            war_room_verify_args+=(--strict)
          fi
          "${war_room_verify_args[@]}"

          zsh scripts/generate_founder_first48h_post_pack.sh \
            --week "$week" \
            --product "$product_name" \
            --narrative-lab "$narrative_lab_path" \
            --primary-channel "$primary_channel" \
            --backup-channel "$backup_channel" \
            --cta "$cta_text" \
            --primary-char-limit "$first48h_primary_char_limit" \
            --backup-char-limit "$first48h_backup_char_limit" \
            --primary-tone "$first48h_primary_tone" \
            --backup-tone "$first48h_backup_tone" \
            --out "$first48h_post_pack_path"

          for generated_file in \
            "$review_path" \
            "$delta_path" \
            "$scoreboard_path" \
            "$post_path" \
            "$fame_path" \
            "$press_path" \
            "$media_blast_path" \
            "$guesting_queue_path" \
