              const first48hExecutionPlanMatch = body.match(/^\s*-\s*First 48h execution plan:\s*(.+)\s*$/im);
              const distributionDay0Match = body.match(/^\|\s*Day 0\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|/im);

