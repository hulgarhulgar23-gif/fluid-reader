          INPUT_FOUNDER_FAME_DAILY_MISSION_PATH: ${{ github.event.inputs.founder_fame_daily_mission_path || '' }}
          GUESTING_SIGNAL_ENTRIES: ${{ steps.monday_effectiveness.outputs.guesting_signal_entries }}
          GUESTING_SIGNAL_REPLIED: ${{ steps.monday_effectiveness.outputs.guesting_signal_replied }}
          GUESTING_SIGNAL_BOOKED: ${{ steps.monday_effectiveness.outputs.guesting_signal_booked }}
          GUESTING_SIGNAL_PUBLISHED: ${{ steps.monday_effectiveness.outputs.guesting_signal_published }}
          GUESTING_SIGNAL_TOP_FORMAT: ${{ steps.monday_effectiveness.outputs.guesting_signal_top_format }}
          GUESTING_SIGNAL_TOP_TARGET: ${{ steps.monday_effectiveness.outputs.guesting_signal_top_target }}
          GUESTING_SIGNAL_ENRICHMENT_SCORE: ${{ steps.monday_effectiveness.outputs.guesting_signal_enrichment_score }}
          GUESTING_SIGNAL_RECOMMENDATION: ${{ steps.monday_effectiveness.outputs.guesting_signal_recommendation }}
          OUTREACH_SPRINT_COMPLETION_RATE: ${{ steps.outreach_sprint_outcomes.outputs.outreach_sprint_completion_rate }}
          OUTREACH_SPRINT_TASKS_COMPLETED: ${{ steps.outreach_sprint_outcomes.outputs.outreach_sprint_tasks_completed }}
          OUTREACH_SPRINT_TASKS_TOTAL: ${{ steps.outreach_sprint_outcomes.outputs.outreach_sprint_tasks_total }}
          OUTREACH_SPRINT_CREATOR_TASKS_COMPLETED: ${{ steps.outreach_sprint_outcomes.outputs.outreach_sprint_creator_tasks_completed }}
          OUTREACH_SPRINT_GUESTING_TASKS_COMPLETED: ${{ steps.outreach_sprint_outcomes.outputs.outreach_sprint_guesting_tasks_completed }}
          OUTREACH_SPRINT_RECOMMENDATION: ${{ steps.outreach_sprint_outcomes.outputs.outreach_sprint_recommendation }}
          NARRATIVE_ROUTE_WINNER: ${{ steps.monday_effectiveness.outputs.narrative_route_winner }}
          NARRATIVE_ROUTE_TREND: ${{ steps.monday_effectiveness.outputs.narrative_route_trend }}
          NARRATIVE_FAME_VELOCITY_SCORE: ${{ steps.monday_effectiveness.outputs.narrative_fame_velocity_score }}
          NARRATIVE_ROUTE_RECOMMENDATION: ${{ steps.monday_effectiveness.outputs.narrative_route_recommendation }}
        run: |
          set -euo pipefail
          source scripts/fixtures/founder/sample_inputs.env

          resolve_value() {
            local preferred="$1"
            local fallback="$2"
            if [[ -n "$preferred" ]]; then
              echo "$preferred"
            else
              echo "$fallback"
            fi
          }

          safe_slug() {
            echo "$1" \
              | tr '[:space:]/:' '-' \
              | tr -cd '[:alnum:]_.-' \
              | sed -E 's/-+/-/g; s/^-+|-+$//g'
          }

          week_value="$(resolve_value "$INPUT_WEEK" "$(date '+%Y-W%V')")"
          previous_week_value="$(resolve_value "$INPUT_PREVIOUS_WEEK" "$(date -v-7d '+%Y-W%V')")"
          primary_channel_value="$(resolve_value "$INPUT_PRIMARY_CHANNEL" "$PRIMARY_CHANNEL")"
          backup_channel_value="$(resolve_value "$INPUT_BACKUP_CHANNEL" "$BACKUP_CHANNEL")"
          week_slug="$(safe_slug "$week_value")"

          output_dir=".build/founder"
          mkdir -p "$output_dir"
          previous_review_path="$output_dir/weekly-review-${previous_week_value}.md"

          zsh scripts/generate_founder_weekly_review.sh \
            --week "$previous_week_value" \
            --mrr "$PREVIOUS_MRR" \
            --delivery-cost "$PREVIOUS_DELIVERY_COST" \
            --acquisition-spend "$PREVIOUS_ACQUISITION_SPEND" \
            --new-customers "$PREVIOUS_NEW_CUSTOMERS" \
            --monthly-contribution "$PREVIOUS_MONTHLY_CONTRIBUTION" \
            --lifetime-months "$PREVIOUS_LIFETIME_MONTHS" \
            --fixed-cost "$PREVIOUS_FIXED_COST" \
            --price "$PREVIOUS_PRICE" \
            --variable-cost "$PREVIOUS_VARIABLE_COST" \
            --out "$previous_review_path"

          zsh scripts/generate_founder_weekly_pack.sh \
            --week "$week_value" \
            --previous-review "$previous_review_path" \
            --previous-label "$previous_week_value" \
            --mrr "$PACK_MRR" \
            --delivery-cost "$PACK_DELIVERY_COST" \
            --acquisition-spend "$PACK_ACQUISITION_SPEND" \
            --new-customers "$PACK_NEW_CUSTOMERS" \
            --monthly-contribution "$PACK_MONTHLY_CONTRIBUTION" \
            --lifetime-months "$PACK_LIFETIME_MONTHS" \
            --fixed-cost "$PACK_FIXED_COST" \
            --price "$PACK_PRICE" \
            --variable-cost "$PACK_VARIABLE_COST" \
            --target-mrr "$TARGET_MRR" \
            --target-margin "$TARGET_MARGIN" \
            --target-cac "$TARGET_CAC" \
            --target-ltv-cac "$TARGET_LTV_CAC" \
            --target-new-customers "$TARGET_NEW_CUSTOMERS" \
            --product "$PRODUCT_NAME" \
            --primary-channel "$primary_channel_value" \
            --backup-channel "$backup_channel_value" \
            --cta "$CTA_TEXT" \
            --out-dir "$output_dir"

          founder_fame_path="$output_dir/founder-fame-pack-${week_slug}.md"
          founder_press_path="$output_dir/founder-press-kit-${week_slug}.md"
          founder_media_blast_path="$output_dir/founder-media-blast-${week_slug}.md"
          founder_guesting_queue_path="$output_dir/founder-guesting-queue-${week_slug}.md"
          founder_guesting_brief_path="$output_dir/founder-guesting-brief-${week_slug}.md"
          founder_fame_ops_brief_path="$output_dir/founder-fame-ops-brief-${week_slug}.md"
          founder_fame_action_queue_path="$output_dir/founder-fame-action-queue-${week_slug}.md"
          founder_fame_interview_prep_path="$output_dir/founder-fame-interview-prep-${week_slug}.md"
          founder_fame_transcript_ingestion_path="$output_dir/founder-fame-transcript-ingestion-${week_slug}.md"
          founder_fame_repurpose_path="$output_dir/founder-fame-repurpose-plan-${week_slug}.md"
          founder_fame_uplift_tracker_path="$output_dir/founder-fame-uplift-tracker-${week_slug}.md"
          founder_fame_weight_profile_path="$output_dir/founder-fame-weight-profile-${week_slug}.md"
          founder_fame_momentum_brief_path="$output_dir/founder-fame-momentum-brief-${week_slug}.md"
          founder_fame_opportunity_radar_path="$output_dir/founder-fame-opportunity-radar-${week_slug}.md"
          founder_fame_execution_sprint_path="$output_dir/founder-fame-execution-sprint-${week_slug}.md"
          founder_fame_execution_scorecard_path="$output_dir/founder-fame-execution-scorecard-${week_slug}.md"
          founder_fame_risk_response_path="$output_dir/founder-fame-risk-response-plan-${week_slug}.md"
          founder_fame_escalation_queue_path="$output_dir/founder-fame-escalation-queue-${week_slug}.md"
          founder_fame_command_center_path="$output_dir/founder-fame-command-center-${week_slug}.md"
          founder_fame_next_move_handoff_path="$output_dir/founder-fame-next-move-handoff-${week_slug}.md"
          founder_fame_next_move_draft_pack_path="$output_dir/founder-fame-next-move-draft-pack-${week_slug}.md"
          founder_fame_spotlight_path="$output_dir/founder-fame-spotlight-pack-${week_slug}.md"
          founder_fame_breakout_path="$output_dir/founder-fame-breakout-plan-${week_slug}.md"
          founder_fame_outreach_sprint_path="$output_dir/founder-fame-outreach-sprint-${week_slug}.md"
          founder_fame_proof_loop_path="$output_dir/founder-fame-proof-loop-${week_slug}.md"
          founder_fame_proof_loop_check_path="$output_dir/founder-fame-proof-loop-check-${week_slug}.md"
          founder_fame_kpi_snapshot_path="$output_dir/founder-fame-kpi-snapshot-${week_slug}.md"
          founder_fame_velocity_scoreboard_path="$output_dir/founder-fame-velocity-scoreboard-${week_slug}.md"
          founder_fame_exceptional_loop_path="$output_dir/founder-fame-exceptional-loop-${week_slug}.md"
          founder_fame_exceptional_loop_comment_path="$output_dir/founder-fame-exceptional-loop-comment-${week_slug}.md"
          founder_fame_exceptional_loop_live_check_path="$output_dir/founder-fame-exceptional-loop-live-check-${week_slug}.md"
          founder_fame_narrative_lab_path="$output_dir/founder-fame-narrative-lab-${week_slug}.md"
          founder_fame_war_room_path="$output_dir/founder-fame-war-room-${week_slug}.md"
          founder_fame_war_room_check_path="$output_dir/founder-fame-war-room-check-${week_slug}.md"
          founder_fame_war_room_comment_path="$output_dir/founder-fame-war-room-comment-${week_slug}.md"
          founder_fame_war_room_live_check_path="$output_dir/founder-fame-war-room-live-check-${week_slug}.md"

          zsh scripts/generate_founder_press_kit.sh \
            --fame-pack "$founder_fame_path" \
            --week "$week_value" \
            --product "$PRODUCT_NAME" \
            --primary-channel "$primary_channel_value" \
            --backup-channel "$backup_channel_value" \
            --cta "$CTA_TEXT" \
            --out "$founder_press_path"

          zsh scripts/generate_founder_media_blast.sh \
            --fame-pack "$founder_fame_path" \
            --press-kit "$founder_press_path" \
            --update-post "$output_dir/founder-update-${week_slug}.md" \
            --week "$week_value" \
            --product "$PRODUCT_NAME" \
            --primary-channel "$primary_channel_value" \
            --backup-channel "$backup_channel_value" \
            --cta "$CTA_TEXT" \
            --out "$founder_media_blast_path"

          zsh scripts/generate_founder_guesting_queue.sh \
            --fame-pack "$founder_fame_path" \
            --press-kit "$founder_press_path" \
            --media-blast "$founder_media_blast_path" \
            --week "$week_value" \
            --product "$PRODUCT_NAME" \
            --primary-channel "$primary_channel_value" \
            --backup-channel "$backup_channel_value" \
            --guesting-signal-entries "${GUESTING_SIGNAL_ENTRIES:-n/a}" \
            --guesting-signal-replied "${GUESTING_SIGNAL_REPLIED:-n/a}" \
            --guesting-signal-booked "${GUESTING_SIGNAL_BOOKED:-n/a}" \
            --guesting-signal-published "${GUESTING_SIGNAL_PUBLISHED:-n/a}" \
            --guesting-signal-top-format "${GUESTING_SIGNAL_TOP_FORMAT:-n/a}" \
            --guesting-signal-top-target "${GUESTING_SIGNAL_TOP_TARGET:-n/a}" \
            --guesting-signal-enrichment-score "${GUESTING_SIGNAL_ENRICHMENT_SCORE:-n/a}" \
            --guesting-signal-recommendation "${GUESTING_SIGNAL_RECOMMENDATION:-Capture founder guesting signal comments before Friday review.}" \
            --outreach-sprint-completion-rate "${OUTREACH_SPRINT_COMPLETION_RATE:-n/a}" \
            --outreach-sprint-tasks-completed "${OUTREACH_SPRINT_TASKS_COMPLETED:-n/a}" \
            --outreach-sprint-tasks-total "${OUTREACH_SPRINT_TASKS_TOTAL:-n/a}" \
            --outreach-sprint-creator-tasks-completed "${OUTREACH_SPRINT_CREATOR_TASKS_COMPLETED:-n/a}" \
            --outreach-sprint-guesting-tasks-completed "${OUTREACH_SPRINT_GUESTING_TASKS_COMPLETED:-n/a}" \
            --outreach-sprint-recommendation "${OUTREACH_SPRINT_RECOMMENDATION:-Capture founder outreach sprint checklist updates in Monday checklist comments before Friday review.}" \
            --cta "$CTA_TEXT" \
            --out "$founder_guesting_queue_path"

          zsh scripts/generate_founder_guesting_brief.sh \
            --guesting-queue "$founder_guesting_queue_path" \
            --fame-pack "$founder_fame_path" \
            --media-blast "$founder_media_blast_path" \
            --week "$week_value" \
            --product "$PRODUCT_NAME" \
            --primary-channel "$primary_channel_value" \
            --backup-channel "$backup_channel_value" \
            --cta "$CTA_TEXT" \
            --out "$founder_guesting_brief_path"

          if [[ -z "${distribution_plan_path:-}" || -z "${social_proof_wall_path:-}" ]]; then
            echo "Founder fame ops brief sources are missing: distribution_plan_path or social_proof_wall_path." >&2
            exit 1
          fi

          zsh scripts/generate_founder_fame_ops_brief.sh \
            --week "$week_value" \
            --distribution-plan "$distribution_plan_path" \
            --social-proof-wall "$social_proof_wall_path" \
            --fame-pack "$founder_fame_path" \
            --media-blast "$founder_media_blast_path" \
            --guesting-brief "$founder_guesting_brief_path" \
            --out "$founder_fame_ops_brief_path"

          founder_fame_daily_mission_source_path=""
          if [[ -n "$INPUT_FOUNDER_FAME_DAILY_MISSION_PATH" ]]; then
            if [[ ! -f "$INPUT_FOUNDER_FAME_DAILY_MISSION_PATH" ]]; then
              echo "Founder daily mission source file not found: $INPUT_FOUNDER_FAME_DAILY_MISSION_PATH" >&2
              exit 1
            fi
            founder_fame_daily_mission_source_path="$INPUT_FOUNDER_FAME_DAILY_MISSION_PATH"
          fi

          founder_fame_action_queue_args=(
            --week "$week_value"
            --ops-brief "$founder_fame_ops_brief_path"
            --out "$founder_fame_action_queue_path"
          )
          if [[ -n "$founder_fame_daily_mission_source_path" ]]; then
            founder_fame_action_queue_args+=(--daily-mission "$founder_fame_daily_mission_source_path")
            founder_fame_action_queue_args+=(--require-fresh-daily-mission)
          fi
          zsh scripts/generate_founder_fame_action_queue.sh "${founder_fame_action_queue_args[@]}"

          zsh scripts/generate_founder_fame_interview_prep.sh \
            --week "$week_value" \
            --product "$PRODUCT_NAME" \
            --ops-brief "$founder_fame_ops_brief_path" \
            --action-queue "$founder_fame_action_queue_path" \
            --press-kit "$founder_press_path" \
            --media-blast "$founder_media_blast_path" \
            --guesting-brief "$founder_guesting_brief_path" \
            --out "$founder_fame_interview_prep_path"

          founder_transcript_source_path="$founder_fame_interview_prep_path"
          if [[ -n "$INPUT_FOUNDER_TRANSCRIPT_PATH" ]]; then
            if [[ ! -f "$INPUT_FOUNDER_TRANSCRIPT_PATH" ]]; then
              echo "Founder transcript source file not found: $INPUT_FOUNDER_TRANSCRIPT_PATH" >&2
              exit 1
            fi
            founder_transcript_source_path="$INPUT_FOUNDER_TRANSCRIPT_PATH"
          fi

          founder_fame_daily_mission_source="$founder_fame_daily_mission_source_path"
          if [[ -z "$founder_fame_daily_mission_source" ]]; then
            founder_fame_daily_mission_source="(optional input not provided; action queue uses ops-brief only)"
          fi
          founder_fame_daily_mission_freshness_line="$(rg -m1 '^- Mission freshness: ' "$founder_fame_action_queue_path" || true)"
          founder_fame_daily_mission_freshness="${founder_fame_daily_mission_freshness_line#"- Mission freshness: "}"
          if [[ -z "$founder_fame_daily_mission_freshness" ]]; then
            founder_fame_daily_mission_freshness="n/a (missing mission freshness line in action queue artifact)"
          fi

          zsh scripts/generate_founder_fame_transcript_ingestion.sh \
            --week "$week_value" \
            --product "$PRODUCT_NAME" \
            --transcript "$founder_transcript_source_path" \
            --interview-prep "$founder_fame_interview_prep_path" \
            --media-blast "$founder_media_blast_path" \
            --out "$founder_fame_transcript_ingestion_path"

          zsh scripts/generate_founder_fame_repurpose_plan.sh \
            --week "$week_value" \
            --product "$PRODUCT_NAME" \
            --interview-prep "$founder_fame_interview_prep_path" \
            --transcript-ingestion "$founder_fame_transcript_ingestion_path" \
            --media-blast "$founder_media_blast_path" \
            --action-queue "$founder_fame_action_queue_path" \
            --guesting-brief "$founder_guesting_brief_path" \
            --out "$founder_fame_repurpose_path"

          zsh scripts/generate_founder_fame_uplift_tracker.sh \
            --week "$week_value" \
            --product "$PRODUCT_NAME" \
            --campaign-dir "docs/campaigns" \
            --out "$founder_fame_uplift_tracker_path"

          zsh scripts/generate_founder_fame_weight_profile.sh \
            --week "$week_value" \
            --product "$PRODUCT_NAME" \
            --campaign-dir "docs/campaigns" \
            --uplift-tracker "$founder_fame_uplift_tracker_path" \
            --out "$founder_fame_weight_profile_path"

          zsh scripts/generate_founder_fame_momentum_brief.sh \
            --week "$week_value" \
            --product "$PRODUCT_NAME" \
            --fame-pack "$founder_fame_path" \
            --repurpose-plan "$founder_fame_repurpose_path" \
            --transcript-ingestion "$founder_fame_transcript_ingestion_path" \
            --press-kit "$founder_press_path" \
            --media-blast "$founder_media_blast_path" \
            --credibility-ledger "${credibility_ledger_path:-}" \
            --weight-profile "$founder_fame_weight_profile_path" \
            --out "$founder_fame_momentum_brief_path"

          zsh scripts/generate_founder_fame_opportunity_radar.sh \
            --week "$week_value" \
            --product "$PRODUCT_NAME" \
            --momentum-brief "$founder_fame_momentum_brief_path" \
            --weight-profile "$founder_fame_weight_profile_path" \
            --uplift-tracker "$founder_fame_uplift_tracker_path" \
            --winning-hook-library "${winning_hook_library_path:-}" \
            --credibility-ledger "${credibility_ledger_path:-}" \
            --narrative-route-winner "${NARRATIVE_ROUTE_WINNER:-n/a}" \
            --narrative-route-trend "${NARRATIVE_ROUTE_TREND:-n/a}" \
            --narrative-fame-velocity-score "${NARRATIVE_FAME_VELOCITY_SCORE:-n/a}" \
            --narrative-route-recommendation "${NARRATIVE_ROUTE_RECOMMENDATION:-Capture founder fame narrative lab comment before Friday review to track route winners.}" \
            --out "$founder_fame_opportunity_radar_path"

          zsh scripts/generate_founder_fame_execution_sprint.sh \
            --week "$week_value" \
            --product "$PRODUCT_NAME" \
            --opportunity-radar "$founder_fame_opportunity_radar_path" \
            --momentum-brief "$founder_fame_momentum_brief_path" \
            --distribution-plan "${distribution_plan_path:-}" \
            --monday-checkpoint "${checkpoint_path:-}" \
            --reply-pack "${reply_pack_path:-}" \
            --out "$founder_fame_execution_sprint_path"

          zsh scripts/generate_founder_fame_execution_scorecard.sh \
            --week "$week_value" \
            --product "$PRODUCT_NAME" \
            --execution-sprint "$founder_fame_execution_sprint_path" \
            --opportunity-radar "$founder_fame_opportunity_radar_path" \
            --momentum-brief "$founder_fame_momentum_brief_path" \
            --distribution-plan "${distribution_plan_path:-}" \
            --monday-checkpoint "${checkpoint_path:-}" \
            --reply-pack "${reply_pack_path:-}" \
            --out "$founder_fame_execution_scorecard_path"

          zsh scripts/generate_founder_fame_risk_response_plan.sh \
            --week "$week_value" \
            --product "$PRODUCT_NAME" \
            --execution-scorecard "$founder_fame_execution_scorecard_path" \
            --execution-sprint "$founder_fame_execution_sprint_path" \
            --opportunity-radar "$founder_fame_opportunity_radar_path" \
            --momentum-brief "$founder_fame_momentum_brief_path" \
            --distribution-plan "${distribution_plan_path:-}" \
            --reply-pack "${reply_pack_path:-}" \
            --out "$founder_fame_risk_response_path"

          zsh scripts/generate_founder_fame_escalation_queue.sh \
            --week "$week_value" \
            --product "$PRODUCT_NAME" \
            --risk-response-plan "$founder_fame_risk_response_path" \
            --execution-scorecard "$founder_fame_execution_scorecard_path" \
            --execution-sprint "$founder_fame_execution_sprint_path" \
            --distribution-plan "${distribution_plan_path:-}" \
            --reply-pack "${reply_pack_path:-}" \
            --out "$founder_fame_escalation_queue_path"

          zsh scripts/generate_founder_fame_command_center.sh \
            --week "$week_value" \
            --product "$PRODUCT_NAME" \
            --momentum-brief "$founder_fame_momentum_brief_path" \
            --execution-scorecard "$founder_fame_execution_scorecard_path" \
            --risk-response-plan "$founder_fame_risk_response_path" \
            --escalation-queue "$founder_fame_escalation_queue_path" \
            --opportunity-radar "$founder_fame_opportunity_radar_path" \
            --out "$founder_fame_command_center_path"

          zsh scripts/generate_founder_fame_next_move_handoff.sh \
            --week "$week_value" \
            --command-center "$founder_fame_command_center_path" \
            --artifact-link "$founder_fame_command_center_path" \
            --out "$founder_fame_next_move_handoff_path"

          zsh scripts/generate_founder_fame_next_move_draft_pack.sh \
            --week "$week_value" \
            --next-move-handoff "$founder_fame_next_move_handoff_path" \
            --out "$founder_fame_next_move_draft_pack_path"

          zsh scripts/generate_founder_fame_spotlight_pack.sh \
            --week "$week_value" \
            --product "$PRODUCT_NAME" \
            --command-center "$founder_fame_command_center_path" \
            --momentum-brief "$founder_fame_momentum_brief_path" \
            --execution-scorecard "$founder_fame_execution_scorecard_path" \
            --risk-response-plan "$founder_fame_risk_response_path" \
            --primary-channel "$primary_channel_value" \
            --backup-channel "$backup_channel_value" \
            --cta "$CTA_TEXT" \
            --out "$founder_fame_spotlight_path"

          zsh scripts/generate_founder_fame_breakout_plan.sh \
            --week "$week_value" \
            --product "$PRODUCT_NAME" \
            --spotlight-pack "$founder_fame_spotlight_path" \
            --command-center "$founder_fame_command_center_path" \
            --execution-sprint "$founder_fame_execution_sprint_path" \
            --distribution-plan "${distribution_plan_path:-}" \
            --winning-hook-library "${winning_hook_library_path:-}" \
            --credibility-ledger "${credibility_ledger_path:-}" \
            --primary-channel "$primary_channel_value" \
            --backup-channel "$backup_channel_value" \
            --cta "$CTA_TEXT" \
            --out "$founder_fame_breakout_path"

          zsh scripts/generate_founder_fame_outreach_sprint.sh \
            --week "$week_value" \
            --product "$PRODUCT_NAME" \
            --breakout-plan "$founder_fame_breakout_path" \
            --guesting-queue "$founder_guesting_queue_path" \
            --creator-target-list "${creator_target_list_path:-}" \
            --distribution-plan "${distribution_plan_path:-}" \
            --media-blast "$founder_media_blast_path" \
            --primary-channel "$primary_channel_value" \
            --backup-channel "$backup_channel_value" \
            --cta "$CTA_TEXT" \
            --out "$founder_fame_outreach_sprint_path"

          zsh scripts/generate_founder_fame_proof_loop.sh \
            --week "$week_value" \
            --product "$PRODUCT_NAME" \
            --breakout-plan "$founder_fame_breakout_path" \
            --outreach-sprint "$founder_fame_outreach_sprint_path" \
            --spotlight-pack "$founder_fame_spotlight_path" \
            --command-center "$founder_fame_command_center_path" \
            --credibility-ledger "${credibility_ledger_path:-}" \
            --primary-channel "$primary_channel_value" \
            --backup-channel "$backup_channel_value" \
            --cta "$CTA_TEXT" \
            --out "$founder_fame_proof_loop_path"

          for generated_file in \
            "$founder_fame_path" \
            "$founder_press_path" \
            "$founder_media_blast_path" \
            "$founder_guesting_queue_path" \
            "$founder_guesting_brief_path" \
            "$founder_fame_ops_brief_path" \
            "$founder_fame_action_queue_path" \
            "$founder_fame_interview_prep_path" \
            "$founder_fame_transcript_ingestion_path" \
            "$founder_fame_repurpose_path" \
            "$founder_fame_uplift_tracker_path" \
            "$founder_fame_weight_profile_path" \
