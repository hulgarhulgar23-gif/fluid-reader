      - name: Upsert distribution execution nudge
        id: distribution_nudge
        if: steps.monday_publish.outputs.monday_publish_issue_number != ''
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.monday_publish.outputs.monday_publish_issue_number }}
          SOURCE_WEEK: ${{ steps.monday_effectiveness.outputs.source_week }}
          DISTRIBUTION_STATUS: ${{ steps.monday_effectiveness.outputs.distribution_followup_status }}
          DISTRIBUTION_DAYS_COMPLETED: ${{ steps.monday_effectiveness.outputs.distribution_days_completed }}
          DISTRIBUTION_DAYS_TOTAL: ${{ steps.monday_effectiveness.outputs.distribution_days_total }}
          DISTRIBUTION_SCORE: ${{ steps.monday_effectiveness.outputs.distribution_completion_score }}
          DISTRIBUTION_SCORE_DELTA: ${{ steps.monday_effectiveness.outputs.distribution_completion_score_delta }}
          CHANNEL_MIX_RECOMMENDATION: ${{ steps.monday_effectiveness.outputs.channel_mix_recommendation }}
          CHANNEL_ROI_PREFERRED_CHANNEL: ${{ steps.monday_publish.outputs.channel_roi_preferred_channel }}
          CHANNEL_ROI_RECOMMENDATION: ${{ steps.monday_publish.outputs.channel_roi_recommendation }}
          DISTRIBUTION_COMPLETION_THRESHOLD: ${{ inputs.distribution_completion_threshold }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const sourceWeek = String(process.env.SOURCE_WEEK || '').trim() || 'n/a';
            const distributionStatusRaw = String(process.env.DISTRIBUTION_STATUS || 'not started').trim();
            const distributionDaysCompletedRaw = String(process.env.DISTRIBUTION_DAYS_COMPLETED || 'n/a').trim();
            const distributionDaysTotalRaw = String(process.env.DISTRIBUTION_DAYS_TOTAL || 'n/a').trim();
            const distributionScoreRaw = String(process.env.DISTRIBUTION_SCORE || 'n/a').trim();
            const distributionScoreDeltaRaw = String(process.env.DISTRIBUTION_SCORE_DELTA || 'n/a').trim();
            const channelMixRecommendation = String(process.env.CHANNEL_MIX_RECOMMENDATION || 'Keep channel mix balanced until distribution execution score is logged.').trim();
            const channelROIPreferredChannel = String(process.env.CHANNEL_ROI_PREFERRED_CHANNEL || 'balanced').trim();
            const channelROIRecommendation = String(process.env.CHANNEL_ROI_RECOMMENDATION || 'Collect Monday reply + outreach outcomes before locking a single-channel lead.').trim();
            const thresholdRaw = String(process.env.DISTRIBUTION_COMPLETION_THRESHOLD || '75').trim();
            const nudgeMarker = '<!-- weekly-growth-distribution-nudge -->';
            const actionItemsMarker = '<!-- weekly-growth-distribution-action-items -->';
            const escalationStartMarker = '<!-- weekly-growth-distribution-escalation-start -->';
            const escalationEndMarker = '<!-- weekly-growth-distribution-escalation-end -->';
            const dayTaskSpecs = [
              {
                key: 'day0',
                label: 'Day 0 launch proof-first post + initial replies completed.',
                dueWindow: 'within 6 hours'
              },
              {
                key: 'day1',
                label: 'Day 1 support-channel workflow follow-up completed.',
                dueWindow: 'within 18 hours'
              },
              {
                key: 'day2',
                label: 'Day 2 creator/community follow-up wave 1 completed.',
                dueWindow: 'within 24 hours'
              }
            ];

            function parseNumber(value) {
              const match = String(value || '').match(/[+-]?\d+(?:\.\d+)?/);
              if (!match) return null;
              const parsed = Number(match[0]);
              return Number.isFinite(parsed) ? parsed : null;
            }

            function escapeRegex(value) {
              return String(value || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            function normalizeStatus(value) {
              const lowered = String(value || '').toLowerCase();
              if (/(done|complete|completed|finished)/.test(lowered)) return 'completed';
              if (/(in progress|active|running|ongoing)/.test(lowered)) return 'in progress';
              if (/(not started|not-started|pending|todo)/.test(lowered)) return 'not started';
              return 'not started';
            }

            function extractTaskCheckedValue(body, taskLabel) {
              const pattern = new RegExp(`^-\\s*\\[( |x|X)\\]\\s*${escapeRegex(taskLabel)}\\s*$`, 'm');
              const match = String(body || '').match(pattern);
              if (!match) return null;
              return String(match[1] || '').toLowerCase() === 'x';
            }

            function buildEscalationBlock(triggerReason, unresolvedTasks) {
              const escalationTasks = unresolvedTasks
                .map((task) => `- [ ] Escalation: ${task.label} (${task.dueWindow})`)
                .join('\n');

              return `${escalationStartMarker}

              ## Distribution Escalation Queue (Auto-Managed)

              - Source week: ${sourceWeek}
              - Trigger reason: ${triggerReason}
              - Escalated Day 0-Day 2 tasks: ${unresolvedTasks.length}
              - Last refresh: ${new Date().toISOString()}
              ${escalationTasks}

              ${escalationEndMarker}`;
            }

            function upsertEscalationBlock(body, triggerReason, unresolvedTasks) {
              const block = buildEscalationBlock(triggerReason, unresolvedTasks);
              const markerRegex = new RegExp(`${escapeRegex(escalationStartMarker)}[\\s\\S]*?${escapeRegex(escalationEndMarker)}`, 'm');
              return markerRegex.test(body)
                ? body.replace(markerRegex, block.trimEnd())
                : `${body.trimEnd()}\n\n${block.trimEnd()}\n`;
            }

            function stripEscalationBlock(body) {
              const markerRegex = new RegExp(`\\n?${escapeRegex(escalationStartMarker)}[\\s\\S]*?${escapeRegex(escalationEndMarker)}\\n?`, 'm');
              if (!markerRegex.test(body)) return body;
              return `${body.replace(markerRegex, '\n').replace(/\n{3,}/g, '\n\n').trimEnd()}\n`;
            }

            const distributionScore = parseNumber(distributionScoreRaw);
            const threshold = parseNumber(thresholdRaw) ?? 75;
            const distributionDaysCompleted = parseNumber(distributionDaysCompletedRaw);
            const distributionDaysTotal = parseNumber(distributionDaysTotalRaw);
            const normalizedStatus = normalizeStatus(distributionStatusRaw);
            const scoreBelowThreshold = distributionScore === null || distributionScore < threshold;
            const statusNeedsNudge = normalizedStatus !== 'completed';
            const shouldNudge = scoreBelowThreshold || statusNeedsNudge;
            const remainingDays = (distributionDaysCompleted !== null && distributionDaysTotal !== null)
              ? Math.max(distributionDaysTotal - distributionDaysCompleted, 0)
              : null;

            const { data: checklistIssue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber
            });
            let checklistBody = checklistIssue.body || '';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100
            });

            function resolveMarkerComments(marker) {
              const matches = comments
                .filter((comment) => (comment.body || '').includes(marker))
                .sort((left, right) => Number(left.id) - Number(right.id));
              if (matches.length === 0) {
                return { active: null, stale: [] };
              }
              return {
                active: matches[matches.length - 1],
                stale: matches.slice(0, -1)
              };
            }

            async function clearStaleMarkerComments(staleComments, label) {
              if (!Array.isArray(staleComments) || staleComments.length === 0) return;
              for (const staleComment of staleComments) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: staleComment.id
                });
              }
              core.info(`Cleared ${staleComments.length} stale ${label} comment duplicate(s) on issue #${issueNumber}.`);
            }

            const nudgeComments = resolveMarkerComments(nudgeMarker);
            const actionItemsComments = resolveMarkerComments(actionItemsMarker);
            await clearStaleMarkerComments(nudgeComments.stale, 'distribution nudge');
            await clearStaleMarkerComments(actionItemsComments.stale, 'distribution action-items');
            const existingNudge = nudgeComments.active;
            const existingActionItems = actionItemsComments.active;
            const nudgeDuplicateCommentsCleared = nudgeComments.stale.length;
            const actionItemsDuplicateCommentsCleared = actionItemsComments.stale.length;

            core.setOutput('threshold_used', String(threshold));
            core.setOutput('normalized_distribution_status', normalizedStatus);
            core.setOutput('distribution_score_numeric', distributionScore === null ? 'n/a' : String(distributionScore));
            core.setOutput('remaining_distribution_days', remainingDays === null ? 'n/a' : String(remainingDays));
            core.setOutput('nudge_duplicate_comments_cleared', String(nudgeDuplicateCommentsCleared));
            core.setOutput('action_items_duplicate_comments_cleared', String(actionItemsDuplicateCommentsCleared));

            async function writeChecklistBody(nextBody, infoLabel) {
              if (nextBody === checklistBody) return false;
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issueNumber,
                body: nextBody
              });
              checklistBody = nextBody;
              core.info(infoLabel);
              return true;
            }

            if (!shouldNudge) {
              let nudgeCommentAction = 'not-present';
              let actionItemsCommentAction = 'not-present';
              if (existingNudge) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existingNudge.id
                });
                core.info(`Cleared stale distribution nudge comment from issue #${issueNumber}.`);
                core.setOutput('nudge_status', 'cleared');
                nudgeCommentAction = 'deleted';
              } else {
                core.info(`No distribution nudge needed for issue #${issueNumber}.`);
                core.setOutput('nudge_status', 'not-needed');
              }
              if (existingActionItems) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existingActionItems.id
                });
                core.info(`Cleared stale distribution action-items comment from issue #${issueNumber}.`);
                actionItemsCommentAction = 'deleted';
              }
              const escalationBlockChanged = await writeChecklistBody(
                stripEscalationBlock(checklistBody),
                `Cleared stale distribution escalation queue block from checklist issue #${issueNumber}.`
              );
              core.setOutput('nudge_reason', `Score ${distributionScoreRaw} and status ${normalizedStatus} are on track.`);
              core.setOutput('escalation_status', 'cleared');
              core.setOutput('nudge_comment_action', nudgeCommentAction);
              core.setOutput('action_items_comment_action', actionItemsCommentAction);
              core.setOutput('escalation_block_action', escalationBlockChanged ? 'cleared' : 'not-present');
              core.setOutput('escalated_tasks_count', '0');
              core.setOutput('escalated_tasks', 'none');
              return;
            }

            const nudgeReasons = [];
            if (scoreBelowThreshold) {
              if (distributionScore === null) {
                nudgeReasons.push(`distribution score missing (target >= ${threshold}%)`);
              } else {
                nudgeReasons.push(`distribution score ${distributionScoreRaw} below ${threshold}%`);
              }
            }
            if (statusNeedsNudge) {
              nudgeReasons.push(`distribution status is ${normalizedStatus}`);
            }
            const triggerReason = nudgeReasons.join('; ');
            const unresolvedEarlyTasks = dayTaskSpecs
              .map((task) => ({
                ...task,
                checked: extractTaskCheckedValue(checklistBody, task.label)
              }))
              .filter((task) => task.checked !== true);
            const escalatedTasksCount = unresolvedEarlyTasks.length;
            const escalatedTasksText = escalatedTasksCount > 0
              ? unresolvedEarlyTasks.map((task) => task.label).join(' | ')
              : 'none';
            let nudgeCommentAction = 'none';
            let actionItemsCommentAction = 'none';
            let escalationBlockAction = 'none';

            const nudgeBody = `${nudgeMarker}

            ## Distribution Execution Nudge

            - Source week: ${sourceWeek}
            - Trigger reason: ${triggerReason}
            - Distribution status: ${normalizedStatus}
            - Distribution days completed: ${distributionDaysCompletedRaw}/${distributionDaysTotalRaw}
            - Distribution completion score: ${distributionScoreRaw} (Δ ${distributionScoreDeltaRaw})
            - ROI preferred channel: ${channelROIPreferredChannel}
            - Channel mix recommendation: ${channelMixRecommendation}
            - ROI routing note: ${channelROIRecommendation}
            - Escalated Day 0-Day 2 tasks: ${escalatedTasksCount}

            ### Next 24-Hour Actions

            1. Close all unchecked Day 0-Day 2 distribution tasks in the checklist.
            2. Run one practical repost/reply pass on the ROI-preferred channel first.
            3. Update distribution status and completion score after each execution block.
            ${remainingDays !== null ? `4. Burn down remaining distribution days: ${remainingDays}.` : '4. Log completed distribution days so Friday scoring can stay accurate.'}
            `;

            if (existingNudge) {
              const updated = await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingNudge.id,
                body: nudgeBody
              });
              core.info(`Updated distribution nudge comment: ${updated.data.html_url}`);
              nudgeCommentAction = 'updated';
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: nudgeBody
              });
              core.info(`Created distribution nudge comment: ${created.data.html_url}`);
              nudgeCommentAction = 'created';
            }

            if (escalatedTasksCount > 0) {
              const actionItemsBody = `${actionItemsMarker}

              ## Distribution Action Items (Day 0-Day 2)

              - Source week: ${sourceWeek}
              - Trigger reason: ${triggerReason}
              - Escalated task count: ${escalatedTasksCount}
              - Distribution score/status: ${distributionScoreRaw}, ${normalizedStatus}

              ### Immediate execution queue

              ${unresolvedEarlyTasks.map((task, index) => `${index + 1}. [ ] ${task.label} (${task.dueWindow})`).join('\n')}

              ### Logging requirement

              - [ ] Update Distribution follow-up status and Distribution completion score immediately after each task.
              `;

              if (existingActionItems) {
                const updated = await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingActionItems.id,
                  body: actionItemsBody
                });
                core.info(`Updated distribution action-items comment: ${updated.data.html_url}`);
                actionItemsCommentAction = 'updated';
              } else {
                const created = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: actionItemsBody
                });
                core.info(`Created distribution action-items comment: ${created.data.html_url}`);
                actionItemsCommentAction = 'created';
              }

              const escalationBlockChanged = await writeChecklistBody(
                upsertEscalationBlock(checklistBody, triggerReason, unresolvedEarlyTasks),
                `Upserted distribution escalation queue block in checklist issue #${issueNumber}.`
              );
              escalationBlockAction = escalationBlockChanged ? 'upserted' : 'unchanged';
              core.setOutput('escalation_status', 'active');
            } else {
              if (existingActionItems) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existingActionItems.id
                });
                core.info(`Cleared distribution action-items comment; Day 0-Day 2 tasks are complete on issue #${issueNumber}.`);
                actionItemsCommentAction = 'deleted';
              } else {
                actionItemsCommentAction = 'not-present';
              }
              const escalationBlockChanged = await writeChecklistBody(
                stripEscalationBlock(checklistBody),
                `Cleared distribution escalation queue block; Day 0-Day 2 tasks are complete on issue #${issueNumber}.`
              );
              escalationBlockAction = escalationBlockChanged ? 'cleared' : 'not-present';
              core.setOutput('escalation_status', 'no-day0-2-gaps');
            }

            core.setOutput('nudge_status', 'triggered');
            core.setOutput('nudge_reason', triggerReason);
            core.setOutput('nudge_comment_action', nudgeCommentAction);
            core.setOutput('action_items_comment_action', actionItemsCommentAction);
            core.setOutput('escalation_block_action', escalationBlockAction);
            core.setOutput('escalated_tasks_count', String(escalatedTasksCount));
            core.setOutput('escalated_tasks', escalatedTasksText);

      - name: Add distribution nudge summary
        if: steps.distribution_nudge.outputs.nudge_status != ''
        shell: zsh {0}
        run: |
          set -euo pipefail
          {
            echo "- Distribution execution nudge: \`${{ steps.distribution_nudge.outputs.nudge_status }}\`"
            echo "- Distribution nudge reason: \`${{ steps.distribution_nudge.outputs.nudge_reason }}\`"
            echo "- Distribution nudge comment action: \`${{ steps.distribution_nudge.outputs.nudge_comment_action }}\`"
            echo "- Distribution action-items comment action: \`${{ steps.distribution_nudge.outputs.action_items_comment_action }}\`"
            echo "- Distribution escalation block action: \`${{ steps.distribution_nudge.outputs.escalation_block_action }}\`"
            echo "- Distribution threshold used: \`${{ steps.distribution_nudge.outputs.threshold_used }}\`"
            echo "- Distribution normalized status: \`${{ steps.distribution_nudge.outputs.normalized_distribution_status }}\`"
            echo "- Distribution score numeric: \`${{ steps.distribution_nudge.outputs.distribution_score_numeric }}\`"
            echo "- Distribution remaining days: \`${{ steps.distribution_nudge.outputs.remaining_distribution_days }}\`"
            echo "- Distribution duplicate nudge comments cleared: \`${{ steps.distribution_nudge.outputs.nudge_duplicate_comments_cleared }}\`"
            echo "- Distribution duplicate action-items comments cleared: \`${{ steps.distribution_nudge.outputs.action_items_duplicate_comments_cleared }}\`"
            echo "- Distribution escalation status: \`${{ steps.distribution_nudge.outputs.escalation_status }}\`"
            echo "- Distribution escalated Day 0-Day 2 tasks: \`${{ steps.distribution_nudge.outputs.escalated_tasks_count }}\`"
            echo "- Distribution escalated task labels: \`${{ steps.distribution_nudge.outputs.escalated_tasks }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate distribution nudge trace artifact
        if: steps.distribution_nudge.outputs.nudge_status != ''
        shell: zsh {0}
        env:
          WEEK: ${{ steps.sprint_metrics.outputs.week }}
          CHECKLIST_ISSUE_NUMBER: ${{ steps.monday_publish.outputs.monday_publish_issue_number }}
          SOURCE_WEEK: ${{ steps.monday_effectiveness.outputs.source_week }}
          DISTRIBUTION_STATUS_RAW: ${{ steps.monday_effectiveness.outputs.distribution_followup_status }}
          DISTRIBUTION_DAYS_COMPLETED_RAW: ${{ steps.monday_effectiveness.outputs.distribution_days_completed }}
          DISTRIBUTION_DAYS_TOTAL_RAW: ${{ steps.monday_effectiveness.outputs.distribution_days_total }}
          DISTRIBUTION_SCORE_RAW: ${{ steps.monday_effectiveness.outputs.distribution_completion_score }}
          DISTRIBUTION_SCORE_DELTA_RAW: ${{ steps.monday_effectiveness.outputs.distribution_completion_score_delta }}
          CHANNEL_MIX_RECOMMENDATION: ${{ steps.monday_effectiveness.outputs.channel_mix_recommendation }}
          CHANNEL_ROI_PREFERRED_CHANNEL: ${{ steps.monday_publish.outputs.channel_roi_preferred_channel }}
          CHANNEL_ROI_RECOMMENDATION: ${{ steps.monday_publish.outputs.channel_roi_recommendation }}
          NUDGE_STATUS: ${{ steps.distribution_nudge.outputs.nudge_status }}
          NUDGE_REASON: ${{ steps.distribution_nudge.outputs.nudge_reason }}
          NUDGE_COMMENT_ACTION: ${{ steps.distribution_nudge.outputs.nudge_comment_action }}
          ACTION_ITEMS_COMMENT_ACTION: ${{ steps.distribution_nudge.outputs.action_items_comment_action }}
          ESCALATION_BLOCK_ACTION: ${{ steps.distribution_nudge.outputs.escalation_block_action }}
          THRESHOLD_USED: ${{ steps.distribution_nudge.outputs.threshold_used }}
          NORMALIZED_DISTRIBUTION_STATUS: ${{ steps.distribution_nudge.outputs.normalized_distribution_status }}
          DISTRIBUTION_SCORE_NUMERIC: ${{ steps.distribution_nudge.outputs.distribution_score_numeric }}
          REMAINING_DISTRIBUTION_DAYS: ${{ steps.distribution_nudge.outputs.remaining_distribution_days }}
          NUDGE_DUPLICATE_COMMENTS_CLEARED: ${{ steps.distribution_nudge.outputs.nudge_duplicate_comments_cleared }}
          ACTION_ITEMS_DUPLICATE_COMMENTS_CLEARED: ${{ steps.distribution_nudge.outputs.action_items_duplicate_comments_cleared }}
          ESCALATION_STATUS: ${{ steps.distribution_nudge.outputs.escalation_status }}
          ESCALATED_TASKS_COUNT: ${{ steps.distribution_nudge.outputs.escalated_tasks_count }}
          ESCALATED_TASKS: ${{ steps.distribution_nudge.outputs.escalated_tasks }}
        run: |
          set -euo pipefail
          output_dir=".build/growth"
          mkdir -p "$output_dir"
          trace_path="$output_dir/${WEEK}-distribution-nudge-trace.md"

          cat > "$trace_path" <<EOF
          <!-- weekly-growth-distribution-nudge-trace -->
          # Distribution Nudge Trace: ${WEEK}

          ## Trigger Snapshot

          - Source week: ${SOURCE_WEEK:-n/a}
          - Checklist issue number: ${CHECKLIST_ISSUE_NUMBER:-n/a}
          - Nudge status: ${NUDGE_STATUS:-n/a}
          - Nudge reason: ${NUDGE_REASON:-n/a}
          - Threshold used: ${THRESHOLD_USED:-n/a}
          - Distribution status (raw): ${DISTRIBUTION_STATUS_RAW:-n/a}
          - Distribution status (normalized): ${NORMALIZED_DISTRIBUTION_STATUS:-n/a}
          - Distribution score (raw): ${DISTRIBUTION_SCORE_RAW:-n/a}
          - Distribution score (numeric): ${DISTRIBUTION_SCORE_NUMERIC:-n/a}
          - Distribution score delta: ${DISTRIBUTION_SCORE_DELTA_RAW:-n/a}
          - Distribution days completed: ${DISTRIBUTION_DAYS_COMPLETED_RAW:-n/a}/${DISTRIBUTION_DAYS_TOTAL_RAW:-n/a}
          - Remaining distribution days: ${REMAINING_DISTRIBUTION_DAYS:-n/a}

          ## Automation Actions

          - Nudge comment action: ${NUDGE_COMMENT_ACTION:-n/a}
          - Action-items comment action: ${ACTION_ITEMS_COMMENT_ACTION:-n/a}
          - Escalation block action: ${ESCALATION_BLOCK_ACTION:-n/a}
          - Escalation status: ${ESCALATION_STATUS:-n/a}
          - Escalated Day 0-Day 2 task count: ${ESCALATED_TASKS_COUNT:-n/a}
          - Escalated Day 0-Day 2 task labels: ${ESCALATED_TASKS:-n/a}
          - Duplicate nudge comments cleared: ${NUDGE_DUPLICATE_COMMENTS_CLEARED:-0}
          - Duplicate action-items comments cleared: ${ACTION_ITEMS_DUPLICATE_COMMENTS_CLEARED:-0}

          ## Routing Context

          - ROI preferred channel: ${CHANNEL_ROI_PREFERRED_CHANNEL:-n/a}
          - Channel mix recommendation: ${CHANNEL_MIX_RECOMMENDATION:-n/a}
          - ROI routing recommendation: ${CHANNEL_ROI_RECOMMENDATION:-n/a}
          EOF

          echo "distribution_nudge_trace_path=$trace_path" >> "$GITHUB_ENV"

      - name: Add distribution nudge trace summary
        if: env.distribution_nudge_trace_path != ''
        shell: zsh {0}
        run: |
          set -euo pipefail
          {
            echo "- Distribution nudge trace artifact: \`$distribution_nudge_trace_path\`"
            echo "- Distribution nudge verifier command: \`zsh scripts/verify_distribution_nudge_run.sh --repo ${{ github.repository }} --run-id ${{ github.run_id }} --strict\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify distribution nudge state
        id: distribution_nudge_verify
        if: env.distribution_nudge_trace_path != ''
        continue-on-error: true
        shell: zsh {0}
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK: ${{ steps.sprint_metrics.outputs.week }}
          REPO_SLUG: ${{ github.repository }}
          CHECKLIST_ISSUE_NUMBER: ${{ steps.monday_publish.outputs.monday_publish_issue_number }}
        run: |
          set -euo pipefail
          report_path=".build/growth/${WEEK}-distribution-nudge-live-check.md"
          echo "distribution_nudge_live_check_path=$report_path" >> "$GITHUB_ENV"

          set +e
          zsh scripts/verify_distribution_nudge_run.sh \
            --trace "$distribution_nudge_trace_path" \
            --repo "$REPO_SLUG" \
            --issue "$CHECKLIST_ISSUE_NUMBER" \
            --strict \
            --out "$report_path"
          verify_exit_code=$?
          set -e

          echo "distribution_nudge_live_check_exit_code=$verify_exit_code" >> "$GITHUB_ENV"
          exit "$verify_exit_code"

      - name: Add distribution nudge verification summary
        if: env.distribution_nudge_live_check_path != ''
        shell: zsh {0}
        run: |
          set -euo pipefail
          {
            echo "- Distribution nudge live verification report: \`$distribution_nudge_live_check_path\`"
            echo "- Distribution nudge live verification outcome: \`${{ steps.distribution_nudge_verify.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reconcile distribution nudge verification alert comment
        if: env.distribution_nudge_live_check_path != '' && steps.monday_publish.outputs.monday_publish_issue_number != ''
        uses: actions/github-script@v7
        env:
          CHECKLIST_ISSUE_NUMBER: ${{ steps.monday_publish.outputs.monday_publish_issue_number }}
          VERIFICATION_OUTCOME: ${{ steps.distribution_nudge_verify.outcome }}
          LIVE_CHECK_PATH: ${{ env.distribution_nudge_live_check_path }}
          LIVE_CHECK_EXIT_CODE: ${{ env.distribution_nudge_live_check_exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- weekly-growth-distribution-nudge-verifier-failure -->';
            const issueNumber = Number(process.env.CHECKLIST_ISSUE_NUMBER || '');
            if (!Number.isFinite(issueNumber) || issueNumber <= 0) {
              core.info('No valid checklist issue number; skipping verifier alert comment reconciliation.');
              return;
            }

            const verificationOutcome = (process.env.VERIFICATION_OUTCOME || '').trim();
            const liveCheckPath = process.env.LIVE_CHECK_PATH || 'n/a';
            const liveCheckExitCode = process.env.LIVE_CHECK_EXIT_CODE || 'n/a';
            const runUrl = process.env.RUN_URL || '';

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100
            });
            const matching = comments.filter((comment) => (comment.body || '').includes(marker));

            if (verificationOutcome === 'failure') {
              const body = `${marker}

              ## Distribution Nudge Verifier Alert

              - Result: strict verification failed
              - Exit code: ${liveCheckExitCode}
              - Review run: ${runUrl || 'n/a'}
              - Verification report artifact: \`${liveCheckPath}\`
              - Action: Inspect the report, correct issue/comment/body state, then re-run Weekly Growth Review.
              `;

              if (matching.length > 0) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: matching[0].id,
                  body
                });
                core.info(`Updated distribution verifier alert comment on checklist issue #${issueNumber}.`);
                for (const duplicate of matching.slice(1)) {
                  await github.rest.issues.deleteComment({
                    owner,
                    repo,
                    comment_id: duplicate.id
                  });
                  core.info(`Deleted duplicate distribution verifier alert comment: ${duplicate.id}`);
                }
              } else {
                const created = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body
                });
                core.info(`Created distribution verifier alert comment: ${created.data.html_url}`);
              }
            } else {
              for (const existing of matching) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existing.id
                });
                core.info(`Cleared stale distribution verifier alert comment: ${existing.id}`);
              }
              if (matching.length === 0) {
                core.info(`No stale distribution verifier alert comments found on checklist issue #${issueNumber}.`);
              }
            }

      - name: Reconcile distribution nudge verifier incident issue
        id: distribution_nudge_incident
        if: env.distribution_nudge_live_check_path != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          WEEK: ${{ steps.sprint_metrics.outputs.week }}
          CHECKLIST_ISSUE_NUMBER: ${{ steps.monday_publish.outputs.monday_publish_issue_number }}
          VERIFICATION_OUTCOME: ${{ steps.distribution_nudge_verify.outcome }}
          LIVE_CHECK_PATH: ${{ env.distribution_nudge_live_check_path }}
          LIVE_CHECK_EXIT_CODE: ${{ env.distribution_nudge_live_check_exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CRITICAL_THRESHOLD: ${{ inputs.distribution_verifier_critical_threshold }}
          CRITICAL_ASSIGNEE: ${{ inputs.distribution_verifier_critical_assignee }}
          CRITICAL_ASSIGNEES: ${{ inputs.distribution_verifier_critical_assignees }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- weekly-growth-distribution-nudge-verifier-incident -->';
            const incidentLabel = { name: 'growth-incident', color: '5319e7', description: 'Growth automation incident requiring operator intervention' };
            const criticalLabel = { name: 'growth-critical', color: 'b60205', description: 'Critical growth incident due to repeated automation failures' };
            const week = (process.env.WEEK || '').trim() || 'unknown-week';
            const checklistIssueNumberRaw = (process.env.CHECKLIST_ISSUE_NUMBER || '').trim();
            const checklistIssueNumber = Number(checklistIssueNumberRaw);
            const hasChecklistIssue = Number.isFinite(checklistIssueNumber) && checklistIssueNumber > 0;
            const verificationOutcome = (process.env.VERIFICATION_OUTCOME || '').trim();
            const liveCheckPath = process.env.LIVE_CHECK_PATH || 'n/a';
            const liveCheckExitCode = process.env.LIVE_CHECK_EXIT_CODE || 'n/a';
            const runUrl = process.env.RUN_URL || '';
            const criticalThresholdRaw = (process.env.CRITICAL_THRESHOLD || '').trim();
            const parsedCriticalThreshold = Number(criticalThresholdRaw);
            const primaryCriticalAssignee = (process.env.CRITICAL_ASSIGNEE || '').trim().replace(/^@+/, '');
            const fallbackCriticalAssignees = (process.env.CRITICAL_ASSIGNEES || '')
              .split(/[\n,]/)
              .map((value) => value.trim().replace(/^@+/, ''))
              .filter(Boolean);
            const criticalAssigneeCandidates = Array.from(new Set([primaryCriticalAssignee, ...fallbackCriticalAssignees].filter(Boolean)));
            const criticalAssigneeCandidatesText = criticalAssigneeCandidates.length > 0
              ? criticalAssigneeCandidates.map((value) => `@${value}`).join(', ')
              : 'n/a';
            const criticalThreshold = Number.isFinite(parsedCriticalThreshold) && parsedCriticalThreshold >= 2
              ? Math.floor(parsedCriticalThreshold)
              : 3;

            const title = `Growth Incident: Distribution Nudge Verifier ${week}`;
            const { owner, repo } = context.repo;

            async function ensureLabel(label) {
              try {
                await github.rest.issues.getLabel({
                  owner,
                  repo,
                  name: label.name
                });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                  core.info(`Created label: ${label.name}`);
                } else {
                  throw error;
                }
              }
            }

            function parseFailureCount(body) {
              const match = String(body || '').match(/- Failure occurrences for this week:\s*(\d+)/i);
              const value = match ? Number(match[1]) : 0;
              return Number.isFinite(value) && value >= 0 ? Math.floor(value) : 0;
            }

            function buildBody({ failureCount, criticalEscalated }) {
              return `${marker}

              # Growth Incident: Distribution Nudge Verifier ${week}

              - Verification outcome: ${verificationOutcome || 'unknown'}
              - Verification exit code: ${liveCheckExitCode}
              - Review run: ${runUrl || 'n/a'}
              - Verification report artifact: \`${liveCheckPath}\`
              - Checklist issue: ${hasChecklistIssue ? `#${checklistIssueNumber}` : 'n/a'}
              - Failure occurrences for this week: ${failureCount}
              - Critical threshold: ${criticalThreshold}
              - Critical escalation status: ${criticalEscalated ? 'active' : 'monitoring'}
              - Critical owner candidates: ${criticalAssigneeCandidatesText}
              - Action: Fix distribution issue/comment/body state drift, then rerun Weekly Growth Review.
              `;
            }

            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100
            });
            const matches = allIssues
              .filter((issue) => !issue.pull_request)
              .filter((issue) => (issue.body || '').includes(marker))
              .filter((issue) => (issue.body || '').includes(`Distribution Nudge Verifier ${week}`))
              .sort((a, b) => b.number - a.number);

            const primary = matches[0] || null;
            let incidentAction = 'none';
            let incidentIssueNumber = '';
            let failureCount = 0;
            let criticalEscalated = false;
            let criticalAssigneeAction = criticalAssigneeCandidates.length > 0 ? 'monitoring' : 'not-configured';
            let criticalAssigneeSelected = '';
            let criticalAssigneeAttempts = 'n/a';

            await ensureLabel(incidentLabel);
            await ensureLabel(criticalLabel);

            async function assignFirstAvailableAssignee(issueNumber) {
              if (criticalAssigneeCandidates.length === 0 || !Number.isFinite(issueNumber) || issueNumber <= 0) return;
              const attempts = [];
              for (const candidate of criticalAssigneeCandidates) {
                try {
                  await github.rest.issues.addAssignees({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    assignees: [candidate]
                  });
                  criticalAssigneeSelected = candidate;
                  attempts.push(`@${candidate}:assigned`);
                  criticalAssigneeAction = 'assigned';
                  core.info(`Assigned critical verifier owner @${candidate} to incident issue #${issueNumber}.`);
                  break;
                } catch (error) {
                  const code = Number(error.status || 0);
                  const reason = code === 422 || code === 404 ? 'invalid-or-unassignable' : `error-${code || 'unknown'}`;
                  attempts.push(`@${candidate}:${reason}`);
                  core.warning(`Could not assign @${candidate} to incident issue #${issueNumber}: ${error.message}`);
                }
              }
              criticalAssigneeAttempts = attempts.length > 0 ? attempts.join('; ') : 'n/a';
              if (!criticalAssigneeSelected) {
                criticalAssigneeAction = 'assign-failed';
              }
            }

            async function removeConfiguredAssignees(issueNumber, options = {}) {
              if (criticalAssigneeCandidates.length === 0 || !Number.isFinite(issueNumber) || issueNumber <= 0) return;
              const updateAction = options.updateAction !== false;
              const attempts = [];
              let removedCount = 0;
              let failedCount = 0;

              for (const candidate of criticalAssigneeCandidates) {
                try {
                  await github.rest.issues.removeAssignees({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    assignees: [candidate]
                  });
                  removedCount += 1;
                  attempts.push(`@${candidate}:unassigned`);
                  core.info(`Removed critical verifier owner @${candidate} from incident issue #${issueNumber}.`);
                } catch (error) {
                  if (error.status === 404 || error.status === 422) {
                    attempts.push(`@${candidate}:already-unassigned`);
                  } else {
                    failedCount += 1;
                    attempts.push(`@${candidate}:error-${error.status || 'unknown'}`);
                    core.warning(`Could not unassign @${candidate} from incident issue #${issueNumber}: ${error.message}`);
                  }
                }
              }

              if (updateAction) {
                criticalAssigneeSelected = '';
                criticalAssigneeAttempts = attempts.length > 0 ? attempts.join('; ') : 'n/a';
                if (failedCount > 0) {
                  criticalAssigneeAction = 'unassign-failed';
                } else if (removedCount > 0) {
                  criticalAssigneeAction = 'unassigned';
                } else {
                  criticalAssigneeAction = 'already-unassigned';
                }
              }
            }

            if (verificationOutcome === 'failure') {
              const previousCount = primary ? parseFailureCount(primary.body) : 0;
              failureCount = previousCount + 1;
              criticalEscalated = failureCount >= criticalThreshold;
              const body = buildBody({ failureCount, criticalEscalated });
              const desiredLabels = criticalEscalated
                ? [incidentLabel.name, criticalLabel.name]
                : [incidentLabel.name];

              if (!primary) {
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels: desiredLabels
                });
                incidentAction = 'created';
                incidentIssueNumber = String(created.data.number);
                core.info(`Created distribution verifier incident issue #${created.data.number}.`);
              } else {
                const desiredState = primary.state === 'closed' ? 'open' : undefined;
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: primary.number,
                  title,
                  body,
                  ...(desiredState ? { state: desiredState } : {})
                });
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: primary.number,
                  labels: desiredLabels
                });
                if (!criticalEscalated) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner,
                      repo,
                      issue_number: primary.number,
                      name: criticalLabel.name
                    });
                  } catch (error) {
                    if (error.status !== 404) throw error;
                  }
                }
                incidentAction = primary.state === 'closed' ? 'reopened' : 'updated';
                incidentIssueNumber = String(primary.number);
                core.info(`${incidentAction === 'reopened' ? 'Reopened' : 'Updated'} distribution verifier incident issue #${primary.number}.`);
              }

              if (criticalEscalated) {
                await assignFirstAvailableAssignee(Number(incidentIssueNumber));
              } else if (criticalAssigneeCandidates.length > 0) {
                await removeConfiguredAssignees(Number(incidentIssueNumber));
              }

              for (const duplicate of matches.slice(1)) {
                if (duplicate.state === 'open') {
                  if (criticalAssigneeCandidates.length > 0) {
                    await removeConfiguredAssignees(duplicate.number, { updateAction: false });
                  }
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: duplicate.number,
                    state: 'closed'
                  });
                  core.info(`Closed duplicate distribution verifier incident issue #${duplicate.number}.`);
                }
              }
            } else {
              const openMatches = matches.filter((issue) => issue.state === 'open');
              if (openMatches.length > 0) {
                for (const [index, openIssue] of openMatches.entries()) {
                  if (criticalAssigneeCandidates.length > 0) {
                    await removeConfiguredAssignees(openIssue.number, { updateAction: index === 0 });
                  }
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: openIssue.number,
                    state: 'closed'
                  });
                  core.info(`Closed resolved distribution verifier incident issue #${openIssue.number}.`);
                }
                incidentAction = 'closed';
                incidentIssueNumber = String(openMatches[0].number);
              } else {
                core.info(`No open distribution verifier incident issue found for ${week}.`);
              }
              failureCount = 0;
              criticalEscalated = false;
            }

            core.setOutput('incident_action', incidentAction);
            core.setOutput('incident_issue_number', incidentIssueNumber);
            core.setOutput('failure_count', String(failureCount));
            core.setOutput('critical_threshold', String(criticalThreshold));
            core.setOutput('critical_escalated', criticalEscalated ? 'true' : 'false');
            core.setOutput('critical_assignee', criticalAssigneeSelected);
            core.setOutput('critical_assignee_candidates', criticalAssigneeCandidates.join(','));
            core.setOutput('critical_assignee_selected', criticalAssigneeSelected);
            core.setOutput('critical_assignee_attempts', criticalAssigneeAttempts);
            core.setOutput('critical_assignee_action', criticalAssigneeAction);

      - name: Add distribution nudge incident summary
        if: env.distribution_nudge_live_check_path != ''
        shell: zsh {0}
        run: |
          set -euo pipefail
          incident_issue="${{ steps.distribution_nudge_incident.outputs.incident_issue_number }}"
          {
            echo "- Distribution nudge incident issue action: \`${{ steps.distribution_nudge_incident.outputs.incident_action }}\`"
            echo "- Distribution nudge incident issue number: \`${incident_issue:-n/a}\`"
            echo "- Distribution nudge incident failure count: \`${{ steps.distribution_nudge_incident.outputs.failure_count }}\`"
            echo "- Distribution nudge incident critical threshold: \`${{ steps.distribution_nudge_incident.outputs.critical_threshold }}\`"
            echo "- Distribution nudge incident critical escalation: \`${{ steps.distribution_nudge_incident.outputs.critical_escalated }}\`"
            echo "- Distribution nudge incident critical assignee candidates: \`${{ steps.distribution_nudge_incident.outputs.critical_assignee_candidates }}\`"
            echo "- Distribution nudge incident critical assignee selected: \`${{ steps.distribution_nudge_incident.outputs.critical_assignee_selected }}\`"
            echo "- Distribution nudge incident critical assignee attempts: \`${{ steps.distribution_nudge_incident.outputs.critical_assignee_attempts }}\`"
            echo "- Distribution nudge incident critical assignee action: \`${{ steps.distribution_nudge_incident.outputs.critical_assignee_action }}\`"
            echo "- Distribution nudge incident reconciliation outcome: \`${{ steps.distribution_nudge_incident.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reconcile distribution nudge critical escalation comment
        id: distribution_nudge_critical_comment
        if: env.distribution_nudge_live_check_path != '' && steps.monday_publish.outputs.monday_publish_issue_number != '' && steps.distribution_nudge_incident.outcome == 'success'
        uses: actions/github-script@v7
        env:
          CHECKLIST_ISSUE_NUMBER: ${{ steps.monday_publish.outputs.monday_publish_issue_number }}
          VERIFICATION_OUTCOME: ${{ steps.distribution_nudge_verify.outcome }}
          INCIDENT_ISSUE_NUMBER: ${{ steps.distribution_nudge_incident.outputs.incident_issue_number }}
          FAILURE_COUNT: ${{ steps.distribution_nudge_incident.outputs.failure_count }}
          CRITICAL_THRESHOLD: ${{ steps.distribution_nudge_incident.outputs.critical_threshold }}
          CRITICAL_ESCALATED: ${{ steps.distribution_nudge_incident.outputs.critical_escalated }}
          CRITICAL_ASSIGNEE: ${{ steps.distribution_nudge_incident.outputs.critical_assignee_selected }}
          CRITICAL_ASSIGNEE_CANDIDATES: ${{ steps.distribution_nudge_incident.outputs.critical_assignee_candidates }}
          CRITICAL_ASSIGNEE_ATTEMPTS: ${{ steps.distribution_nudge_incident.outputs.critical_assignee_attempts }}
          CRITICAL_ASSIGNEE_ACTION: ${{ steps.distribution_nudge_incident.outputs.critical_assignee_action }}
          CRITICAL_COMMENT_COOLDOWN_HOURS: ${{ inputs.distribution_verifier_critical_comment_cooldown_hours }}
          CRITICAL_COMMENT_MIN_FAILURE_DELTA: ${{ inputs.distribution_verifier_critical_comment_min_failure_delta }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- weekly-growth-distribution-nudge-verifier-critical -->';
            let criticalCommentAction = 'none';
            let criticalCommentCooldownActive = 'false';
            let criticalCommentPolicyReason = 'none';
            let criticalCommentFailureDelta = Number.NaN;

            function emitOutputs(cooldownHours, minFailureDelta) {
              core.setOutput('critical_comment_action', criticalCommentAction);
              core.setOutput('critical_comment_cooldown_hours', String(cooldownHours));
              core.setOutput('critical_comment_cooldown_active', criticalCommentCooldownActive);
              core.setOutput('critical_comment_min_failure_delta', String(minFailureDelta));
              core.setOutput('critical_comment_failure_delta', Number.isFinite(criticalCommentFailureDelta) ? String(criticalCommentFailureDelta) : 'n/a');
              core.setOutput('critical_comment_policy_reason', criticalCommentPolicyReason);
            }

            const cooldownHoursRaw = (process.env.CRITICAL_COMMENT_COOLDOWN_HOURS || '').trim();
            const parsedCooldownHours = Number(cooldownHoursRaw);
            const cooldownHours = Number.isFinite(parsedCooldownHours) && parsedCooldownHours >= 0
              ? parsedCooldownHours
              : 24;
            const minFailureDeltaRaw = (process.env.CRITICAL_COMMENT_MIN_FAILURE_DELTA || '').trim();
            const parsedMinFailureDelta = Number(minFailureDeltaRaw);
            const minFailureDelta = Number.isFinite(parsedMinFailureDelta) && parsedMinFailureDelta >= 1
              ? Math.floor(parsedMinFailureDelta)
              : 1;

            const issueNumber = Number(process.env.CHECKLIST_ISSUE_NUMBER || '');
            if (!Number.isFinite(issueNumber) || issueNumber <= 0) {
              criticalCommentAction = 'skipped-invalid-issue';
              criticalCommentPolicyReason = 'invalid-checklist-issue';
              core.info('No valid checklist issue number; skipping critical escalation comment reconciliation.');
              emitOutputs(cooldownHours, minFailureDelta);
              return;
            }

            const verificationOutcome = (process.env.VERIFICATION_OUTCOME || '').trim();
            const failureCount = (process.env.FAILURE_COUNT || '').trim() || '0';
            const parsedFailureCount = Number(failureCount);
            const failureCountNumber = Number.isFinite(parsedFailureCount) && parsedFailureCount >= 0
              ? Math.floor(parsedFailureCount)
              : 0;
            const criticalThreshold = (process.env.CRITICAL_THRESHOLD || '').trim() || '3';
            const criticalEscalated = (process.env.CRITICAL_ESCALATED || '').trim() === 'true';
            const incidentIssueNumber = (process.env.INCIDENT_ISSUE_NUMBER || '').trim();
            const criticalAssigneeRaw = (process.env.CRITICAL_ASSIGNEE || '').trim();
            const criticalAssignee = criticalAssigneeRaw ? `@${criticalAssigneeRaw.replace(/^@+/, '')}` : 'n/a';
            const criticalAssigneeCandidatesRaw = (process.env.CRITICAL_ASSIGNEE_CANDIDATES || '').trim();
            const criticalAssigneeCandidates = criticalAssigneeCandidatesRaw
              ? criticalAssigneeCandidatesRaw.split(',').map((value) => value.trim()).filter(Boolean).map((value) => `@${value.replace(/^@+/, '')}`).join(', ')
              : 'n/a';
            const criticalAssigneeAttempts = (process.env.CRITICAL_ASSIGNEE_ATTEMPTS || '').trim() || 'n/a';
            const criticalAssigneeAction = (process.env.CRITICAL_ASSIGNEE_ACTION || '').trim() || 'not-configured';
            const runUrl = process.env.RUN_URL || '';
            const shouldEscalate = verificationOutcome === 'failure' && criticalEscalated;

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100
            });
            const matching = comments
              .filter((comment) => (comment.body || '').includes(marker))
              .sort((left, right) => {
                const leftTs = Date.parse(left.updated_at || left.created_at || '') || 0;
                const rightTs = Date.parse(right.updated_at || right.created_at || '') || 0;
                return rightTs - leftTs;
              });

            if (shouldEscalate) {
              const incidentRef = incidentIssueNumber ? `#${incidentIssueNumber}` : 'n/a';
              const body = `${marker}

              ## Distribution Nudge Verifier Critical Escalation

              - Status: active
              - Failure count this week: ${failureCountNumber}
              - Critical threshold: ${criticalThreshold}
              - Incident issue: ${incidentRef}
              - Incident owner candidates: ${criticalAssigneeCandidates}
              - Incident owner: ${criticalAssignee}
              - Incident owner attempts: ${criticalAssigneeAttempts}
              - Incident owner action: ${criticalAssigneeAction}
              - Review run: ${runUrl || 'n/a'}
              - Action: Prioritize incident remediation before next publish window.
              `;

              if (matching.length > 0) {
                const primary = matching[0];
                const existingFailureMatch = String(primary.body || '').match(/- Failure count this week:\s*(\d+)/i);
                const existingFailureCount = existingFailureMatch ? Number(existingFailureMatch[1]) : Number.NaN;
                const primaryUpdatedAt = Date.parse(primary.updated_at || primary.created_at || '');
                const ageHours = Number.isFinite(primaryUpdatedAt)
                  ? ((Date.now() - primaryUpdatedAt) / (1000 * 60 * 60))
                  : Number.POSITIVE_INFINITY;
                const withinCooldown = cooldownHours > 0 && ageHours >= 0 && ageHours < cooldownHours;
                const deltaIsComputable = Number.isFinite(existingFailureCount);
                criticalCommentFailureDelta = deltaIsComputable
                  ? (failureCountNumber - existingFailureCount)
                  : failureCountNumber;
                const deltaSatisfies = !deltaIsComputable || criticalCommentFailureDelta >= minFailureDelta;

                if (withinCooldown && !deltaSatisfies) {
                  criticalCommentAction = 'cooldown-delta-skip';
                  criticalCommentCooldownActive = 'true';
                  criticalCommentPolicyReason = 'within-cooldown-and-delta-below-threshold';
                  core.info(`Skipped critical escalation comment update due to cooldown (${cooldownHours}h): failure delta ${criticalCommentFailureDelta} below minimum ${minFailureDelta}.`);
                } else {
                  await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: primary.id,
                    body
                  });
                  criticalCommentAction = 'updated';
                  criticalCommentPolicyReason = withinCooldown
                    ? 'updated-within-cooldown-delta-threshold-met'
                    : 'updated-cooldown-expired';
                  core.info(`Updated critical distribution verifier escalation comment on checklist issue #${issueNumber}.`);
                }

                for (const duplicate of matching.slice(1)) {
                  await github.rest.issues.deleteComment({
                    owner,
                    repo,
                    comment_id: duplicate.id
                  });
                  core.info(`Deleted duplicate critical distribution verifier escalation comment: ${duplicate.id}`);
                }
              } else {
                const created = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body
                });
                criticalCommentFailureDelta = failureCountNumber;
                criticalCommentAction = 'created';
                criticalCommentPolicyReason = 'created-no-existing-comment';
                core.info(`Created critical distribution verifier escalation comment: ${created.data.html_url}`);
              }
            } else {
              for (const existing of matching) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existing.id
                });
                core.info(`Cleared stale critical distribution verifier escalation comment: ${existing.id}`);
              }
              if (matching.length === 0) {
                core.info(`No stale critical distribution verifier escalation comments found on checklist issue #${issueNumber}.`);
                criticalCommentAction = 'not-present';
                criticalCommentPolicyReason = 'not-escalated-no-comment-present';
              } else {
                criticalCommentAction = 'cleared';
                criticalCommentPolicyReason = 'not-escalated-cleared-comments';
              }
            }

            emitOutputs(cooldownHours, minFailureDelta);

      - name: Add distribution nudge critical comment summary
        if: env.distribution_nudge_live_check_path != '' && steps.monday_publish.outputs.monday_publish_issue_number != '' && steps.distribution_nudge_incident.outcome == 'success' && steps.distribution_nudge_critical_comment.outcome == 'success'
        shell: zsh {0}
        run: |
          set -euo pipefail
          {
            echo "- Distribution nudge critical comment action: \`${{ steps.distribution_nudge_critical_comment.outputs.critical_comment_action }}\`"
            echo "- Distribution nudge critical comment cooldown hours: \`${{ steps.distribution_nudge_critical_comment.outputs.critical_comment_cooldown_hours }}\`"
            echo "- Distribution nudge critical comment cooldown active: \`${{ steps.distribution_nudge_critical_comment.outputs.critical_comment_cooldown_active }}\`"
            echo "- Distribution nudge critical comment min failure delta: \`${{ steps.distribution_nudge_critical_comment.outputs.critical_comment_min_failure_delta }}\`"
            echo "- Distribution nudge critical comment failure delta: \`${{ steps.distribution_nudge_critical_comment.outputs.critical_comment_failure_delta }}\`"
            echo "- Distribution nudge critical comment policy reason: \`${{ steps.distribution_nudge_critical_comment.outputs.critical_comment_policy_reason }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

