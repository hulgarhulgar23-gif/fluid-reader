            function parseFounderNarrativeSummaryFromComment(commentBody) {
              const marker = '<!-- weekly-growth-founder-fame-narrative-lab -->';
              const body = String(commentBody || '');
              if (!body.includes(marker)) return null;

              const routeMatch = body.match(/^\s*-\s*Priority route:\s*(.+)\s*$/im);
              const fameVelocityMatch = body.match(/^\s*-\s*Fame velocity score:\s*([+-]?\d+(?:\.\d+)?)\s*\/\s*100\s*$/im);
              const launchPostureMatch = body.match(/^\s*-\s*Launch posture:\s*(.+)\s*$/im);
              const nextStandupMatch = body.match(/^\s*-\s*Next standup action:\s*(.+)\s*$/im);
              const routeModeMatch = body.match(/^\s*-\s*Route lab mode:\s*(.+)\s*$/im) || body.match(/^\s*-\s*Route KPI mode:\s*(.+)\s*$/im);
              const routeAlignmentTargetMatch = body.match(/^\s*-\s*Route alignment target:\s*(.+)\s*$/im);
              const routeLaneStatusMatch = body.match(/^\s*-\s*Route lane status:\s*(.+)\s*$/im);
              const routeLaneTriggerMatch = body.match(/^\s*-\s*Route lane trigger:\s*(.+)\s*$/im);
              const routeGuardrailMatch = body.match(/^\s*-\s*Route guardrail:\s*(.+)\s*$/im);
