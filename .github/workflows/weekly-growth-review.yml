              for (const line of lines) {
                const match = line.match(fieldRegex);
                if (!match) continue;
                const key = clean(match[1]).toLowerCase();
                const value = clean(match[2]);

                if (key === 'handle') {
                  finalizeCurrent();
                  current = {
                    handleRaw: value,
                    segmentRaw: '',
                    channelRaw: '',
                    fitScoreRaw: '',
                    warmIntroRaw: '',
                    statusRaw: ''
                  };
