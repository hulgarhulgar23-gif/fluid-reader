name: Weekly Growth Review

on:
  schedule:
    - cron: '0 14 * * 5'
  workflow_dispatch:
    inputs:
      week:
        description: 'Sprint week label to review (optional, format: YYYY-Www)'
        required: false
        default: ''
        type: string
      target_win_card:
        description: 'Target Win Card copies'
        required: false
        default: '25'
        type: string
      target_win_recap:
        description: 'Target Win Recap copies'
        required: false
        default: '20'
        type: string
      target_posts:
        description: 'Target public posts shipped'
        required: false
        default: '3'
        type: string
      target_stories:
        description: 'Target user-generated stories'
        required: false
        default: '2'
        type: string
      target_installs:
        description: 'Target inbound installs/trials'
        required: false
        default: '5'
        type: string
      primary_audience_region:
        description: 'Primary audience region (global/us/eu/apac)'
        required: false
        default: 'global'
        type: string
      backup_audience_region:
        description: 'Backup audience region (global/us/eu/apac)'
        required: false
        default: 'global'
        type: string
      distribution_completion_threshold:
        description: 'Minimum distribution completion score before Monday nudge (percent)'
        required: false
        default: '75'
        type: string
      distribution_verifier_critical_threshold:
        description: 'Failure count threshold before verifier incident is marked critical'
        required: false
        default: '3'
        type: string
      distribution_verifier_critical_assignee:
        description: 'GitHub username to assign when verifier incident hits critical threshold'
        required: false
        default: ''
        type: string
      distribution_verifier_critical_assignees:
        description: 'Optional comma-separated fallback assignees (priority order) for critical verifier incidents'
        required: false
        default: ''
        type: string
      distribution_verifier_critical_comment_cooldown_hours:
        description: 'Hours to suppress repeat critical checklist-comment updates when failure count is unchanged'
        required: false
        default: '24'
        type: string
      distribution_verifier_critical_comment_min_failure_delta:
        description: 'Minimum failure-count increase required to update critical checklist comment during cooldown'
        required: false
        default: '1'
        type: string
      founder_verifier_critical_threshold:
        description: 'Failure count threshold before founder proof-loop verifier incident is marked critical'
        required: false
        default: '3'
        type: string
      founder_verifier_critical_assignee:
        description: 'GitHub username to assign when founder proof-loop verifier incident hits critical threshold'
        required: false
        default: ''
        type: string
      founder_verifier_critical_assignees:
        description: 'Optional comma-separated fallback assignees (priority order) for founder verifier critical incidents'
        required: false
        default: ''
        type: string
      founder_verifier_comment_cooldown_hours:
        description: 'Hours to suppress repeat founder verifier checklist-comment updates when failure count is unchanged'
        required: false
        default: '24'
        type: string
      founder_verifier_comment_min_failure_delta:
        description: 'Minimum failure-count increase required to update founder verifier checklist comments during cooldown'
        required: false
        default: '1'
        type: string
      narrative_route_critical_threshold:
        description: 'Critical-route occurrence threshold before narrative route incident is escalated with growth-critical label'
        required: false
        default: '2'
        type: string
      narrative_route_critical_assignee:
        description: 'GitHub username to assign when narrative-route incident reaches critical threshold'
        required: false
        default: ''
        type: string
      narrative_route_critical_assignees:
        description: 'Optional comma-separated fallback assignees (priority order) for narrative-route critical incidents'
        required: false
        default: ''
        type: string
      narrative_route_critical_comment_cooldown_hours:
        description: 'Hours to suppress repeat narrative-route critical checklist-comment updates when occurrence count is unchanged'
        required: false
        default: '24'
        type: string
      narrative_route_critical_comment_min_occurrence_delta:
        description: 'Minimum critical-occurrence increase required to update narrative-route critical checklist comments during cooldown'
        required: false
        default: '1'
        type: string
      founder_transcript_path:
        description: 'Optional founder transcript source path (repo-relative) for founder transcript ingestion'
        required: false
        default: ''
        type: string
      founder_fame_daily_mission_path:
        description: 'Optional founder daily mission source path (repo-relative) for founder action-queue mission bridge'
        required: false
        default: ''
        type: string
      first48h_primary_char_limit:
        description: 'Founder first-48h primary short-variant char limit'
        required: false
        default: '280'
        type: string
      first48h_backup_char_limit:
        description: 'Founder first-48h backup short-variant char limit'
        required: false
        default: '500'
        type: string
      first48h_primary_tone:
        description: 'Founder first-48h primary tone profile (x-punchy|x-thread|neutral)'
        required: false
        default: 'x-punchy'
        type: string
      first48h_backup_tone:
        description: 'Founder first-48h backup tone profile (linkedin-context|linkedin-operator|neutral)'
        required: false
        default: 'linkedin-context'
        type: string

permissions:
  contents: read
  issues: write

jobs:
  weekly-growth-review:
    name: Generate weekly growth review
    runs-on: macos-14
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Locate sprint metrics
        id: sprint_metrics
        uses: actions/github-script@v7
        env:
          INPUT_WEEK: ${{ inputs.week }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const weeklyPrefix = 'Weekly Growth Sprint ';
            const requestedWeek = (process.env.INPUT_WEEK || '').trim();

            function clean(value) {
              if (!value) return '';
              return String(value).replace(/\r?\n/g, ' ').trim();
            }

            function extractMetric(body, label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const regex = new RegExp(`^-\\s*${escaped}:\\s*(.*)$`, 'mi');
              const match = (body || '').match(regex);
              return clean(match ? match[1] : '');
            }

            function parseNumber(value) {
              const match = clean(value).match(/[+-]?\d+(?:\.\d+)?/);
              if (!match) return null;
              const parsed = Number(match[0]);
              return Number.isFinite(parsed) ? parsed : null;
            }

            function normalizeCreatorSignalBoolean(rawValue) {
              const value = clean(rawValue).toLowerCase();
              if (!value) return false;
              return /(yes|y|true|1|warm|introduced|intro|connected)/.test(value);
            }

            function normalizeCreatorSignalChannel(rawValue) {
              const value = clean(rawValue).toLowerCase();
              if (!value) return 'unknown';
              if (/(primary|x|threads|twitter)/.test(value)) return 'primary';
              if (/(backup|linkedin|community|newsletter)/.test(value)) return 'backup';
              return 'unknown';
            }

            function parseCreatorSignalEntriesFromComment(commentBody) {
              const marker = '<!-- weekly-growth-creator-signal -->';
              const body = String(commentBody || '');
              if (!body.includes(marker)) return [];

              const lines = body.split(/\r?\n/);
              const entries = [];
              let current = null;
              const fieldRegex = /^\s*-\s*(handle|segment|channel|fit score|warm intro|status)\s*:\s*(.+)\s*$/i;

              function finalizeCurrent() {
                if (!current) return;
                const hasData = Boolean(
                  clean(current.handleRaw) ||
                  clean(current.segmentRaw) ||
                  clean(current.channelRaw) ||
                  clean(current.fitScoreRaw) ||
                  clean(current.warmIntroRaw) ||
                  clean(current.statusRaw)
                );
                if (!hasData) {
                  current = null;
                  return;
                }

                const fitScore = parseNumber(current.fitScoreRaw);
                const warmIntro = normalizeCreatorSignalBoolean(current.warmIntroRaw) || /(warm|intro)/i.test(clean(current.statusRaw));
                const collabReady = /(collab|collaboration|interview|podcast|co-post|cross-post|ready|confirmed|accepted)/i.test(clean(current.statusRaw));
                const normalizedChannel = normalizeCreatorSignalChannel(current.channelRaw);
                const weightedBase = fitScore === null ? 45 : fitScore;
                const weightedScore = weightedBase + (warmIntro ? 12 : 0) + (collabReady ? 15 : 0);

                entries.push({
                  handle: clean(current.handleRaw) || 'n/a',
                  segment: clean(current.segmentRaw) || 'n/a',
                  channel: normalizedChannel,
                  fitScore,
                  warmIntro,
                  collabReady,
                  weightedScore
                });
                current = null;
              }

              for (const line of lines) {
                const match = line.match(fieldRegex);
                if (!match) continue;
                const key = clean(match[1]).toLowerCase();
                const value = clean(match[2]);

                if (key === 'handle') {
                  finalizeCurrent();
                  current = {
                    handleRaw: value,
                    segmentRaw: '',
                    channelRaw: '',
                    fitScoreRaw: '',
                    warmIntroRaw: '',
                    statusRaw: ''
                  };
                  continue;
                }

                if (!current) {
                  current = {
                    handleRaw: '',
                    segmentRaw: '',
                    channelRaw: '',
                    fitScoreRaw: '',
                    warmIntroRaw: '',
                    statusRaw: ''
                  };
                }

                if (key === 'segment') current.segmentRaw = value;
                if (key === 'channel') current.channelRaw = value;
                if (key === 'fit score') current.fitScoreRaw = value;
                if (key === 'warm intro') current.warmIntroRaw = value;
                if (key === 'status') current.statusRaw = value;
              }

              finalizeCurrent();
              return entries;
            }

            function defaultCreatorSignalSummary() {
              return {
                entries: null,
                highFit: null,
                warmIntros: null,
                collabReady: null,
                primarySignals: null,
                backupSignals: null,
                topSegment: 'n/a',
                topHandle: 'n/a',
                enrichmentScore: null,
                recommendation: 'Capture creator signal comments in Monday checklist before Friday review.'
              };
            }

            function summarizeCreatorSignals(entries) {
              if (!Array.isArray(entries) || entries.length === 0) {
                return defaultCreatorSignalSummary();
              }

              const highFit = entries.filter((entry) => entry.fitScore !== null && entry.fitScore >= 70).length;
              const warmIntros = entries.filter((entry) => entry.warmIntro).length;
              const collabReady = entries.filter((entry) => entry.collabReady).length;
              const primarySignals = entries.filter((entry) => entry.channel === 'primary').length;
              const backupSignals = entries.filter((entry) => entry.channel === 'backup').length;

              const scoredSegments = new Map();
              const fitScores = [];
              let topHandle = 'n/a';
              let topHandleScore = -Infinity;

              for (const entry of entries) {
                const segment = clean(entry.segment) || 'n/a';
                const weightedScore = Number.isFinite(entry.weightedScore) ? entry.weightedScore : 0;
                if (!scoredSegments.has(segment)) {
                  scoredSegments.set(segment, { total: 0, count: 0 });
                }
                const bucket = scoredSegments.get(segment);
                bucket.total += weightedScore;
                bucket.count += 1;

                if (entry.fitScore !== null) {
                  fitScores.push(entry.fitScore);
                }

                if (entry.handle && entry.handle !== 'n/a' && weightedScore > topHandleScore) {
                  topHandle = entry.handle;
                  topHandleScore = weightedScore;
                }
              }

              let topSegment = 'n/a';
              let topSegmentScore = -Infinity;
              for (const [segment, bucket] of scoredSegments.entries()) {
                if (!bucket || bucket.count <= 0) continue;
                const averageScore = bucket.total / bucket.count;
                if (averageScore > topSegmentScore) {
                  topSegmentScore = averageScore;
                  topSegment = segment;
                }
              }

              const averageFit = fitScores.length > 0
                ? fitScores.reduce((sum, value) => sum + value, 0) / fitScores.length
                : 45;
              const enrichmentScoreRaw = (averageFit * 0.55) + (highFit * 4) + (warmIntros * 6) + (collabReady * 8) + (entries.length * 2);
              const enrichmentScore = Math.max(0, Math.min(100, Math.round(enrichmentScoreRaw)));

              let recommendation = 'Capture at least 5 creator signal comments in Monday checklist to improve target ranking confidence.';
              if (enrichmentScore >= 75) {
                recommendation = 'Prioritize high-fit creator handles first and personalize intros with workflow-specific proof.';
              } else if (entries.length >= 5) {
                recommendation = 'Increase warm-intro and collab-ready coverage for the current top segment before next Friday review.';
              } else if (entries.length >= 1) {
                recommendation = 'Add more creator signal entries to reach at least 5 scored handles and improve ranking confidence.';
              }

              return {
                entries: entries.length,
                highFit,
                warmIntros,
                collabReady,
                primarySignals,
                backupSignals,
                topSegment,
                topHandle,
                enrichmentScore,
                recommendation
              };
            }

            async function extractCreatorSignalSummary(issueNumber) {
              const normalizedIssueNumber = Number(issueNumber);
              if (!Number.isFinite(normalizedIssueNumber) || normalizedIssueNumber <= 0) {
                return defaultCreatorSignalSummary();
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: normalizedIssueNumber,
                per_page: 100
              });

              const signalEntries = comments.flatMap((comment) => parseCreatorSignalEntriesFromComment(comment.body || ''));
              return summarizeCreatorSignals(signalEntries);
            }

            function normalizeGuestingSignalBoolean(rawValue) {
              const value = clean(rawValue).toLowerCase();
              if (!value) return false;
              return /(yes|y|true|1|warm|introduced|intro|connected)/.test(value);
            }

            function normalizeGuestingSignalChannel(rawValue) {
              const value = clean(rawValue).toLowerCase();
              if (!value) return 'unknown';
              if (/(primary|x|threads|twitter)/.test(value)) return 'primary';
              if (/(backup|linkedin|community|newsletter)/.test(value)) return 'backup';
              return 'unknown';
            }

            function normalizeGuestingSignalFormat(rawValue) {
              const value = clean(rawValue).toLowerCase();
              if (!value) return 'n/a';
              if (/(podcast|interview|audio)/.test(value)) return 'podcast';
              if (/(newsletter|written|substack)/.test(value)) return 'newsletter';
              if (/(community|forum|group|slack|discord)/.test(value)) return 'community';
              if (/(video|youtube|stream|livestream)/.test(value)) return 'video';
              if (/(event|meetup|conference|webinar)/.test(value)) return 'event';
              return value;
            }

            function normalizeGuestingSignalStage(rawValue) {
              const value = clean(rawValue).toLowerCase();
              if (!value) return 'pitched';
              if (/(publish|live|aired|released)/.test(value)) return 'published';
              if (/(book|scheduled|confirmed|accepted)/.test(value)) return 'booked';
              if (/(reply|respond|interested|warm)/.test(value)) return 'replied';
              if (/(pitched|sent|queued|pending)/.test(value)) return 'pitched';
              return 'pitched';
            }

            function parseGuestingSignalEntriesFromComment(commentBody) {
              const marker = '<!-- weekly-growth-founder-guesting-signal -->';
              const body = String(commentBody || '');
              if (!body.includes(marker)) return [];

              const lines = body.split(/\r?\n/);
              const entries = [];
              let current = null;
              const fieldRegex = /^\s*-\s*(target|format|stage|lead channel|priority score|warm intro|status)\s*:\s*(.+)\s*$/i;

              function finalizeCurrent() {
                if (!current) return;
                const hasData = Boolean(
                  clean(current.targetRaw) ||
                  clean(current.formatRaw) ||
                  clean(current.stageRaw) ||
                  clean(current.channelRaw) ||
                  clean(current.priorityRaw) ||
                  clean(current.warmIntroRaw) ||
                  clean(current.statusRaw)
                );
                if (!hasData) {
                  current = null;
                  return;
                }

                const stage = normalizeGuestingSignalStage(current.stageRaw || current.statusRaw);
                const format = normalizeGuestingSignalFormat(current.formatRaw);
                const channel = normalizeGuestingSignalChannel(current.channelRaw);
                const priorityScore = parseNumber(current.priorityRaw);
                const warmIntro = normalizeGuestingSignalBoolean(current.warmIntroRaw) || /(warm|intro|connected)/i.test(clean(current.statusRaw));
                const priorityBase = priorityScore === null ? 50 : priorityScore;
                const stageBonusMap = { pitched: 3, replied: 9, booked: 16, published: 22 };
                const stageBonus = stageBonusMap[stage] || 0;
                const weightedScore = priorityBase + stageBonus + (warmIntro ? 8 : 0);

                entries.push({
                  target: clean(current.targetRaw) || 'n/a',
                  format,
                  stage,
                  channel,
                  priorityScore,
                  warmIntro,
                  weightedScore
                });
                current = null;
              }

              for (const line of lines) {
                const match = line.match(fieldRegex);
                if (!match) continue;
                const key = clean(match[1]).toLowerCase();
                const value = clean(match[2]);

                if (key === 'target') {
                  finalizeCurrent();
                  current = {
                    targetRaw: value,
                    formatRaw: '',
                    stageRaw: '',
                    channelRaw: '',
                    priorityRaw: '',
                    warmIntroRaw: '',
                    statusRaw: ''
                  };
                  continue;
                }

                if (!current) {
                  current = {
                    targetRaw: '',
                    formatRaw: '',
                    stageRaw: '',
                    channelRaw: '',
                    priorityRaw: '',
                    warmIntroRaw: '',
                    statusRaw: ''
                  };
                }

                if (key === 'format') current.formatRaw = value;
                if (key === 'stage') current.stageRaw = value;
                if (key === 'lead channel') current.channelRaw = value;
                if (key === 'priority score') current.priorityRaw = value;
                if (key === 'warm intro') current.warmIntroRaw = value;
                if (key === 'status') current.statusRaw = value;
              }

              finalizeCurrent();
              return entries;
            }

            function defaultGuestingSignalSummary() {
              return {
                entries: null,
                replied: null,
                booked: null,
                published: null,
                primarySignals: null,
                backupSignals: null,
                topFormat: 'n/a',
                topTarget: 'n/a',
                enrichmentScore: null,
                recommendation: 'Capture founder guesting signal comments before Friday review.'
              };
            }

            function summarizeGuestingSignals(entries) {
              if (!Array.isArray(entries) || entries.length === 0) {
                return defaultGuestingSignalSummary();
              }

              const replied = entries.filter((entry) => ['replied', 'booked', 'published'].includes(entry.stage)).length;
              const booked = entries.filter((entry) => ['booked', 'published'].includes(entry.stage)).length;
              const published = entries.filter((entry) => entry.stage === 'published').length;
              const primarySignals = entries.filter((entry) => entry.channel === 'primary').length;
              const backupSignals = entries.filter((entry) => entry.channel === 'backup').length;
              const warmIntros = entries.filter((entry) => entry.warmIntro).length;

              const scoredFormats = new Map();
              let topTarget = 'n/a';
              let topTargetScore = -Infinity;
              const priorityScores = [];

              for (const entry of entries) {
                const format = clean(entry.format) || 'n/a';
                const weightedScore = Number.isFinite(entry.weightedScore) ? entry.weightedScore : 0;
                if (!scoredFormats.has(format)) {
                  scoredFormats.set(format, { total: 0, count: 0 });
                }
                const bucket = scoredFormats.get(format);
                bucket.total += weightedScore;
                bucket.count += 1;

                if (entry.priorityScore !== null) {
                  priorityScores.push(entry.priorityScore);
                }

                if (entry.target && entry.target !== 'n/a' && weightedScore > topTargetScore) {
                  topTarget = entry.target;
                  topTargetScore = weightedScore;
                }
              }

              let topFormat = 'n/a';
              let topFormatScore = -Infinity;
              for (const [format, bucket] of scoredFormats.entries()) {
                if (!bucket || bucket.count <= 0) continue;
                const averageScore = bucket.total / bucket.count;
                if (averageScore > topFormatScore) {
                  topFormatScore = averageScore;
                  topFormat = format;
                }
              }

              const averagePriority = priorityScores.length > 0
                ? priorityScores.reduce((sum, value) => sum + value, 0) / priorityScores.length
                : 50;
              const enrichmentScoreRaw = (averagePriority * 0.45) + (replied * 4) + (booked * 8) + (published * 10) + (warmIntros * 5) + (entries.length * 2);
              const enrichmentScore = Math.max(0, Math.min(100, Math.round(enrichmentScoreRaw)));

              let recommendation = 'Capture at least 5 founder guesting signal comments to prioritize interview and newsletter targets.';
              if (enrichmentScore >= 75) {
                recommendation = 'Prioritize booked/published guesting targets first and scale the top-performing format this week.';
              } else if (booked >= 2) {
                recommendation = 'Double down on booked guesting slots and turn replies into confirmed calendar holds.';
              } else if (entries.length >= 3) {
                recommendation = 'Increase booked conversion by tightening follow-up cadence on replied targets.';
              }

              return {
                entries: entries.length,
                replied,
                booked,
                published,
                primarySignals,
                backupSignals,
                topFormat,
                topTarget,
                enrichmentScore,
                recommendation
              };
            }

            async function extractGuestingSignalSummary(issueNumber) {
              const normalizedIssueNumber = Number(issueNumber);
              if (!Number.isFinite(normalizedIssueNumber) || normalizedIssueNumber <= 0) {
                return defaultGuestingSignalSummary();
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: normalizedIssueNumber,
                per_page: 100
              });

              const signalEntries = comments.flatMap((comment) => parseGuestingSignalEntriesFromComment(comment.body || ''));
              return summarizeGuestingSignals(signalEntries);
            }

            function normalizeCreatorSignalBoolean(rawValue) {
              const value = clean(rawValue).toLowerCase();
              if (!value) return false;
              return /(yes|y|true|1|warm|introduced|intro|connected)/.test(value);
            }

            function normalizeCreatorSignalChannel(rawValue) {
              const value = clean(rawValue).toLowerCase();
              if (!value) return 'unknown';
              if (/(primary|x|threads|twitter)/.test(value)) return 'primary';
              if (/(backup|linkedin|community|newsletter)/.test(value)) return 'backup';
              return 'unknown';
            }

            function parseCreatorSignalEntriesFromComment(commentBody) {
              const marker = '<!-- weekly-growth-creator-signal -->';
              const body = String(commentBody || '');
              if (!body.includes(marker)) return [];

              const lines = body.split(/\r?\n/);
              const entries = [];
              let current = null;
              const fieldRegex = /^\s*-\s*(handle|segment|channel|fit score|warm intro|status)\s*:\s*(.+)\s*$/i;

              function finalizeCurrent() {
                if (!current) return;
                const hasData = Boolean(
                  clean(current.handleRaw) ||
                  clean(current.segmentRaw) ||
                  clean(current.channelRaw) ||
                  clean(current.fitScoreRaw) ||
                  clean(current.warmIntroRaw) ||
                  clean(current.statusRaw)
                );
                if (!hasData) {
                  current = null;
                  return;
                }

                const fitScore = parseNumber(current.fitScoreRaw);
                const warmIntro = normalizeCreatorSignalBoolean(current.warmIntroRaw) || /(warm|intro)/i.test(clean(current.statusRaw));
                const collabReady = /(collab|collaboration|interview|podcast|co-post|cross-post|ready|confirmed|accepted)/i.test(clean(current.statusRaw));
                const normalizedChannel = normalizeCreatorSignalChannel(current.channelRaw);
                const weightedBase = fitScore === null ? 45 : fitScore;
                const weightedScore = weightedBase + (warmIntro ? 12 : 0) + (collabReady ? 15 : 0);

                entries.push({
                  handle: clean(current.handleRaw) || 'n/a',
                  segment: clean(current.segmentRaw) || 'n/a',
                  channel: normalizedChannel,
                  fitScore,
                  warmIntro,
                  collabReady,
                  weightedScore
                });
                current = null;
              }

              for (const line of lines) {
                const match = line.match(fieldRegex);
                if (!match) continue;
                const key = clean(match[1]).toLowerCase();
                const value = clean(match[2]);

                if (key === 'handle') {
                  finalizeCurrent();
                  current = {
                    handleRaw: value,
                    segmentRaw: '',
                    channelRaw: '',
                    fitScoreRaw: '',
                    warmIntroRaw: '',
                    statusRaw: ''
                  };
                  continue;
                }

                if (!current) {
                  current = {
                    handleRaw: '',
                    segmentRaw: '',
                    channelRaw: '',
                    fitScoreRaw: '',
                    warmIntroRaw: '',
                    statusRaw: ''
                  };
                }

                if (key === 'segment') current.segmentRaw = value;
                if (key === 'channel') current.channelRaw = value;
                if (key === 'fit score') current.fitScoreRaw = value;
                if (key === 'warm intro') current.warmIntroRaw = value;
                if (key === 'status') current.statusRaw = value;
              }

              finalizeCurrent();
              return entries;
            }

            function defaultCreatorSignalSummary() {
              return {
                entries: null,
                highFit: null,
                warmIntros: null,
                collabReady: null,
                primarySignals: null,
                backupSignals: null,
                topSegment: 'n/a',
                topHandle: 'n/a',
                enrichmentScore: null,
                recommendation: 'Capture creator signal comments in Monday checklist before Friday review.'
              };
            }

            function summarizeCreatorSignals(entries) {
              if (!Array.isArray(entries) || entries.length === 0) {
                return defaultCreatorSignalSummary();
              }

              const highFit = entries.filter((entry) => entry.fitScore !== null && entry.fitScore >= 70).length;
              const warmIntros = entries.filter((entry) => entry.warmIntro).length;
              const collabReady = entries.filter((entry) => entry.collabReady).length;
              const primarySignals = entries.filter((entry) => entry.channel === 'primary').length;
              const backupSignals = entries.filter((entry) => entry.channel === 'backup').length;

              const scoredSegments = new Map();
              const fitScores = [];
              let topHandle = 'n/a';
              let topHandleScore = -Infinity;

              for (const entry of entries) {
                const segment = clean(entry.segment) || 'n/a';
                const weightedScore = Number.isFinite(entry.weightedScore) ? entry.weightedScore : 0;
                if (!scoredSegments.has(segment)) {
                  scoredSegments.set(segment, { total: 0, count: 0 });
                }
                const bucket = scoredSegments.get(segment);
                bucket.total += weightedScore;
                bucket.count += 1;

                if (entry.fitScore !== null) {
                  fitScores.push(entry.fitScore);
                }

                if (entry.handle && entry.handle !== 'n/a' && weightedScore > topHandleScore) {
                  topHandle = entry.handle;
                  topHandleScore = weightedScore;
                }
              }

              let topSegment = 'n/a';
              let topSegmentScore = -Infinity;
              for (const [segment, bucket] of scoredSegments.entries()) {
                if (!bucket || bucket.count <= 0) continue;
                const averageScore = bucket.total / bucket.count;
                if (averageScore > topSegmentScore) {
                  topSegmentScore = averageScore;
                  topSegment = segment;
                }
              }

              const averageFit = fitScores.length > 0
                ? fitScores.reduce((sum, value) => sum + value, 0) / fitScores.length
                : 45;
              const enrichmentScoreRaw = (averageFit * 0.55) + (highFit * 4) + (warmIntros * 6) + (collabReady * 8) + (entries.length * 2);
              const enrichmentScore = Math.max(0, Math.min(100, Math.round(enrichmentScoreRaw)));

              let recommendation = 'Capture at least 5 creator signal comments in Monday checklist to improve target ranking confidence.';
              if (enrichmentScore >= 75) {
                recommendation = 'Prioritize high-fit creator handles first and personalize intros with workflow-specific proof.';
              } else if (entries.length >= 5) {
                recommendation = 'Increase warm-intro and collab-ready coverage for the current top segment before next Friday review.';
              } else if (entries.length >= 1) {
                recommendation = 'Add more creator signal entries to reach at least 5 scored handles and improve ranking confidence.';
              }

              return {
                entries: entries.length,
                highFit,
                warmIntros,
                collabReady,
                primarySignals,
                backupSignals,
                topSegment,
                topHandle,
                enrichmentScore,
                recommendation
              };
            }

            async function extractCreatorSignalSummary(issueNumber) {
              const normalizedIssueNumber = Number(issueNumber);
              if (!Number.isFinite(normalizedIssueNumber) || normalizedIssueNumber <= 0) {
                return defaultCreatorSignalSummary();
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: normalizedIssueNumber,
                per_page: 100
              });

              const signalEntries = comments.flatMap((comment) => parseCreatorSignalEntriesFromComment(comment.body || ''));
              return summarizeCreatorSignals(signalEntries);
            }

            function formatDelta(currentValue, baselineValue) {
              const currentNumber = parseNumber(currentValue);
              const baselineNumber = parseNumber(baselineValue);
              if (currentNumber === null || baselineNumber === null) return '';
              const delta = currentNumber - baselineNumber;
              const rounded = Number.isInteger(delta)
                ? String(delta)
                : String(Math.round(delta * 100) / 100);
              return delta > 0 ? `+${rounded}` : rounded;
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'all',
              per_page: 100
            });

            const sprintIssues = issues
              .filter((issue) => !issue.pull_request && issue.title.startsWith(weeklyPrefix))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            let current = null;
            if (requestedWeek) {
              current = sprintIssues.find((issue) =>
                clean(issue.title.replace(weeklyPrefix, '')) === requestedWeek
              ) || null;
            }

            if (!current) {
              current = sprintIssues.find((issue) => issue.state === 'open') || sprintIssues[0] || null;
            }

            if (!current) {
              core.setOutput('issue_number', '');
              core.setOutput('week', '');
              core.warning('No weekly sprint issue found. Skipping review generation.');
              return;
            }

            const currentWeek = clean(current.title.replace(weeklyPrefix, ''));
            const previous = sprintIssues.find((issue) => issue.number !== current.number) || null;
            const previousBaseline = sprintIssues.find((issue) =>
              issue.number !== current.number &&
              (!previous || issue.number !== previous.number)
            ) || null;
            const currentBody = current.body || '';
            const previousBody = previous ? (previous.body || '') : '';

            const currentWinCard = extractMetric(currentBody, 'Win Card copies');
            const currentWinRecap = extractMetric(currentBody, 'Win Recap copies');
            const currentPosts = extractMetric(currentBody, 'Public posts shipped');
            const currentStories = extractMetric(currentBody, 'User-generated stories');
            const currentInstalls = extractMetric(currentBody, 'Inbound installs/trials');
            const metricFocus = extractMetric(currentBody, 'Metric focus');
            const primaryChannel = extractMetric(currentBody, 'Primary channel');
            const backupChannel = extractMetric(currentBody, 'Backup channel');

            const previousWinCard = extractMetric(previousBody, 'Win Card copies');
            const previousWinRecap = extractMetric(previousBody, 'Win Recap copies');
            const previousPosts = extractMetric(previousBody, 'Public posts shipped');
            const previousStories = extractMetric(previousBody, 'User-generated stories');
            const previousInstalls = extractMetric(previousBody, 'Inbound installs/trials');

            core.setOutput('issue_number', String(current.number));
            core.setOutput('week', currentWeek);
            core.setOutput('metric_focus', metricFocus);
            core.setOutput('primary_channel', primaryChannel);
            core.setOutput('backup_channel', backupChannel);
            core.setOutput('previous_week', previous ? clean(previous.title.replace(weeklyPrefix, '')) : '');
            core.setOutput('previous_baseline_week', previousBaseline ? clean(previousBaseline.title.replace(weeklyPrefix, '')) : '');
            core.setOutput('win_card', currentWinCard);
            core.setOutput('win_card_delta', formatDelta(currentWinCard, previousWinCard));
            core.setOutput('win_recap', currentWinRecap);
            core.setOutput('win_recap_delta', formatDelta(currentWinRecap, previousWinRecap));
            core.setOutput('posts', currentPosts);
            core.setOutput('posts_delta', formatDelta(currentPosts, previousPosts));
            core.setOutput('stories', currentStories);
            core.setOutput('stories_delta', formatDelta(currentStories, previousStories));
            core.setOutput('installs', currentInstalls);
            core.setOutput('installs_delta', formatDelta(currentInstalls, previousInstalls));
            core.info(`Preparing review for issue #${current.number}: ${current.title}`);

      - name: Extract previous Monday checklist effectiveness
