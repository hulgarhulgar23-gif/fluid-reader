      - name: Classify sprint health
        if: steps.sprint_metrics.outputs.issue_number != ''
        id: sprint_health
        uses: actions/github-script@v7
        env:
          WIN_CARD: ${{ steps.sprint_metrics.outputs.win_card }}
          WIN_RECAP: ${{ steps.sprint_metrics.outputs.win_recap }}
          POSTS: ${{ steps.sprint_metrics.outputs.posts }}
          STORIES: ${{ steps.sprint_metrics.outputs.stories }}
          INSTALLS: ${{ steps.sprint_metrics.outputs.installs }}
          TARGET_WIN_CARD: ${{ inputs.target_win_card }}
          TARGET_WIN_RECAP: ${{ inputs.target_win_recap }}
          TARGET_POSTS: ${{ inputs.target_posts }}
          TARGET_STORIES: ${{ inputs.target_stories }}
          TARGET_INSTALLS: ${{ inputs.target_installs }}
        with:
          script: |
            function parseNumber(value) {
              const match = String(value || '').match(/[+-]?\d+(?:\.\d+)?/);
              if (!match) return null;
              const parsed = Number(match[0]);
              return Number.isFinite(parsed) ? parsed : null;
            }

            const metrics = [
              { name: 'Win Card copies', value: parseNumber(process.env.WIN_CARD), target: parseNumber(process.env.TARGET_WIN_CARD) ?? 25 },
              { name: 'Win Recap copies', value: parseNumber(process.env.WIN_RECAP), target: parseNumber(process.env.TARGET_WIN_RECAP) ?? 20 },
              { name: 'Public posts shipped', value: parseNumber(process.env.POSTS), target: parseNumber(process.env.TARGET_POSTS) ?? 3 },
              { name: 'User-generated stories', value: parseNumber(process.env.STORIES), target: parseNumber(process.env.TARGET_STORIES) ?? 2 },
              { name: 'Inbound installs/trials', value: parseNumber(process.env.INSTALLS), target: parseNumber(process.env.TARGET_INSTALLS) ?? 5 }
            ];

            let onTrackCount = 0;
            let missingMetricCount = 0;
            for (const metric of metrics) {
              if (metric.value === null) {
                missingMetricCount += 1;
                continue;
              }
              if (metric.value >= metric.target) {
                onTrackCount += 1;
              }
            }

            let healthStatus = 'Recovery';
            if (onTrackCount >= 5) {
              healthStatus = 'Exceptional';
            } else if (onTrackCount >= 3) {
              healthStatus = 'Solid';
            }

            core.setOutput('health_status', healthStatus);
            core.setOutput('on_track_count', String(onTrackCount));
            core.setOutput('missing_metric_count', String(missingMetricCount));
            core.info(`Sprint health classified as ${healthStatus} (${onTrackCount}/5 on track).`);

      - name: Add sprint health summary
        if: steps.sprint_health.outputs.health_status != ''
        shell: zsh {0}
        run: |
