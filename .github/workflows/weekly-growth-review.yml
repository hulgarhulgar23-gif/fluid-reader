      - name: Sync founder first-48h controls into Monday checklist
        id: founder_first48h_controls_sync
        if: steps.monday_publish.outputs.monday_publish_issue_number != '' && env.founder_first48h_post_pack_path != ''
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.monday_publish.outputs.monday_publish_issue_number }}
          FOUNDER_FIRST48H_POST_PACK_PATH: ${{ env.founder_first48h_post_pack_path }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const packPath = process.env.FOUNDER_FIRST48H_POST_PACK_PATH || '';
            const checklistControlsStartMarker = '<!-- weekly-growth-founder-first48h-controls-start -->';
            const checklistControlsEndMarker = '<!-- weekly-growth-founder-first48h-controls-end -->';

            function clean(value) {
              return String(value || '').replace(/\r?\n/g, ' ').trim();
            }

            function escapeRegex(value) {
              return String(value || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            function extractSection(body, heading) {
              const lines = String(body || '').split(/\r?\n/);
              const targetHeading = `## ${clean(heading).toLowerCase()}`;
              let startIndex = -1;

              for (let index = 0; index < lines.length; index += 1) {
                if (clean(lines[index]).toLowerCase() === targetHeading) {
                  startIndex = index + 1;
                  break;
                }
              }

              if (startIndex < 0) {
                return '';
              }

              const sectionLines = [];
              for (let index = startIndex; index < lines.length; index += 1) {
                if (/^##\s+/.test(lines[index])) {
                  break;
                }
                sectionLines.push(lines[index]);
              }

              return sectionLines.join('\n').trim();
            }

            function extractBullet(sectionBody, label, fallback = 'n/a') {
              const escaped = escapeRegex(label);
              const regex = new RegExp(`^-\\s*${escaped}:\\s*(.+)$`, 'mi');
              const match = String(sectionBody || '').match(regex);
              const value = clean(match ? match[1] : '');
              return value || fallback;
            }

            function extractNumberedLine(sectionBody, index, fallback = 'n/a') {
              const regex = new RegExp(`^${index}\\.\\s*(.+)$`, 'mi');
              const match = String(sectionBody || '').match(regex);
              const value = clean(match ? match[1] : '');
              return value || fallback;
            }

            function upsertChecklistControlsBlock(body, block) {
              const markerRegex = new RegExp(
                `${escapeRegex(checklistControlsStartMarker)}[\\s\\S]*?${escapeRegex(checklistControlsEndMarker)}`,
                'm'
              );
              if (markerRegex.test(body)) {
                return body.replace(markerRegex, block.trimEnd());
              }

              const draftHeading = '## Monday Draft Source';
              if (body.includes(draftHeading)) {
                return body.replace(draftHeading, `${block.trimEnd()}\n\n${draftHeading}`);
              }

              return `${String(body || '').trimEnd()}\n\n${block.trimEnd()}\n`;
            }

            if (!packPath || !fs.existsSync(packPath)) {
              core.setFailed(`Founder first-48h post pack artifact not found: ${packPath}`);
              return;
            }

            const packBody = fs.readFileSync(packPath, 'utf8');
            const signalSnapshotSection = extractSection(packBody, 'Signal Snapshot');
            const routeControlSection = extractSection(packBody, 'Route Control Handshake (First 48h)');
            const escalationSection = extractSection(packBody, 'Escalation & Adaptation Triggers');

            const first48hExecutionPlan = extractBullet(
              signalSnapshotSection,
              'First 48h execution plan'
            );
            const routeAlignmentTarget = extractBullet(
              routeControlSection,
              'Route alignment target'
            );
            const routeGuardrail = extractBullet(routeControlSection, 'Route guardrail');
            const routeLaneTrigger = extractBullet(routeControlSection, 'Route lane trigger');
            const routeRecommendationNow = extractBullet(
              routeControlSection,
              'Route recommendation now'
            );
            const audienceRegions = extractBullet(routeControlSection, 'Audience regions');
            const publishWindows = extractBullet(routeControlSection, 'Publish windows');
            const escalationTriggerOne = extractNumberedLine(escalationSection, 1);
            const escalationTriggerTwo = extractNumberedLine(escalationSection, 2);

            const controlsBlock = `${checklistControlsStartMarker}

            ## Founder First 48h Route Controls (Auto-Synced)

            - First 48h execution plan: ${first48hExecutionPlan}
            - Route alignment target: ${routeAlignmentTarget}
            - Route guardrail: ${routeGuardrail}
            - Route lane trigger: ${routeLaneTrigger}
            - Route recommendation now: ${routeRecommendationNow}
            - Audience regions: ${audienceRegions}
            - Publish windows: ${publishWindows}
            - Escalation trigger #1: ${escalationTriggerOne}
            - Escalation trigger #2: ${escalationTriggerTwo}

            ${checklistControlsEndMarker}
            `;

            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber
            });

            const currentBody = String(issue.body || '');
            const nextBody = upsertChecklistControlsBlock(currentBody, controlsBlock);
            if (nextBody !== currentBody) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issueNumber,
                body: nextBody
              });
              core.info(`Synced founder first-48h route controls into Monday checklist issue #${issueNumber}.`);
            } else {
              core.info(`Founder first-48h route controls already up to date in Monday checklist issue #${issueNumber}.`);
            }

            core.setOutput('first48h_execution_plan', first48hExecutionPlan);
            core.setOutput('route_alignment_target', routeAlignmentTarget);
            core.setOutput('route_lane_trigger', routeLaneTrigger);

      - name: Add founder first-48h controls sync summary
        if: steps.founder_first48h_controls_sync.outcome == 'success'
        shell: zsh {0}
        run: |
          set -euo pipefail
          {
            echo "- Founder first-48h controls synced into Monday checklist issue body."
            echo "- Founder first-48h execution plan: \`${{ steps.founder_first48h_controls_sync.outputs.first48h_execution_plan }}\`"
            echo "- Founder route alignment target: \`${{ steps.founder_first48h_controls_sync.outputs.route_alignment_target }}\`"
            echo "- Founder route lane trigger: \`${{ steps.founder_first48h_controls_sync.outputs.route_lane_trigger }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reconcile founder narrative route incident issue
        id: founder_narrative_route_incident
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          WEEK: ${{ steps.sprint_metrics.outputs.week }}
          CHECKLIST_ISSUE_NUMBER: ${{ steps.monday_publish.outputs.monday_publish_issue_number }}
          ROUTE_MODE: ${{ steps.monday_effectiveness.outputs.narrative_route_mode }}
          ROUTE_ALIGNMENT_TARGET: ${{ steps.monday_effectiveness.outputs.narrative_route_alignment_target }}
          ROUTE_LANE_STATUS: ${{ steps.monday_effectiveness.outputs.narrative_route_lane_status }}
          ROUTE_GUARDRAIL: ${{ steps.monday_effectiveness.outputs.narrative_route_guardrail }}
          ROUTE_CONTROL_RECOMMENDATION: ${{ steps.monday_effectiveness.outputs.narrative_route_control_recommendation }}
          ROUTE_RECOMMENDATION: ${{ steps.monday_effectiveness.outputs.narrative_route_recommendation }}
          NARRATIVE_LAB_PATH: ${{ env.founder_fame_narrative_lab_path }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CRITICAL_THRESHOLD: ${{ inputs.narrative_route_critical_threshold }}
          CRITICAL_ASSIGNEE: ${{ inputs.narrative_route_critical_assignee }}
          CRITICAL_ASSIGNEES: ${{ inputs.narrative_route_critical_assignees }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- weekly-growth-founder-narrative-route-incident -->';
            const incidentLabel = { name: 'growth-incident', color: '5319e7', description: 'Growth automation incident requiring operator intervention' };
            const criticalLabel = { name: 'growth-critical', color: 'b60205', description: 'Critical growth incident due to repeated automation failures' };

            function clean(value) {
              if (value === null || value === undefined) return '';
              return String(value).replace(/\r?\n/g, ' ').trim();
            }

            function normalize(value) {
              return clean(value).toLowerCase();
            }

            function isPresent(value) {
              const normalized = normalize(value);
              return normalized !== '' && normalized !== 'n/a' && normalized !== 'none' && normalized !== 'unknown';
            }

            const week = clean(process.env.WEEK) || 'unknown-week';
            const checklistIssueNumberRaw = clean(process.env.CHECKLIST_ISSUE_NUMBER);
            const checklistIssueNumber = Number(checklistIssueNumberRaw);
            const hasChecklistIssue = Number.isFinite(checklistIssueNumber) && checklistIssueNumber > 0;
            const routeModeRaw = clean(process.env.ROUTE_MODE) || 'n/a';
            const routeAlignmentTargetRaw = clean(process.env.ROUTE_ALIGNMENT_TARGET) || 'n/a';
            const routeLaneStatusRaw = clean(process.env.ROUTE_LANE_STATUS) || 'n/a';
            const routeGuardrailRaw = clean(process.env.ROUTE_GUARDRAIL) || 'n/a';
            const routeControlRecommendationRaw = clean(process.env.ROUTE_CONTROL_RECOMMENDATION) || 'n/a';
            const routeRecommendationRaw = clean(process.env.ROUTE_RECOMMENDATION) || 'n/a';
            const narrativeLabPath = clean(process.env.NARRATIVE_LAB_PATH) || 'n/a';
            const runUrl = clean(process.env.RUN_URL) || '';

            const routeMode = isPresent(routeModeRaw) ? routeModeRaw : 'n/a';
            const routeAlignmentTarget = isPresent(routeAlignmentTargetRaw) ? routeAlignmentTargetRaw : 'n/a';
            const routeLaneStatus = isPresent(routeLaneStatusRaw) ? routeLaneStatusRaw : 'n/a';
            const routeGuardrail = isPresent(routeGuardrailRaw) ? routeGuardrailRaw : 'n/a';
            const routeControlRecommendation = isPresent(routeControlRecommendationRaw) ? routeControlRecommendationRaw : 'n/a';
            const routeRecommendation = isPresent(routeRecommendationRaw) ? routeRecommendationRaw : 'n/a';
            const criticalThresholdRaw = clean(process.env.CRITICAL_THRESHOLD);
            const parsedCriticalThreshold = Number(criticalThresholdRaw);
            const criticalThreshold = Number.isFinite(parsedCriticalThreshold) && parsedCriticalThreshold >= 1
              ? Math.floor(parsedCriticalThreshold)
              : 2;
            const primaryCriticalAssignee = clean(process.env.CRITICAL_ASSIGNEE).replace(/^@+/, '');
            const fallbackCriticalAssignees = String(process.env.CRITICAL_ASSIGNEES || '')
              .split(/[\n,]/)
              .map((value) => clean(value).replace(/^@+/, ''))
              .filter(Boolean);
            const criticalAssigneeCandidates = Array.from(new Set([primaryCriticalAssignee, ...fallbackCriticalAssignees].filter(Boolean)));
            const criticalAssigneeCandidatesText = criticalAssigneeCandidates.length > 0
              ? criticalAssigneeCandidates.map((value) => `@${value}`).join(', ')
              : 'n/a';

            const normalizedMode = normalize(routeMode);
            const normalizedLaneStatus = normalize(routeLaneStatus);
            const recoveryModeActive = normalizedMode.includes('route recovery') || /\brecovery\b/.test(normalizedMode);
            const criticalLaneActive = normalizedLaneStatus.includes('critical');
            const criticalState = recoveryModeActive || criticalLaneActive;
            let criticalTrigger = 'none';
            if (recoveryModeActive && criticalLaneActive) {
              criticalTrigger = 'route-recovery+critical-lane';
            } else if (recoveryModeActive) {
              criticalTrigger = 'route-recovery';
            } else if (criticalLaneActive) {
              criticalTrigger = 'critical-lane';
            }

            const title = `Growth Incident: Founder Narrative Route Control ${week}`;
            const { owner, repo } = context.repo;

            async function ensureLabel(label) {
              try {
                await github.rest.issues.getLabel({
                  owner,
                  repo,
                  name: label.name
                });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                  core.info(`Created label: ${label.name}`);
                } else {
                  throw error;
                }
              }
            }

            function parseCriticalOccurrences(body) {
              const match = String(body || '').match(/- Critical occurrences for this week:\s*(\d+)/i);
              const value = match ? Number(match[1]) : 0;
              return Number.isFinite(value) && value >= 0 ? Math.floor(value) : 0;
            }

            function buildBody({ criticalEscalated, criticalOccurrences }) {
              return `${marker}

              # Growth Incident: Founder Narrative Route Control ${week}

              - Critical trigger: ${criticalTrigger}
              - Critical occurrences for this week: ${criticalOccurrences}
              - Critical threshold: ${criticalThreshold}
              - Critical escalation status: ${criticalEscalated ? 'active' : 'monitoring'}
              - Critical owner candidates: ${criticalAssigneeCandidatesText}
              - Route mode: ${routeMode}
              - Route lane status: ${routeLaneStatus}
              - Route alignment target: ${routeAlignmentTarget}
              - Route guardrail: ${routeGuardrail}
              - Route control recommendation: ${routeControlRecommendation}
              - Founder narrative recommendation: ${routeRecommendation}
              - Narrative lab artifact: \`${narrativeLabPath}\`
              - Checklist issue: ${hasChecklistIssue ? `#${checklistIssueNumber}` : 'n/a'}
              - Review run: ${runUrl || 'n/a'}
              - Action: Run Route Recovery until lane status exits critical and control recommendation is complete.
              `;
            }

            let incidentAction = 'none';
            let incidentIssueNumber = '';
            let criticalOccurrences = 0;
            let criticalEscalated = false;
            let criticalAssigneeAction = criticalAssigneeCandidates.length > 0 ? 'monitoring' : 'not-configured';
            let criticalAssigneeSelected = '';
            let criticalAssigneeAttempts = 'n/a';

            await ensureLabel(incidentLabel);
            await ensureLabel(criticalLabel);

            async function assignFirstAvailableAssignee(issueNumber) {
              if (criticalAssigneeCandidates.length === 0 || !Number.isFinite(issueNumber) || issueNumber <= 0) return;
              const attempts = [];
              for (const candidate of criticalAssigneeCandidates) {
                try {
                  await github.rest.issues.addAssignees({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    assignees: [candidate]
                  });
                  criticalAssigneeSelected = candidate;
                  attempts.push(`@${candidate}:assigned`);
                  criticalAssigneeAction = 'assigned';
                  core.info(`Assigned founder narrative route owner @${candidate} to incident issue #${issueNumber}.`);
                  break;
                } catch (error) {
                  const code = Number(error.status || 0);
                  const reason = code === 422 || code === 404 ? 'invalid-or-unassignable' : `error-${code || 'unknown'}`;
                  attempts.push(`@${candidate}:${reason}`);
                  core.warning(`Could not assign @${candidate} to founder narrative route incident issue #${issueNumber}: ${error.message}`);
                }
              }
              criticalAssigneeAttempts = attempts.length > 0 ? attempts.join('; ') : 'n/a';
              if (!criticalAssigneeSelected) {
                criticalAssigneeAction = 'assign-failed';
              }
            }

            async function removeConfiguredAssignees(issueNumber, options = {}) {
              if (criticalAssigneeCandidates.length === 0 || !Number.isFinite(issueNumber) || issueNumber <= 0) return;
              const updateAction = options.updateAction !== false;
              const attempts = [];
              let removedCount = 0;
              let failedCount = 0;

              for (const candidate of criticalAssigneeCandidates) {
                try {
                  await github.rest.issues.removeAssignees({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    assignees: [candidate]
                  });
                  removedCount += 1;
                  attempts.push(`@${candidate}:unassigned`);
                  core.info(`Removed founder narrative route owner @${candidate} from incident issue #${issueNumber}.`);
                } catch (error) {
                  if (error.status === 404 || error.status === 422) {
                    attempts.push(`@${candidate}:already-unassigned`);
                  } else {
                    failedCount += 1;
                    attempts.push(`@${candidate}:error-${error.status || 'unknown'}`);
                    core.warning(`Could not unassign @${candidate} from founder narrative route incident issue #${issueNumber}: ${error.message}`);
                  }
                }
              }

              if (updateAction) {
                criticalAssigneeSelected = '';
                criticalAssigneeAttempts = attempts.length > 0 ? attempts.join('; ') : 'n/a';
                if (failedCount > 0) {
                  criticalAssigneeAction = 'unassign-failed';
                } else if (removedCount > 0) {
                  criticalAssigneeAction = 'unassigned';
                } else {
                  criticalAssigneeAction = 'already-unassigned';
                }
              }
            }

            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100
            });
            const matches = allIssues
              .filter((issue) => !issue.pull_request)
              .filter((issue) => (issue.body || '').includes(marker))
              .filter((issue) => (issue.body || '').includes(`Founder Narrative Route Control ${week}`))
              .sort((a, b) => b.number - a.number);

            const primary = matches[0] || null;

            if (criticalState) {
              const previousOccurrences = primary ? parseCriticalOccurrences(primary.body) : 0;
              criticalOccurrences = previousOccurrences + 1;
              criticalEscalated = criticalOccurrences >= criticalThreshold;
              const body = buildBody({ criticalEscalated, criticalOccurrences });
              const desiredLabels = criticalEscalated
                ? [incidentLabel.name, criticalLabel.name]
                : [incidentLabel.name];

              if (!primary) {
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels: desiredLabels
                });
                incidentAction = 'created';
                incidentIssueNumber = String(created.data.number);
                core.info(`Created founder narrative route incident issue #${created.data.number}.`);
              } else {
                const desiredState = primary.state === 'closed' ? 'open' : undefined;
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: primary.number,
                  title,
                  body,
                  ...(desiredState ? { state: desiredState } : {})
                });
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: primary.number,
                  labels: desiredLabels
                });
                if (!criticalEscalated) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner,
                      repo,
                      issue_number: primary.number,
                      name: criticalLabel.name
                    });
                  } catch (error) {
                    if (error.status !== 404) throw error;
                  }
                }
                incidentAction = primary.state === 'closed' ? 'reopened' : 'updated';
                incidentIssueNumber = String(primary.number);
                core.info(`${incidentAction === 'reopened' ? 'Reopened' : 'Updated'} founder narrative route incident issue #${primary.number}.`);
              }

              if (criticalEscalated) {
                await assignFirstAvailableAssignee(Number(incidentIssueNumber));
              } else if (criticalAssigneeCandidates.length > 0) {
                await removeConfiguredAssignees(Number(incidentIssueNumber));
              }

              for (const duplicate of matches.slice(1)) {
                if (duplicate.state === 'open') {
                  if (criticalAssigneeCandidates.length > 0) {
                    await removeConfiguredAssignees(duplicate.number, { updateAction: false });
                  }
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: duplicate.number,
                    state: 'closed'
                  });
                  core.info(`Closed duplicate founder narrative route incident issue #${duplicate.number}.`);
                }
              }
            } else {
              const openMatches = matches.filter((issue) => issue.state === 'open');
              if (openMatches.length > 0) {
                for (const [index, openIssue] of openMatches.entries()) {
                  if (criticalAssigneeCandidates.length > 0) {
                    await removeConfiguredAssignees(openIssue.number, { updateAction: index === 0 });
                  }
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: openIssue.number,
                    state: 'closed'
                  });
                  core.info(`Closed resolved founder narrative route incident issue #${openIssue.number}.`);
                }
                incidentAction = 'closed';
                incidentIssueNumber = String(openMatches[0].number);
              } else {
                core.info(`No open founder narrative route incident issue found for ${week}.`);
              }
              criticalOccurrences = 0;
              criticalEscalated = false;
            }

            core.setOutput('incident_action', incidentAction);
            core.setOutput('incident_issue_number', incidentIssueNumber);
            core.setOutput('critical_state', criticalState ? 'true' : 'false');
            core.setOutput('critical_trigger', criticalTrigger);
            core.setOutput('critical_occurrences', String(criticalOccurrences));
            core.setOutput('critical_threshold', String(criticalThreshold));
            core.setOutput('critical_escalated', criticalEscalated ? 'true' : 'false');
            core.setOutput('critical_assignee', criticalAssigneeSelected);
            core.setOutput('critical_assignee_candidates', criticalAssigneeCandidates.join(','));
            core.setOutput('critical_assignee_selected', criticalAssigneeSelected);
            core.setOutput('critical_assignee_attempts', criticalAssigneeAttempts);
            core.setOutput('critical_assignee_action', criticalAssigneeAction);
            core.setOutput('route_mode', routeMode);
            core.setOutput('route_alignment_target', routeAlignmentTarget);
            core.setOutput('route_lane_status', routeLaneStatus);
            core.setOutput('route_guardrail', routeGuardrail);
            core.setOutput('route_control_recommendation', routeControlRecommendation);
            core.setOutput('route_recommendation', routeRecommendation);

      - name: Add founder narrative route incident summary
        if: steps.founder_narrative_route_incident.outcome == 'success'
        shell: zsh {0}
        run: |
          set -euo pipefail
          incident_issue="${{ steps.founder_narrative_route_incident.outputs.incident_issue_number }}"
          {
            echo "- Founder narrative route incident action: \`${{ steps.founder_narrative_route_incident.outputs.incident_action }}\`"
            echo "- Founder narrative route incident issue number: \`${incident_issue:-n/a}\`"
            echo "- Founder narrative route incident critical state: \`${{ steps.founder_narrative_route_incident.outputs.critical_state }}\`"
            echo "- Founder narrative route incident critical trigger: \`${{ steps.founder_narrative_route_incident.outputs.critical_trigger }}\`"
            echo "- Founder narrative route incident critical occurrences: \`${{ steps.founder_narrative_route_incident.outputs.critical_occurrences }}\`"
            echo "- Founder narrative route incident critical threshold: \`${{ steps.founder_narrative_route_incident.outputs.critical_threshold }}\`"
            echo "- Founder narrative route incident critical escalation: \`${{ steps.founder_narrative_route_incident.outputs.critical_escalated }}\`"
            echo "- Founder narrative route incident critical assignee candidates: \`${{ steps.founder_narrative_route_incident.outputs.critical_assignee_candidates }}\`"
            echo "- Founder narrative route incident critical assignee selected: \`${{ steps.founder_narrative_route_incident.outputs.critical_assignee_selected }}\`"
            echo "- Founder narrative route incident critical assignee attempts: \`${{ steps.founder_narrative_route_incident.outputs.critical_assignee_attempts }}\`"
            echo "- Founder narrative route incident critical assignee action: \`${{ steps.founder_narrative_route_incident.outputs.critical_assignee_action }}\`"
            echo "- Founder narrative route incident route mode: \`${{ steps.founder_narrative_route_incident.outputs.route_mode }}\`"
            echo "- Founder narrative route incident route lane status: \`${{ steps.founder_narrative_route_incident.outputs.route_lane_status }}\`"
            echo "- Founder narrative route incident route alignment target: \`${{ steps.founder_narrative_route_incident.outputs.route_alignment_target }}\`"
            echo "- Founder narrative route incident route guardrail: \`${{ steps.founder_narrative_route_incident.outputs.route_guardrail }}\`"
            echo "- Founder narrative route incident route control recommendation: \`${{ steps.founder_narrative_route_incident.outputs.route_control_recommendation }}\`"
            echo "- Founder narrative route incident recommendation: \`${{ steps.founder_narrative_route_incident.outputs.route_recommendation }}\`"
            echo "- Founder narrative route incident reconciliation outcome: \`${{ steps.founder_narrative_route_incident.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reconcile founder narrative route critical escalation comment
        id: founder_narrative_route_critical_comment
        if: steps.monday_publish.outputs.monday_publish_issue_number != '' && steps.founder_narrative_route_incident.outcome == 'success'
        uses: actions/github-script@v7
        env:
          CHECKLIST_ISSUE_NUMBER: ${{ steps.monday_publish.outputs.monday_publish_issue_number }}
          CRITICAL_STATE: ${{ steps.founder_narrative_route_incident.outputs.critical_state }}
          CRITICAL_TRIGGER: ${{ steps.founder_narrative_route_incident.outputs.critical_trigger }}
          CRITICAL_OCCURRENCES: ${{ steps.founder_narrative_route_incident.outputs.critical_occurrences }}
          CRITICAL_THRESHOLD: ${{ steps.founder_narrative_route_incident.outputs.critical_threshold }}
          CRITICAL_ESCALATED: ${{ steps.founder_narrative_route_incident.outputs.critical_escalated }}
          INCIDENT_ISSUE_NUMBER: ${{ steps.founder_narrative_route_incident.outputs.incident_issue_number }}
          CRITICAL_ASSIGNEE: ${{ steps.founder_narrative_route_incident.outputs.critical_assignee_selected }}
          CRITICAL_ASSIGNEE_CANDIDATES: ${{ steps.founder_narrative_route_incident.outputs.critical_assignee_candidates }}
          CRITICAL_ASSIGNEE_ATTEMPTS: ${{ steps.founder_narrative_route_incident.outputs.critical_assignee_attempts }}
          CRITICAL_ASSIGNEE_ACTION: ${{ steps.founder_narrative_route_incident.outputs.critical_assignee_action }}
          ROUTE_MODE: ${{ steps.founder_narrative_route_incident.outputs.route_mode }}
          ROUTE_ALIGNMENT_TARGET: ${{ steps.founder_narrative_route_incident.outputs.route_alignment_target }}
          ROUTE_LANE_STATUS: ${{ steps.founder_narrative_route_incident.outputs.route_lane_status }}
          ROUTE_GUARDRAIL: ${{ steps.founder_narrative_route_incident.outputs.route_guardrail }}
          ROUTE_CONTROL_RECOMMENDATION: ${{ steps.founder_narrative_route_incident.outputs.route_control_recommendation }}
          ROUTE_RECOMMENDATION: ${{ steps.founder_narrative_route_incident.outputs.route_recommendation }}
          CRITICAL_COMMENT_COOLDOWN_HOURS: ${{ inputs.narrative_route_critical_comment_cooldown_hours }}
          CRITICAL_COMMENT_MIN_OCCURRENCE_DELTA: ${{ inputs.narrative_route_critical_comment_min_occurrence_delta }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- weekly-growth-founder-narrative-route-critical -->';
            let criticalCommentAction = 'none';
            let criticalCommentCooldownActive = 'false';
            let criticalCommentPolicyReason = 'none';
            let criticalCommentOccurrenceDelta = Number.NaN;

            function emitOutputs(cooldownHours, minOccurrenceDelta) {
              core.setOutput('critical_comment_action', criticalCommentAction);
              core.setOutput('critical_comment_cooldown_hours', String(cooldownHours));
              core.setOutput('critical_comment_cooldown_active', criticalCommentCooldownActive);
              core.setOutput('critical_comment_min_occurrence_delta', String(minOccurrenceDelta));
              core.setOutput('critical_comment_occurrence_delta', Number.isFinite(criticalCommentOccurrenceDelta) ? String(criticalCommentOccurrenceDelta) : 'n/a');
              core.setOutput('critical_comment_policy_reason', criticalCommentPolicyReason);
            }

            function clean(value) {
              if (value === null || value === undefined) return '';
              return String(value).replace(/\r?\n/g, ' ').trim();
            }

            const cooldownHoursRaw = clean(process.env.CRITICAL_COMMENT_COOLDOWN_HOURS);
            const parsedCooldownHours = Number(cooldownHoursRaw);
            const cooldownHours = Number.isFinite(parsedCooldownHours) && parsedCooldownHours >= 0
              ? parsedCooldownHours
              : 24;
            const minOccurrenceDeltaRaw = clean(process.env.CRITICAL_COMMENT_MIN_OCCURRENCE_DELTA);
            const parsedMinOccurrenceDelta = Number(minOccurrenceDeltaRaw);
            const minOccurrenceDelta = Number.isFinite(parsedMinOccurrenceDelta) && parsedMinOccurrenceDelta >= 1
              ? Math.floor(parsedMinOccurrenceDelta)
              : 1;

            const issueNumber = Number(clean(process.env.CHECKLIST_ISSUE_NUMBER));
            if (!Number.isFinite(issueNumber) || issueNumber <= 0) {
              criticalCommentAction = 'skipped-invalid-issue';
              criticalCommentPolicyReason = 'invalid-checklist-issue';
              core.info('No valid checklist issue number; skipping founder narrative route critical comment reconciliation.');
              emitOutputs(cooldownHours, minOccurrenceDelta);
              return;
            }

            const criticalState = clean(process.env.CRITICAL_STATE) === 'true';
            const criticalTrigger = clean(process.env.CRITICAL_TRIGGER) || 'none';
            const criticalOccurrencesRaw = clean(process.env.CRITICAL_OCCURRENCES) || '0';
            const parsedCriticalOccurrences = Number(criticalOccurrencesRaw);
            const criticalOccurrences = Number.isFinite(parsedCriticalOccurrences) && parsedCriticalOccurrences >= 0
              ? Math.floor(parsedCriticalOccurrences)
              : 0;
            const criticalThreshold = clean(process.env.CRITICAL_THRESHOLD) || '2';
            const criticalEscalated = clean(process.env.CRITICAL_ESCALATED) === 'true';
            const incidentIssueNumber = clean(process.env.INCIDENT_ISSUE_NUMBER);
            const criticalAssigneeRaw = clean(process.env.CRITICAL_ASSIGNEE);
            const criticalAssignee = criticalAssigneeRaw ? `@${criticalAssigneeRaw.replace(/^@+/, '')}` : 'n/a';
            const criticalAssigneeCandidatesRaw = clean(process.env.CRITICAL_ASSIGNEE_CANDIDATES);
            const criticalAssigneeCandidates = criticalAssigneeCandidatesRaw
              ? criticalAssigneeCandidatesRaw.split(',').map((value) => clean(value)).filter(Boolean).map((value) => `@${value.replace(/^@+/, '')}`).join(', ')
              : 'n/a';
            const criticalAssigneeAttempts = clean(process.env.CRITICAL_ASSIGNEE_ATTEMPTS) || 'n/a';
            const criticalAssigneeAction = clean(process.env.CRITICAL_ASSIGNEE_ACTION) || 'not-configured';
            const routeMode = clean(process.env.ROUTE_MODE) || 'n/a';
            const routeAlignmentTarget = clean(process.env.ROUTE_ALIGNMENT_TARGET) || 'n/a';
            const routeLaneStatus = clean(process.env.ROUTE_LANE_STATUS) || 'n/a';
            const routeGuardrail = clean(process.env.ROUTE_GUARDRAIL) || 'n/a';
            const routeControlRecommendation = clean(process.env.ROUTE_CONTROL_RECOMMENDATION) || 'n/a';
            const routeRecommendation = clean(process.env.ROUTE_RECOMMENDATION) || 'n/a';
            const runUrl = clean(process.env.RUN_URL) || '';
            const shouldEscalate = criticalState && criticalEscalated;
            const incidentRef = incidentIssueNumber ? `#${incidentIssueNumber}` : 'n/a';

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100
            });
            const matching = comments
              .filter((comment) => (comment.body || '').includes(marker))
              .sort((left, right) => {
                const leftTs = Date.parse(left.updated_at || left.created_at || '') || 0;
                const rightTs = Date.parse(right.updated_at || right.created_at || '') || 0;
                return rightTs - leftTs;
              });

            if (shouldEscalate) {
              const body = `${marker}

              ## Founder Narrative Route Critical Escalation

              - Status: active
              - Critical trigger: ${criticalTrigger}
              - Critical occurrences this week: ${criticalOccurrences}
              - Critical threshold: ${criticalThreshold}
              - Critical escalation status: ${criticalEscalated ? 'active' : 'monitoring'}
              - Route mode: ${routeMode}
              - Route lane status: ${routeLaneStatus}
              - Route alignment target: ${routeAlignmentTarget}
              - Route guardrail: ${routeGuardrail}
              - Route control recommendation: ${routeControlRecommendation}
              - Founder narrative recommendation: ${routeRecommendation}
              - Incident issue: ${incidentRef}
              - Incident owner candidates: ${criticalAssigneeCandidates}
              - Incident owner: ${criticalAssignee}
              - Incident owner attempts: ${criticalAssigneeAttempts}
              - Incident owner action: ${criticalAssigneeAction}
              - Review run: ${runUrl || 'n/a'}
              - Action: Run Route Recovery playbook before next publish window.
              `;

              if (matching.length > 0) {
                const primary = matching[0];
                const existingOccurrenceMatch = String(primary.body || '').match(/- Critical occurrences this week:\s*(\d+)/i);
                const existingOccurrenceCount = existingOccurrenceMatch ? Number(existingOccurrenceMatch[1]) : Number.NaN;
                const primaryUpdatedAt = Date.parse(primary.updated_at || primary.created_at || '');
                const ageHours = Number.isFinite(primaryUpdatedAt)
                  ? ((Date.now() - primaryUpdatedAt) / (1000 * 60 * 60))
                  : Number.POSITIVE_INFINITY;
                const withinCooldown = cooldownHours > 0 && ageHours >= 0 && ageHours < cooldownHours;
                const deltaIsComputable = Number.isFinite(existingOccurrenceCount);
                criticalCommentOccurrenceDelta = deltaIsComputable
                  ? (criticalOccurrences - existingOccurrenceCount)
                  : criticalOccurrences;
                const deltaSatisfies = !deltaIsComputable || criticalCommentOccurrenceDelta >= minOccurrenceDelta;

                if (withinCooldown && !deltaSatisfies) {
                  criticalCommentAction = 'cooldown-delta-skip';
                  criticalCommentCooldownActive = 'true';
                  criticalCommentPolicyReason = 'within-cooldown-and-delta-below-threshold';
                  core.info(`Skipped founder narrative route critical escalation comment update due to cooldown (${cooldownHours}h): occurrence delta ${criticalCommentOccurrenceDelta} below minimum ${minOccurrenceDelta}.`);
                } else {
                  await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: primary.id,
                    body
                  });
                  criticalCommentAction = 'updated';
                  criticalCommentPolicyReason = withinCooldown
                    ? 'updated-within-cooldown-delta-threshold-met'
                    : 'updated-cooldown-expired';
                  core.info(`Updated founder narrative route critical escalation comment on checklist issue #${issueNumber}.`);
                }

                for (const duplicate of matching.slice(1)) {
                  await github.rest.issues.deleteComment({
                    owner,
                    repo,
                    comment_id: duplicate.id
                  });
                  core.info(`Deleted duplicate founder narrative route critical escalation comment: ${duplicate.id}`);
                }
              } else {
                const created = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body
                });
                criticalCommentOccurrenceDelta = criticalOccurrences;
                criticalCommentAction = 'created';
                criticalCommentPolicyReason = 'critical-state-active-created';
                core.info(`Created founder narrative route critical escalation comment: ${created.data.html_url}`);
              }
            } else {
              for (const existing of matching) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existing.id
                });
                core.info(`Cleared stale founder narrative route critical escalation comment: ${existing.id}`);
              }
              if (matching.length === 0) {
                criticalCommentAction = 'not-present';
                criticalCommentPolicyReason = 'not-critical-no-comment-present';
                core.info(`No stale founder narrative route critical escalation comments found on checklist issue #${issueNumber}.`);
              } else {
                criticalCommentAction = 'cleared';
                criticalCommentPolicyReason = 'not-critical-cleared-comments';
              }
            }

            emitOutputs(cooldownHours, minOccurrenceDelta);

      - name: Add founder narrative route critical comment summary
        if: steps.monday_publish.outputs.monday_publish_issue_number != '' && steps.founder_narrative_route_incident.outcome == 'success' && steps.founder_narrative_route_critical_comment.outcome == 'success'
        shell: zsh {0}
        run: |
          set -euo pipefail
          {
            echo "- Founder narrative route critical comment action: \`${{ steps.founder_narrative_route_critical_comment.outputs.critical_comment_action }}\`"
            echo "- Founder narrative route critical comment cooldown hours: \`${{ steps.founder_narrative_route_critical_comment.outputs.critical_comment_cooldown_hours }}\`"
            echo "- Founder narrative route critical comment cooldown active: \`${{ steps.founder_narrative_route_critical_comment.outputs.critical_comment_cooldown_active }}\`"
            echo "- Founder narrative route critical comment min occurrence delta: \`${{ steps.founder_narrative_route_critical_comment.outputs.critical_comment_min_occurrence_delta }}\`"
            echo "- Founder narrative route critical comment occurrence delta: \`${{ steps.founder_narrative_route_critical_comment.outputs.critical_comment_occurrence_delta }}\`"
            echo "- Founder narrative route critical comment policy reason: \`${{ steps.founder_narrative_route_critical_comment.outputs.critical_comment_policy_reason }}\`"
            echo "- Founder narrative route critical comment reconciliation outcome: \`${{ steps.founder_narrative_route_critical_comment.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reconcile founder narrative route owner queue comment
        id: founder_narrative_route_owner_queue
        if: steps.monday_publish.outputs.monday_publish_issue_number != '' && steps.founder_narrative_route_incident.outcome == 'success'
        uses: actions/github-script@v7
        env:
          CHECKLIST_ISSUE_NUMBER: ${{ steps.monday_publish.outputs.monday_publish_issue_number }}
          SOURCE_WEEK: ${{ steps.monday_effectiveness.outputs.source_week }}
          CRITICAL_STATE: ${{ steps.founder_narrative_route_incident.outputs.critical_state }}
          CRITICAL_TRIGGER: ${{ steps.founder_narrative_route_incident.outputs.critical_trigger }}
          CRITICAL_OCCURRENCES: ${{ steps.founder_narrative_route_incident.outputs.critical_occurrences }}
          CRITICAL_THRESHOLD: ${{ steps.founder_narrative_route_incident.outputs.critical_threshold }}
          CRITICAL_ESCALATED: ${{ steps.founder_narrative_route_incident.outputs.critical_escalated }}
          INCIDENT_ISSUE_NUMBER: ${{ steps.founder_narrative_route_incident.outputs.incident_issue_number }}
          CRITICAL_ASSIGNEE: ${{ steps.founder_narrative_route_incident.outputs.critical_assignee_selected }}
          CRITICAL_ASSIGNEE_CANDIDATES: ${{ steps.founder_narrative_route_incident.outputs.critical_assignee_candidates }}
          CRITICAL_ASSIGNEE_ATTEMPTS: ${{ steps.founder_narrative_route_incident.outputs.critical_assignee_attempts }}
          CRITICAL_ASSIGNEE_ACTION: ${{ steps.founder_narrative_route_incident.outputs.critical_assignee_action }}
          ROUTE_MODE: ${{ steps.founder_narrative_route_incident.outputs.route_mode }}
          ROUTE_ALIGNMENT_TARGET: ${{ steps.founder_narrative_route_incident.outputs.route_alignment_target }}
          ROUTE_LANE_STATUS: ${{ steps.founder_narrative_route_incident.outputs.route_lane_status }}
          ROUTE_GUARDRAIL: ${{ steps.founder_narrative_route_incident.outputs.route_guardrail }}
          ROUTE_CONTROL_RECOMMENDATION: ${{ steps.founder_narrative_route_incident.outputs.route_control_recommendation }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- weekly-growth-founder-narrative-route-owner-queue -->';
            const incidentOwnerSyncStartMarker = '<!-- weekly-growth-founder-narrative-route-owner-sync-start -->';
            const incidentOwnerSyncEndMarker = '<!-- weekly-growth-founder-narrative-route-owner-sync-end -->';
            const checklistOwnerQueueStartMarker = '<!-- weekly-growth-founder-narrative-route-owner-queue-start -->';
            const checklistOwnerQueueEndMarker = '<!-- weekly-growth-founder-narrative-route-owner-queue-end -->';
            let ownerQueueStatus = 'none';
            let ownerQueueCommentAction = 'none';
            let ownerQueueDuplicateCommentsCleared = 0;
            let ownerQueueChecklistBlockAction = 'none';
            let ownerQueueCompletedTasks = 0;
            let ownerQueueOpenTasks = 0;
            let incidentOwnerSyncAction = 'not-attempted';
            let incidentOwnerSyncStatus = 'not-attempted';

            function clean(value) {
              if (value === null || value === undefined) return '';
              return String(value).replace(/\r?\n/g, ' ').trim();
            }

            function escapeRegex(value) {
              return String(value || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            function emitOutputs(owner, ownerCandidates) {
              core.setOutput('owner_queue_status', ownerQueueStatus);
              core.setOutput('owner_queue_comment_action', ownerQueueCommentAction);
              core.setOutput('owner_queue_duplicate_comments_cleared', String(ownerQueueDuplicateCommentsCleared));
              core.setOutput('owner_queue_checklist_block_action', ownerQueueChecklistBlockAction);
              core.setOutput('owner_queue_completed_tasks', String(ownerQueueCompletedTasks));
              core.setOutput('owner_queue_open_tasks', String(ownerQueueOpenTasks));
              core.setOutput('owner_queue_owner', owner);
              core.setOutput('owner_queue_owner_candidates', ownerCandidates);
              core.setOutput('incident_owner_sync_action', incidentOwnerSyncAction);
              core.setOutput('incident_owner_sync_status', incidentOwnerSyncStatus);
            }

            const issueNumber = Number(clean(process.env.CHECKLIST_ISSUE_NUMBER));
            if (!Number.isFinite(issueNumber) || issueNumber <= 0) {
              ownerQueueStatus = 'skipped-invalid-issue';
              ownerQueueCommentAction = 'skipped-invalid-issue';
              core.info('No valid checklist issue number; skipping founder narrative route owner queue reconciliation.');
              emitOutputs('n/a', 'n/a');
              return;
            }

            const sourceWeek = clean(process.env.SOURCE_WEEK) || 'n/a';
            const criticalState = clean(process.env.CRITICAL_STATE) === 'true';
            const criticalEscalated = clean(process.env.CRITICAL_ESCALATED) === 'true';
            const criticalTrigger = clean(process.env.CRITICAL_TRIGGER) || 'none';
            const criticalOccurrences = clean(process.env.CRITICAL_OCCURRENCES) || '0';
            const criticalThreshold = clean(process.env.CRITICAL_THRESHOLD) || '2';
            const incidentIssueNumber = clean(process.env.INCIDENT_ISSUE_NUMBER);
            const incidentIssueNumberNumeric = Number(incidentIssueNumber);
            const criticalAssigneeRaw = clean(process.env.CRITICAL_ASSIGNEE).replace(/^@+/, '');
            const criticalAssigneeCandidatesRaw = clean(process.env.CRITICAL_ASSIGNEE_CANDIDATES);
            const criticalAssigneeCandidates = criticalAssigneeCandidatesRaw
              ? criticalAssigneeCandidatesRaw.split(',').map((value) => clean(value).replace(/^@+/, '')).filter(Boolean)
              : [];
            const criticalAssigneeAttempts = clean(process.env.CRITICAL_ASSIGNEE_ATTEMPTS) || 'n/a';
            const criticalAssigneeAction = clean(process.env.CRITICAL_ASSIGNEE_ACTION) || 'not-configured';
            const routeMode = clean(process.env.ROUTE_MODE) || 'n/a';
            const routeAlignmentTarget = clean(process.env.ROUTE_ALIGNMENT_TARGET) || 'n/a';
            const routeLaneStatus = clean(process.env.ROUTE_LANE_STATUS) || 'n/a';
            const routeGuardrail = clean(process.env.ROUTE_GUARDRAIL) || 'n/a';
            const routeControlRecommendation = clean(process.env.ROUTE_CONTROL_RECOMMENDATION) || 'n/a';
            const runUrl = clean(process.env.RUN_URL) || 'n/a';
            const shouldQueue = criticalState && criticalEscalated;
            const incidentRef = incidentIssueNumber ? `#${incidentIssueNumber}` : 'n/a';
            const ownerCandidatesText = criticalAssigneeCandidates.length > 0
              ? criticalAssigneeCandidates.map((value) => `@${value}`).join(', ')
              : 'n/a';
            const selectedOwner = criticalAssigneeRaw
              ? `@${criticalAssigneeRaw}`
              : (criticalAssigneeCandidates.length > 0 ? `@${criticalAssigneeCandidates[0]}` : 'unassigned');
            const ownerTaskSpecs = [
              {
                key: 'route-standup',
                label: `${selectedOwner} run Route Recovery standup and lock winner + lane shift decision.`
              },
              {
                key: 'route-control-exec',
                label: `${selectedOwner} execute control recommendation: ${routeControlRecommendation}.`
              },
              {
                key: 'route-proof-sync',
                label: `${selectedOwner} publish route alignment proof update in narrative lab and sprint issue.`
              },
              {
                key: 'route-checkpoint-update',
                label: `${selectedOwner} post checklist progress update with blockers and next checkpoint.`
              }
            ];

            function extractTaskStatesFromChecklistBody(body) {
              const stateMap = {};
              for (const task of ownerTaskSpecs) {
                const pattern = new RegExp('-\\s*\\[( |x|X)\\]\\s*`' + escapeRegex(task.key) + '`:\\s*', 'm');
                const match = String(body || '').match(pattern);
                stateMap[task.key] = match ? String(match[1] || '').toLowerCase() === 'x' : false;
              }
              return stateMap;
            }

            function buildQueueTasksMarkdown(taskStates) {
              return ownerTaskSpecs
                .map((task, index) => `${index + 1}. [${taskStates[task.key] ? 'x' : ' '}] ${task.label}`)
                .join('\n');
            }

            function buildChecklistTasksMarkdown(taskStates) {
              return ownerTaskSpecs
                .map((task) => `- [${taskStates[task.key] ? 'x' : ' '}] \`${task.key}\`: ${task.label}`)
                .join('\n');
            }

            function summarizeTaskState(taskStates) {
              const completed = ownerTaskSpecs.filter((task) => taskStates[task.key] === true).length;
              return {
                completed,
                open: Math.max(ownerTaskSpecs.length - completed, 0)
              };
            }

            const { owner, repo } = context.repo;
            const { data: checklistIssue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber
            });
            let checklistBody = String(checklistIssue.body || '');

            function buildChecklistOwnerQueueBlock(taskStates) {
              return `${checklistOwnerQueueStartMarker}

              ## Founder Narrative Route Owner Queue (Auto-Managed)

              - Source week: ${sourceWeek}
              - Critical trigger: ${criticalTrigger}
              - Critical occurrences this week: ${criticalOccurrences}
              - Critical threshold: ${criticalThreshold}
              - Incident issue: ${incidentRef}
              - Owner selected: ${selectedOwner}
              - Owner candidates: ${ownerCandidatesText}
              - Assignment action: ${criticalAssigneeAction}
              - Assignment attempts: ${criticalAssigneeAttempts}
              - Queue comment marker: ${marker}
              - Review run: ${runUrl}

              ${buildChecklistTasksMarkdown(taskStates)}

              ${checklistOwnerQueueEndMarker}`;
            }

            function upsertChecklistOwnerQueueBlock(body, taskStates) {
              const markerRegex = new RegExp(`${escapeRegex(checklistOwnerQueueStartMarker)}[\\s\\S]*?${escapeRegex(checklistOwnerQueueEndMarker)}`, 'm');
              const block = buildChecklistOwnerQueueBlock(taskStates);
              return markerRegex.test(body)
                ? body.replace(markerRegex, block.trimEnd())
                : `${body.trimEnd()}\n\n${block.trimEnd()}\n`;
            }

            function stripChecklistOwnerQueueBlock(body) {
              const markerRegex = new RegExp(`\\n?${escapeRegex(checklistOwnerQueueStartMarker)}[\\s\\S]*?${escapeRegex(checklistOwnerQueueEndMarker)}\\n?`, 'm');
              if (!markerRegex.test(body)) return body;
              return `${body.replace(markerRegex, '\n').replace(/\n{3,}/g, '\n\n').trimEnd()}\n`;
            }

            async function writeChecklistBody(nextBody, infoLabel) {
              if (nextBody === checklistBody) return false;
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issueNumber,
                body: nextBody
              });
              checklistBody = nextBody;
              core.info(infoLabel);
              return true;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100
            });
            const matching = comments
              .filter((comment) => (comment.body || '').includes(marker))
              .sort((left, right) => {
                const leftTs = Date.parse(left.updated_at || left.created_at || '') || 0;
                const rightTs = Date.parse(right.updated_at || right.created_at || '') || 0;
                return rightTs - leftTs;
              });
            const primary = matching[0] || null;
            const duplicates = matching.slice(1);

            for (const duplicate of duplicates) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: duplicate.id
              });
            }
            ownerQueueDuplicateCommentsCleared = duplicates.length;

            let taskStates = extractTaskStatesFromChecklistBody(checklistBody);
            let ownerTasksMarkdown = buildQueueTasksMarkdown(taskStates);
            let taskSummary = summarizeTaskState(taskStates);
            ownerQueueCompletedTasks = taskSummary.completed;
            ownerQueueOpenTasks = taskSummary.open;

            function buildIncidentOwnerSyncBlock(taskStateMap) {
              const incidentTasksMarkdown = buildQueueTasksMarkdown(taskStateMap);
              return `${incidentOwnerSyncStartMarker}

              ## Founder Narrative Route Owner Execution Mirror

              - Source week: ${sourceWeek}
              - Incident issue: ${incidentRef}
              - Checklist issue: #${issueNumber}
              - Critical trigger: ${criticalTrigger}
              - Critical occurrences this week: ${criticalOccurrences}
              - Critical threshold: ${criticalThreshold}
              - Owner selected: ${selectedOwner}
              - Owner candidates: ${ownerCandidatesText}
              - Assignment action: ${criticalAssigneeAction}
              - Assignment attempts: ${criticalAssigneeAttempts}
              - Queue marker: ${marker}
              - Review run: ${runUrl}

              ### Owner tasks mirrored from checklist queue

              ${incidentTasksMarkdown}

              ${incidentOwnerSyncEndMarker}`;
            }

            function upsertIncidentOwnerSyncBlock(body, taskStateMap) {
              const markerRegex = new RegExp(`${escapeRegex(incidentOwnerSyncStartMarker)}[\\s\\S]*?${escapeRegex(incidentOwnerSyncEndMarker)}`, 'm');
              const block = buildIncidentOwnerSyncBlock(taskStateMap);
              return markerRegex.test(body)
                ? body.replace(markerRegex, block.trimEnd())
                : `${body.trimEnd()}\n\n${block.trimEnd()}\n`;
            }

            function stripIncidentOwnerSyncBlock(body) {
              const markerRegex = new RegExp(`\\n?${escapeRegex(incidentOwnerSyncStartMarker)}[\\s\\S]*?${escapeRegex(incidentOwnerSyncEndMarker)}\\n?`, 'm');
              if (!markerRegex.test(body)) return body;
              return `${body.replace(markerRegex, '\n').replace(/\n{3,}/g, '\n\n').trimEnd()}\n`;
            }

            async function syncIncidentOwnerBlock(taskStateMap) {
              if (!Number.isFinite(incidentIssueNumberNumeric) || incidentIssueNumberNumeric <= 0) {
                incidentOwnerSyncAction = shouldQueue ? 'skipped-invalid-incident-issue' : 'not-needed-no-incident';
                incidentOwnerSyncStatus = 'no-incident';
                return;
              }

              try {
                const { data: incidentIssue } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: incidentIssueNumberNumeric
                });
                const incidentBody = String(incidentIssue.body || '');

                if (shouldQueue) {
                  const nextBody = upsertIncidentOwnerSyncBlock(incidentBody, taskStateMap);
                  if (nextBody === incidentBody) {
                    incidentOwnerSyncAction = 'unchanged';
                    incidentOwnerSyncStatus = 'active';
                    core.info(`Founder narrative route incident owner sync block already up to date on issue #${incidentIssueNumberNumeric}.`);
                    return;
                  }
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: incidentIssueNumberNumeric,
                    body: nextBody
                  });
                  incidentOwnerSyncAction = 'upserted';
                  incidentOwnerSyncStatus = 'active';
                  core.info(`Upserted founder narrative route incident owner sync block on issue #${incidentIssueNumberNumeric}.`);
                  return;
                }

                const nextBody = stripIncidentOwnerSyncBlock(incidentBody);
                if (nextBody === incidentBody) {
                  incidentOwnerSyncAction = 'not-present';
                  incidentOwnerSyncStatus = 'cleared';
                  core.info(`No founder narrative route incident owner sync block to clear on issue #${incidentIssueNumberNumeric}.`);
                  return;
                }
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: incidentIssueNumberNumeric,
                  body: nextBody
                });
                incidentOwnerSyncAction = 'cleared';
                incidentOwnerSyncStatus = 'cleared';
                core.info(`Cleared founder narrative route incident owner sync block on issue #${incidentIssueNumberNumeric}.`);
              } catch (error) {
                incidentOwnerSyncAction = 'sync-failed';
                incidentOwnerSyncStatus = 'error';
                core.warning(`Failed founder narrative route incident owner sync for issue #${incidentIssueNumberNumeric || 'n/a'}: ${error.message}`);
              }
            }

            if (shouldQueue) {
              const checklistBlockChanged = await writeChecklistBody(
                upsertChecklistOwnerQueueBlock(checklistBody, taskStates),
                `Upserted founder narrative route owner queue block in checklist issue #${issueNumber}.`
              );
              ownerQueueChecklistBlockAction = checklistBlockChanged ? 'upserted' : 'unchanged';
              taskStates = extractTaskStatesFromChecklistBody(checklistBody);
              ownerTasksMarkdown = buildQueueTasksMarkdown(taskStates);
              taskSummary = summarizeTaskState(taskStates);
              ownerQueueCompletedTasks = taskSummary.completed;
              ownerQueueOpenTasks = taskSummary.open;

              const body = `${marker}

              ## Founder Narrative Route Owner Queue (Critical)

              - Source week: ${sourceWeek}
              - Critical trigger: ${criticalTrigger}
              - Critical occurrences this week: ${criticalOccurrences}
              - Critical threshold: ${criticalThreshold}
              - Incident issue: ${incidentRef}
              - Owner selected: ${selectedOwner}
              - Owner candidates: ${ownerCandidatesText}
              - Assignment action: ${criticalAssigneeAction}
              - Assignment attempts: ${criticalAssigneeAttempts}
              - Route mode: ${routeMode}
              - Route lane status: ${routeLaneStatus}
              - Route alignment target: ${routeAlignmentTarget}
              - Route guardrail: ${routeGuardrail}
              - Review run: ${runUrl}
              - Incident sync marker: ${incidentOwnerSyncStartMarker}

              ### Immediate owner tasks

              ${ownerTasksMarkdown}
              `;

              if (primary) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: primary.id,
                  body
                });
                ownerQueueCommentAction = 'updated';
                core.info(`Updated founder narrative route owner queue comment on checklist issue #${issueNumber}.`);
              } else {
                const created = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body
                });
                ownerQueueCommentAction = 'created';
                core.info(`Created founder narrative route owner queue comment: ${created.data.html_url}`);
              }
              ownerQueueStatus = 'active';
            } else if (primary) {
              const checklistBlockChanged = await writeChecklistBody(
                stripChecklistOwnerQueueBlock(checklistBody),
                `Cleared founder narrative route owner queue block from checklist issue #${issueNumber}.`
              );
              ownerQueueChecklistBlockAction = checklistBlockChanged ? 'cleared' : 'not-present';
              ownerQueueCompletedTasks = 0;
              ownerQueueOpenTasks = 0;

              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: primary.id
              });
              ownerQueueCommentAction = 'deleted';
              ownerQueueStatus = 'cleared';
              core.info(`Cleared founder narrative route owner queue comment on checklist issue #${issueNumber}.`);
            } else {
              const checklistBlockChanged = await writeChecklistBody(
                stripChecklistOwnerQueueBlock(checklistBody),
                `Cleared stale founder narrative route owner queue block from checklist issue #${issueNumber}.`
              );
              ownerQueueChecklistBlockAction = checklistBlockChanged ? 'cleared' : 'not-present';
              ownerQueueCompletedTasks = 0;
              ownerQueueOpenTasks = 0;

              ownerQueueCommentAction = 'not-present';
              ownerQueueStatus = 'not-needed';
              core.info(`No founder narrative route owner queue comment needed on checklist issue #${issueNumber}.`);
            }

            await syncIncidentOwnerBlock(taskStates);
            emitOutputs(selectedOwner, ownerCandidatesText);

      - name: Add founder narrative route owner queue summary
        if: steps.monday_publish.outputs.monday_publish_issue_number != '' && steps.founder_narrative_route_incident.outcome == 'success' && steps.founder_narrative_route_owner_queue.outcome == 'success'
        shell: zsh {0}
        run: |
          set -euo pipefail
          {
            echo "- Founder narrative route owner queue status: \`${{ steps.founder_narrative_route_owner_queue.outputs.owner_queue_status }}\`"
            echo "- Founder narrative route owner queue comment action: \`${{ steps.founder_narrative_route_owner_queue.outputs.owner_queue_comment_action }}\`"
            echo "- Founder narrative route owner queue owner: \`${{ steps.founder_narrative_route_owner_queue.outputs.owner_queue_owner }}\`"
            echo "- Founder narrative route owner queue owner candidates: \`${{ steps.founder_narrative_route_owner_queue.outputs.owner_queue_owner_candidates }}\`"
            echo "- Founder narrative route owner queue duplicate comments cleared: \`${{ steps.founder_narrative_route_owner_queue.outputs.owner_queue_duplicate_comments_cleared }}\`"
            echo "- Founder narrative route owner queue checklist block action: \`${{ steps.founder_narrative_route_owner_queue.outputs.owner_queue_checklist_block_action }}\`"
            echo "- Founder narrative route owner queue completed tasks: \`${{ steps.founder_narrative_route_owner_queue.outputs.owner_queue_completed_tasks }}\`"
            echo "- Founder narrative route owner queue open tasks: \`${{ steps.founder_narrative_route_owner_queue.outputs.owner_queue_open_tasks }}\`"
            echo "- Founder narrative route incident owner sync action: \`${{ steps.founder_narrative_route_owner_queue.outputs.incident_owner_sync_action }}\`"
            echo "- Founder narrative route incident owner sync status: \`${{ steps.founder_narrative_route_owner_queue.outputs.incident_owner_sync_status }}\`"
            echo "- Founder narrative route owner queue reconciliation outcome: \`${{ steps.founder_narrative_route_owner_queue.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reconcile founder fame proof loop verification alert comment
        id: founder_fame_proof_loop_verifier_alert_comment
        if: env.founder_fame_proof_loop_check_path != '' && steps.monday_publish.outputs.monday_publish_issue_number != ''
        uses: actions/github-script@v7
        env:
          CHECKLIST_ISSUE_NUMBER: ${{ steps.monday_publish.outputs.monday_publish_issue_number }}
          VERIFICATION_OUTCOME: ${{ steps.founder_fame_proof_loop_verify.outcome }}
          CHECK_PATH: ${{ env.founder_fame_proof_loop_check_path }}
          VERIFY_EXIT_CODE: ${{ env.founder_fame_proof_loop_verify_exit_code }}
          ALERT_COMMENT_COOLDOWN_HOURS: ${{ inputs.founder_verifier_comment_cooldown_hours }}
          ALERT_COMMENT_MIN_FAILURE_DELTA: ${{ inputs.founder_verifier_comment_min_failure_delta }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- weekly-growth-founder-fame-proof-loop-verifier-failure -->';
            let alertCommentAction = 'none';
            let alertCommentCooldownActive = 'false';
            let alertCommentPolicyReason = 'none';
            let alertCommentFailureDelta = Number.NaN;

            function emitOutputs(cooldownHours, minFailureDelta) {
              core.setOutput('alert_comment_action', alertCommentAction);
              core.setOutput('alert_comment_cooldown_hours', String(cooldownHours));
              core.setOutput('alert_comment_cooldown_active', alertCommentCooldownActive);
              core.setOutput('alert_comment_min_failure_delta', String(minFailureDelta));
              core.setOutput('alert_comment_failure_delta', Number.isFinite(alertCommentFailureDelta) ? String(alertCommentFailureDelta) : 'n/a');
              core.setOutput('alert_comment_policy_reason', alertCommentPolicyReason);
            }

            const cooldownHoursRaw = (process.env.ALERT_COMMENT_COOLDOWN_HOURS || '').trim();
            const parsedCooldownHours = Number(cooldownHoursRaw);
            const cooldownHours = Number.isFinite(parsedCooldownHours) && parsedCooldownHours >= 0
              ? parsedCooldownHours
              : 24;
            const minFailureDeltaRaw = (process.env.ALERT_COMMENT_MIN_FAILURE_DELTA || '').trim();
            const parsedMinFailureDelta = Number(minFailureDeltaRaw);
            const minFailureDelta = Number.isFinite(parsedMinFailureDelta) && parsedMinFailureDelta >= 1
              ? Math.floor(parsedMinFailureDelta)
              : 1;

            const issueNumber = Number(process.env.CHECKLIST_ISSUE_NUMBER || '');
            if (!Number.isFinite(issueNumber) || issueNumber <= 0) {
              alertCommentAction = 'skipped-invalid-issue';
              alertCommentPolicyReason = 'invalid-checklist-issue';
              core.info('No valid checklist issue number; skipping founder fame proof-loop verifier alert reconciliation.');
              emitOutputs(cooldownHours, minFailureDelta);
              return;
            }

            const verificationOutcome = (process.env.VERIFICATION_OUTCOME || '').trim();
            const checkPath = process.env.CHECK_PATH || 'n/a';
            const verifyExitCode = process.env.VERIFY_EXIT_CODE || 'n/a';
            const runUrl = process.env.RUN_URL || '';
            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100
            });
            const matching = comments
              .filter((comment) => (comment.body || '').includes(marker))
              .sort((left, right) => {
                const leftTs = Date.parse(left.updated_at || left.created_at || '') || 0;
                const rightTs = Date.parse(right.updated_at || right.created_at || '') || 0;
                return rightTs - leftTs;
              });

            function parseFailureCount(body) {
              const match = String(body || '').match(/- Failure count this week:\s*`?(\d+)`?/i);
              const value = match ? Number(match[1]) : Number.NaN;
              return Number.isFinite(value) && value >= 0 ? Math.floor(value) : Number.NaN;
            }

            if (verificationOutcome === 'failure') {
              const existingFailureCount = matching.length > 0
                ? parseFailureCount(matching[0].body)
                : Number.NaN;
              const existingFailureCountNumber = Number.isFinite(existingFailureCount)
                ? existingFailureCount
                : 0;
              const failureCountNumber = existingFailureCountNumber + 1;
              const body = [
                marker,
                '',
                '⚠️ Founder fame proof loop strict verification failed in the latest Weekly Growth Review run.',
                '',
                `- Failure count this week: \`${failureCountNumber}\``,
                `- Verification report: \`${checkPath}\``,
                `- Verifier exit code: \`${verifyExitCode}\``,
                runUrl ? `- Workflow run: ${runUrl}` : '- Workflow run: n/a',
                '',
                'Action: review the proof-loop artifact, resolve failed checks, and rerun review workflow.'
              ].join('\n');

              if (matching.length > 0) {
                const primary = matching[0];
                const primaryUpdatedAt = Date.parse(primary.updated_at || primary.created_at || '');
                const ageHours = Number.isFinite(primaryUpdatedAt)
                  ? ((Date.now() - primaryUpdatedAt) / (1000 * 60 * 60))
                  : Number.POSITIVE_INFINITY;
                const withinCooldown = cooldownHours > 0 && ageHours >= 0 && ageHours < cooldownHours;
                const deltaIsComputable = Number.isFinite(existingFailureCount);
                alertCommentFailureDelta = deltaIsComputable
                  ? (failureCountNumber - existingFailureCount)
                  : failureCountNumber;
                const deltaSatisfies = !deltaIsComputable || alertCommentFailureDelta >= minFailureDelta;

                if (withinCooldown && !deltaSatisfies) {
                  alertCommentAction = 'cooldown-delta-skip';
                  alertCommentCooldownActive = 'true';
                  alertCommentPolicyReason = 'within-cooldown-and-delta-below-threshold';
                  core.info(`Skipped founder fame verifier alert update due to cooldown (${cooldownHours}h): failure delta ${alertCommentFailureDelta} below minimum ${minFailureDelta}.`);
                } else {
                  await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: primary.id,
                    body
                  });
                  alertCommentAction = 'updated';
                  alertCommentPolicyReason = withinCooldown
                    ? 'updated-within-cooldown-delta-threshold-met'
                    : 'updated-cooldown-expired';
                  core.info(`Updated founder fame proof-loop verifier alert comment: ${primary.id}`);
                }

                for (const duplicate of matching.slice(1)) {
                  await github.rest.issues.deleteComment({
                    owner,
                    repo,
                    comment_id: duplicate.id
                  });
                  core.info(`Deleted duplicate founder fame proof-loop verifier alert comment: ${duplicate.id}`);
                }
              } else {
                const created = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body
                });
                alertCommentFailureDelta = failureCountNumber;
                alertCommentAction = 'created';
                alertCommentPolicyReason = 'created-no-existing-comment';
                core.info(`Created founder fame proof-loop verifier alert comment: ${created.data.html_url}`);
              }
            } else {
              for (const existing of matching) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existing.id
                });
                core.info(`Cleared stale founder fame proof-loop verifier alert comment: ${existing.id}`);
              }
              if (matching.length === 0) {
                core.info(`No stale founder fame proof-loop verifier alert comments found on checklist issue #${issueNumber}.`);
                alertCommentAction = 'not-present';
                alertCommentPolicyReason = 'verification-passed-no-comment-present';
              } else {
                alertCommentAction = 'cleared';
                alertCommentPolicyReason = 'verification-passed-cleared-comments';
              }
            }

            emitOutputs(cooldownHours, minFailureDelta);

      - name: Add founder fame proof loop verifier alert summary
        if: env.founder_fame_proof_loop_check_path != '' && steps.monday_publish.outputs.monday_publish_issue_number != '' && steps.founder_fame_proof_loop_verifier_alert_comment.outcome == 'success'
        shell: zsh {0}
        run: |
          set -euo pipefail
          {
            echo "- Founder fame proof loop verifier alert comment action: \`${{ steps.founder_fame_proof_loop_verifier_alert_comment.outputs.alert_comment_action }}\`"
            echo "- Founder fame proof loop verifier alert comment cooldown hours: \`${{ steps.founder_fame_proof_loop_verifier_alert_comment.outputs.alert_comment_cooldown_hours }}\`"
            echo "- Founder fame proof loop verifier alert comment cooldown active: \`${{ steps.founder_fame_proof_loop_verifier_alert_comment.outputs.alert_comment_cooldown_active }}\`"
            echo "- Founder fame proof loop verifier alert comment min failure delta: \`${{ steps.founder_fame_proof_loop_verifier_alert_comment.outputs.alert_comment_min_failure_delta }}\`"
            echo "- Founder fame proof loop verifier alert comment failure delta: \`${{ steps.founder_fame_proof_loop_verifier_alert_comment.outputs.alert_comment_failure_delta }}\`"
            echo "- Founder fame proof loop verifier alert comment policy reason: \`${{ steps.founder_fame_proof_loop_verifier_alert_comment.outputs.alert_comment_policy_reason }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reconcile founder fame proof loop verifier incident issue
        id: founder_fame_proof_loop_incident
        if: env.founder_fame_proof_loop_check_path != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          WEEK: ${{ steps.sprint_metrics.outputs.week }}
          CHECKLIST_ISSUE_NUMBER: ${{ steps.monday_publish.outputs.monday_publish_issue_number }}
          VERIFICATION_OUTCOME: ${{ steps.founder_fame_proof_loop_verify.outcome }}
          CHECK_PATH: ${{ env.founder_fame_proof_loop_check_path }}
          VERIFY_EXIT_CODE: ${{ env.founder_fame_proof_loop_verify_exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CRITICAL_THRESHOLD: ${{ inputs.founder_verifier_critical_threshold }}
          CRITICAL_ASSIGNEE: ${{ inputs.founder_verifier_critical_assignee }}
          CRITICAL_ASSIGNEES: ${{ inputs.founder_verifier_critical_assignees }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- weekly-growth-founder-fame-proof-loop-verifier-incident -->';
            const incidentLabel = { name: 'growth-incident', color: '5319e7', description: 'Growth automation incident requiring operator intervention' };
            const criticalLabel = { name: 'growth-critical', color: 'b60205', description: 'Critical growth incident due to repeated automation failures' };
            const week = (process.env.WEEK || '').trim() || 'unknown-week';
            const checklistIssueNumberRaw = (process.env.CHECKLIST_ISSUE_NUMBER || '').trim();
            const checklistIssueNumber = Number(checklistIssueNumberRaw);
            const hasChecklistIssue = Number.isFinite(checklistIssueNumber) && checklistIssueNumber > 0;
            const verificationOutcome = (process.env.VERIFICATION_OUTCOME || '').trim();
            const checkPath = process.env.CHECK_PATH || 'n/a';
            const verifyExitCode = process.env.VERIFY_EXIT_CODE || 'n/a';
            const runUrl = process.env.RUN_URL || '';
            const criticalThresholdRaw = (process.env.CRITICAL_THRESHOLD || '').trim();
            const parsedCriticalThreshold = Number(criticalThresholdRaw);
            const primaryCriticalAssignee = (process.env.CRITICAL_ASSIGNEE || '').trim().replace(/^@+/, '');
            const fallbackCriticalAssignees = (process.env.CRITICAL_ASSIGNEES || '')
              .split(/[\n,]/)
              .map((value) => value.trim().replace(/^@+/, ''))
              .filter(Boolean);
            const criticalAssigneeCandidates = Array.from(new Set([primaryCriticalAssignee, ...fallbackCriticalAssignees].filter(Boolean)));
            const criticalAssigneeCandidatesText = criticalAssigneeCandidates.length > 0
              ? criticalAssigneeCandidates.map((value) => `@${value}`).join(', ')
              : 'n/a';
            const criticalThreshold = Number.isFinite(parsedCriticalThreshold) && parsedCriticalThreshold >= 2
              ? Math.floor(parsedCriticalThreshold)
              : 3;
            const title = `Growth Incident: Founder Fame Proof Loop Verifier ${week}`;
            const { owner, repo } = context.repo;

            async function ensureLabel(label) {
              try {
                await github.rest.issues.getLabel({
                  owner,
                  repo,
                  name: label.name
                });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                  core.info(`Created label: ${label.name}`);
                } else {
                  throw error;
                }
              }
            }

            function parseFailureCount(body) {
              const match = String(body || '').match(/- Failure occurrences for this week:\s*(\d+)/i);
              const value = match ? Number(match[1]) : 0;
              return Number.isFinite(value) && value >= 0 ? Math.floor(value) : 0;
            }

            function buildBody({ failureCount, criticalEscalated }) {
              return `${marker}

              # Growth Incident: Founder Fame Proof Loop Verifier ${week}

              - Verification outcome: ${verificationOutcome || 'unknown'}
              - Verification exit code: ${verifyExitCode}
              - Review run: ${runUrl || 'n/a'}
              - Verification report artifact: \`${checkPath}\`
              - Checklist issue: ${hasChecklistIssue ? `#${checklistIssueNumber}` : 'n/a'}
              - Failure occurrences for this week: ${failureCount}
              - Critical threshold: ${criticalThreshold}
              - Critical escalation status: ${criticalEscalated ? 'active' : 'monitoring'}
              - Critical owner candidates: ${criticalAssigneeCandidatesText}
              - Action: Fix proof-loop data quality and rerun Weekly Growth Review.
              `;
            }

            let incidentAction = 'none';
            let incidentIssueNumber = '';
            let failureCount = 0;
            let criticalEscalated = false;
            let criticalAssigneeAction = criticalAssigneeCandidates.length > 0 ? 'monitoring' : 'not-configured';
            let criticalAssigneeSelected = '';
            let criticalAssigneeAttempts = 'n/a';

            await ensureLabel(incidentLabel);
            await ensureLabel(criticalLabel);

            async function assignFirstAvailableAssignee(issueNumber) {
              if (criticalAssigneeCandidates.length === 0 || !Number.isFinite(issueNumber) || issueNumber <= 0) return;
              const attempts = [];
              for (const candidate of criticalAssigneeCandidates) {
                try {
                  await github.rest.issues.addAssignees({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    assignees: [candidate]
                  });
                  criticalAssigneeSelected = candidate;
                  attempts.push(`@${candidate}:assigned`);
                  criticalAssigneeAction = 'assigned';
                  core.info(`Assigned founder proof-loop verifier owner @${candidate} to incident issue #${issueNumber}.`);
                  break;
                } catch (error) {
                  const code = Number(error.status || 0);
                  const reason = code === 422 || code === 404 ? 'invalid-or-unassignable' : `error-${code || 'unknown'}`;
                  attempts.push(`@${candidate}:${reason}`);
                  core.warning(`Could not assign @${candidate} to founder proof-loop incident issue #${issueNumber}: ${error.message}`);
                }
              }
              criticalAssigneeAttempts = attempts.length > 0 ? attempts.join('; ') : 'n/a';
              if (!criticalAssigneeSelected) {
                criticalAssigneeAction = 'assign-failed';
              }
            }

            async function removeConfiguredAssignees(issueNumber, options = {}) {
              if (criticalAssigneeCandidates.length === 0 || !Number.isFinite(issueNumber) || issueNumber <= 0) return;
              const updateAction = options.updateAction !== false;
              const attempts = [];
              let removedCount = 0;
              let failedCount = 0;

              for (const candidate of criticalAssigneeCandidates) {
                try {
                  await github.rest.issues.removeAssignees({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    assignees: [candidate]
                  });
                  removedCount += 1;
                  attempts.push(`@${candidate}:unassigned`);
                  core.info(`Removed founder proof-loop verifier owner @${candidate} from incident issue #${issueNumber}.`);
                } catch (error) {
                  if (error.status === 404 || error.status === 422) {
                    attempts.push(`@${candidate}:already-unassigned`);
                  } else {
                    failedCount += 1;
                    attempts.push(`@${candidate}:error-${error.status || 'unknown'}`);
                    core.warning(`Could not unassign @${candidate} from founder proof-loop incident issue #${issueNumber}: ${error.message}`);
                  }
                }
              }

              if (updateAction) {
                criticalAssigneeSelected = '';
                criticalAssigneeAttempts = attempts.length > 0 ? attempts.join('; ') : 'n/a';
                if (failedCount > 0) {
                  criticalAssigneeAction = 'unassign-failed';
                } else if (removedCount > 0) {
                  criticalAssigneeAction = 'unassigned';
                } else {
                  criticalAssigneeAction = 'already-unassigned';
                }
              }
            }

            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100
            });
            const matches = allIssues
              .filter((issue) => !issue.pull_request)
              .filter((issue) => (issue.body || '').includes(marker))
              .filter((issue) => (issue.body || '').includes(`Founder Fame Proof Loop Verifier ${week}`))
              .sort((a, b) => b.number - a.number);

            const primary = matches[0] || null;

            if (verificationOutcome === 'failure') {
              const previousCount = primary ? parseFailureCount(primary.body) : 0;
              failureCount = previousCount + 1;
              criticalEscalated = failureCount >= criticalThreshold;
              const body = buildBody({ failureCount, criticalEscalated });
              const desiredLabels = criticalEscalated
                ? [incidentLabel.name, criticalLabel.name]
                : [incidentLabel.name];

              if (!primary) {
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels: desiredLabels
                });
                incidentAction = 'created';
                incidentIssueNumber = String(created.data.number);
                core.info(`Created founder fame proof-loop verifier incident issue #${created.data.number}.`);
              } else {
                const desiredState = primary.state === 'closed' ? 'open' : undefined;
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: primary.number,
                  title,
                  body,
                  ...(desiredState ? { state: desiredState } : {})
                });
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: primary.number,
                  labels: desiredLabels
                });
                if (!criticalEscalated) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner,
                      repo,
                      issue_number: primary.number,
                      name: criticalLabel.name
                    });
                  } catch (error) {
                    if (error.status !== 404) throw error;
                  }
                }
                incidentAction = primary.state === 'closed' ? 'reopened' : 'updated';
                incidentIssueNumber = String(primary.number);
                core.info(`${incidentAction === 'reopened' ? 'Reopened' : 'Updated'} founder fame proof-loop verifier incident issue #${primary.number}.`);
              }

              if (criticalEscalated) {
                await assignFirstAvailableAssignee(Number(incidentIssueNumber));
              } else if (criticalAssigneeCandidates.length > 0) {
                await removeConfiguredAssignees(Number(incidentIssueNumber));
              }

              for (const duplicate of matches.slice(1)) {
                if (duplicate.state === 'open') {
                  if (criticalAssigneeCandidates.length > 0) {
                    await removeConfiguredAssignees(duplicate.number, { updateAction: false });
                  }
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: duplicate.number,
                    state: 'closed'
                  });
                  core.info(`Closed duplicate founder fame proof-loop verifier incident issue #${duplicate.number}.`);
                }
              }
            } else {
              const openMatches = matches.filter((issue) => issue.state === 'open');
              if (openMatches.length > 0) {
                for (const [index, openIssue] of openMatches.entries()) {
                  if (criticalAssigneeCandidates.length > 0) {
                    await removeConfiguredAssignees(openIssue.number, { updateAction: index === 0 });
                  }
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: openIssue.number,
                    state: 'closed'
                  });
                  core.info(`Closed resolved founder fame proof-loop verifier incident issue #${openIssue.number}.`);
                }
                incidentAction = 'closed';
                incidentIssueNumber = String(openMatches[0].number);
              } else {
                core.info(`No open founder fame proof-loop verifier incident issue found for ${week}.`);
              }
              failureCount = 0;
              criticalEscalated = false;
            }

            core.setOutput('incident_action', incidentAction);
            core.setOutput('incident_issue_number', incidentIssueNumber);
            core.setOutput('failure_count', String(failureCount));
            core.setOutput('critical_threshold', String(criticalThreshold));
            core.setOutput('critical_escalated', criticalEscalated ? 'true' : 'false');
            core.setOutput('critical_assignee', criticalAssigneeSelected);
            core.setOutput('critical_assignee_candidates', criticalAssigneeCandidates.join(','));
            core.setOutput('critical_assignee_selected', criticalAssigneeSelected);
            core.setOutput('critical_assignee_attempts', criticalAssigneeAttempts);
            core.setOutput('critical_assignee_action', criticalAssigneeAction);

      - name: Add founder fame proof loop verifier incident summary
        if: env.founder_fame_proof_loop_check_path != ''
        shell: zsh {0}
        run: |
          set -euo pipefail
          incident_issue="${{ steps.founder_fame_proof_loop_incident.outputs.incident_issue_number }}"
          {
            echo "- Founder fame proof loop verifier incident action: \`${{ steps.founder_fame_proof_loop_incident.outputs.incident_action }}\`"
            echo "- Founder fame proof loop verifier incident issue number: \`${incident_issue:-n/a}\`"
            echo "- Founder fame proof loop verifier incident failure count: \`${{ steps.founder_fame_proof_loop_incident.outputs.failure_count }}\`"
            echo "- Founder fame proof loop verifier incident critical threshold: \`${{ steps.founder_fame_proof_loop_incident.outputs.critical_threshold }}\`"
            echo "- Founder fame proof loop verifier incident critical escalation: \`${{ steps.founder_fame_proof_loop_incident.outputs.critical_escalated }}\`"
            echo "- Founder fame proof loop verifier incident critical assignee candidates: \`${{ steps.founder_fame_proof_loop_incident.outputs.critical_assignee_candidates }}\`"
            echo "- Founder fame proof loop verifier incident critical assignee selected: \`${{ steps.founder_fame_proof_loop_incident.outputs.critical_assignee_selected }}\`"
            echo "- Founder fame proof loop verifier incident critical assignee attempts: \`${{ steps.founder_fame_proof_loop_incident.outputs.critical_assignee_attempts }}\`"
            echo "- Founder fame proof loop verifier incident critical assignee action: \`${{ steps.founder_fame_proof_loop_incident.outputs.critical_assignee_action }}\`"
            echo "- Founder fame proof loop verifier incident reconciliation outcome: \`${{ steps.founder_fame_proof_loop_incident.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reconcile founder fame proof loop critical escalation comment
        id: founder_fame_proof_loop_critical_comment
        if: env.founder_fame_proof_loop_check_path != '' && steps.monday_publish.outputs.monday_publish_issue_number != '' && steps.founder_fame_proof_loop_incident.outcome == 'success'
        uses: actions/github-script@v7
        env:
          CHECKLIST_ISSUE_NUMBER: ${{ steps.monday_publish.outputs.monday_publish_issue_number }}
          VERIFICATION_OUTCOME: ${{ steps.founder_fame_proof_loop_verify.outcome }}
          INCIDENT_ISSUE_NUMBER: ${{ steps.founder_fame_proof_loop_incident.outputs.incident_issue_number }}
          FAILURE_COUNT: ${{ steps.founder_fame_proof_loop_incident.outputs.failure_count }}
          CRITICAL_THRESHOLD: ${{ steps.founder_fame_proof_loop_incident.outputs.critical_threshold }}
          CRITICAL_ESCALATED: ${{ steps.founder_fame_proof_loop_incident.outputs.critical_escalated }}
          CRITICAL_ASSIGNEE: ${{ steps.founder_fame_proof_loop_incident.outputs.critical_assignee_selected }}
          CRITICAL_ASSIGNEE_CANDIDATES: ${{ steps.founder_fame_proof_loop_incident.outputs.critical_assignee_candidates }}
          CRITICAL_ASSIGNEE_ATTEMPTS: ${{ steps.founder_fame_proof_loop_incident.outputs.critical_assignee_attempts }}
          CRITICAL_ASSIGNEE_ACTION: ${{ steps.founder_fame_proof_loop_incident.outputs.critical_assignee_action }}
          CRITICAL_COMMENT_COOLDOWN_HOURS: ${{ inputs.founder_verifier_comment_cooldown_hours }}
          CRITICAL_COMMENT_MIN_FAILURE_DELTA: ${{ inputs.founder_verifier_comment_min_failure_delta }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- weekly-growth-founder-fame-proof-loop-verifier-critical -->';
            let criticalCommentAction = 'none';
            let criticalCommentCooldownActive = 'false';
            let criticalCommentPolicyReason = 'none';
            let criticalCommentFailureDelta = Number.NaN;

            function emitOutputs(cooldownHours, minFailureDelta) {
              core.setOutput('critical_comment_action', criticalCommentAction);
              core.setOutput('critical_comment_cooldown_hours', String(cooldownHours));
              core.setOutput('critical_comment_cooldown_active', criticalCommentCooldownActive);
              core.setOutput('critical_comment_min_failure_delta', String(minFailureDelta));
              core.setOutput('critical_comment_failure_delta', Number.isFinite(criticalCommentFailureDelta) ? String(criticalCommentFailureDelta) : 'n/a');
              core.setOutput('critical_comment_policy_reason', criticalCommentPolicyReason);
            }

            const cooldownHoursRaw = (process.env.CRITICAL_COMMENT_COOLDOWN_HOURS || '').trim();
            const parsedCooldownHours = Number(cooldownHoursRaw);
            const cooldownHours = Number.isFinite(parsedCooldownHours) && parsedCooldownHours >= 0
              ? parsedCooldownHours
              : 24;
            const minFailureDeltaRaw = (process.env.CRITICAL_COMMENT_MIN_FAILURE_DELTA || '').trim();
            const parsedMinFailureDelta = Number(minFailureDeltaRaw);
            const minFailureDelta = Number.isFinite(parsedMinFailureDelta) && parsedMinFailureDelta >= 1
              ? Math.floor(parsedMinFailureDelta)
              : 1;

            const issueNumber = Number(process.env.CHECKLIST_ISSUE_NUMBER || '');
            if (!Number.isFinite(issueNumber) || issueNumber <= 0) {
              criticalCommentAction = 'skipped-invalid-issue';
              criticalCommentPolicyReason = 'invalid-checklist-issue';
              core.info('No valid checklist issue number; skipping founder critical escalation comment reconciliation.');
              emitOutputs(cooldownHours, minFailureDelta);
              return;
            }

            const verificationOutcome = (process.env.VERIFICATION_OUTCOME || '').trim();
            const failureCount = (process.env.FAILURE_COUNT || '').trim() || '0';
            const parsedFailureCount = Number(failureCount);
            const failureCountNumber = Number.isFinite(parsedFailureCount) && parsedFailureCount >= 0
              ? Math.floor(parsedFailureCount)
              : 0;
            const criticalThreshold = (process.env.CRITICAL_THRESHOLD || '').trim() || '3';
            const criticalEscalated = (process.env.CRITICAL_ESCALATED || '').trim() === 'true';
            const incidentIssueNumber = (process.env.INCIDENT_ISSUE_NUMBER || '').trim();
            const criticalAssigneeRaw = (process.env.CRITICAL_ASSIGNEE || '').trim();
            const criticalAssignee = criticalAssigneeRaw ? `@${criticalAssigneeRaw.replace(/^@+/, '')}` : 'n/a';
            const criticalAssigneeCandidatesRaw = (process.env.CRITICAL_ASSIGNEE_CANDIDATES || '').trim();
            const criticalAssigneeCandidates = criticalAssigneeCandidatesRaw
              ? criticalAssigneeCandidatesRaw.split(',').map((value) => value.trim()).filter(Boolean).map((value) => `@${value.replace(/^@+/, '')}`).join(', ')
              : 'n/a';
            const criticalAssigneeAttempts = (process.env.CRITICAL_ASSIGNEE_ATTEMPTS || '').trim() || 'n/a';
            const criticalAssigneeAction = (process.env.CRITICAL_ASSIGNEE_ACTION || '').trim() || 'not-configured';
            const runUrl = process.env.RUN_URL || '';
            const shouldEscalate = verificationOutcome === 'failure' && criticalEscalated;

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100
            });
            const matching = comments
              .filter((comment) => (comment.body || '').includes(marker))
              .sort((left, right) => {
                const leftTs = Date.parse(left.updated_at || left.created_at || '') || 0;
                const rightTs = Date.parse(right.updated_at || right.created_at || '') || 0;
                return rightTs - leftTs;
              });

            if (shouldEscalate) {
              const incidentRef = incidentIssueNumber ? `#${incidentIssueNumber}` : 'n/a';
              const body = `${marker}

              ## Founder Fame Proof Loop Verifier Critical Escalation

              - Status: active
              - Failure count this week: ${failureCountNumber}
              - Critical threshold: ${criticalThreshold}
              - Incident issue: ${incidentRef}
              - Incident owner candidates: ${criticalAssigneeCandidates}
              - Incident owner: ${criticalAssignee}
              - Incident owner attempts: ${criticalAssigneeAttempts}
              - Incident owner action: ${criticalAssigneeAction}
              - Review run: ${runUrl || 'n/a'}
              - Action: Prioritize proof-loop quality remediation before next publish window.
              `;

              if (matching.length > 0) {
                const primary = matching[0];
                const existingFailureMatch = String(primary.body || '').match(/- Failure count this week:\s*(\d+)/i);
                const existingFailureCount = existingFailureMatch ? Number(existingFailureMatch[1]) : Number.NaN;
                const primaryUpdatedAt = Date.parse(primary.updated_at || primary.created_at || '');
                const ageHours = Number.isFinite(primaryUpdatedAt)
                  ? ((Date.now() - primaryUpdatedAt) / (1000 * 60 * 60))
                  : Number.POSITIVE_INFINITY;
                const withinCooldown = cooldownHours > 0 && ageHours >= 0 && ageHours < cooldownHours;
                const deltaIsComputable = Number.isFinite(existingFailureCount);
                criticalCommentFailureDelta = deltaIsComputable
                  ? (failureCountNumber - existingFailureCount)
                  : failureCountNumber;
                const deltaSatisfies = !deltaIsComputable || criticalCommentFailureDelta >= minFailureDelta;

                if (withinCooldown && !deltaSatisfies) {
                  criticalCommentAction = 'cooldown-delta-skip';
                  criticalCommentCooldownActive = 'true';
                  criticalCommentPolicyReason = 'within-cooldown-and-delta-below-threshold';
                  core.info(`Skipped founder critical escalation comment update due to cooldown (${cooldownHours}h): failure delta ${criticalCommentFailureDelta} below minimum ${minFailureDelta}.`);
                } else {
                  await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: primary.id,
                    body
                  });
                  criticalCommentAction = 'updated';
                  criticalCommentPolicyReason = withinCooldown
                    ? 'updated-within-cooldown-delta-threshold-met'
                    : 'updated-cooldown-expired';
                  core.info(`Updated founder critical escalation comment on checklist issue #${issueNumber}.`);
                }

                for (const duplicate of matching.slice(1)) {
                  await github.rest.issues.deleteComment({
                    owner,
                    repo,
                    comment_id: duplicate.id
                  });
                  core.info(`Deleted duplicate founder critical escalation comment: ${duplicate.id}`);
                }
              } else {
                const created = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body
                });
                criticalCommentFailureDelta = failureCountNumber;
                criticalCommentAction = 'created';
                criticalCommentPolicyReason = 'created-no-existing-comment';
                core.info(`Created founder critical escalation comment: ${created.data.html_url}`);
              }
            } else {
              for (const existing of matching) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existing.id
                });
                core.info(`Cleared stale founder critical escalation comment: ${existing.id}`);
              }
              if (matching.length === 0) {
                core.info(`No stale founder critical escalation comments found on checklist issue #${issueNumber}.`);
                criticalCommentAction = 'not-present';
                criticalCommentPolicyReason = 'not-escalated-no-comment-present';
              } else {
                criticalCommentAction = 'cleared';
                criticalCommentPolicyReason = 'not-escalated-cleared-comments';
              }
            }

            emitOutputs(cooldownHours, minFailureDelta);

