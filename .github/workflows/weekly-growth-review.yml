                if (distributionDaysCompletedFromChecks !== null && distributionDaysCompletedFromField !== null) {
                  return Math.max(distributionDaysCompletedFromChecks, distributionDaysCompletedFromField);
                }
                if (distributionDaysCompletedFromChecks !== null) return distributionDaysCompletedFromChecks;
                return distributionDaysCompletedFromField;
              })();
