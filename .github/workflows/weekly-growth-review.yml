            core.setOutput('guesting_signal_enrichment_score_delta', guestingSignalEnrichmentScoreDelta);
            core.setOutput('guesting_signal_recommendation', previousGuestingSignalSummary.recommendation || 'Capture founder guesting signal comments before Friday review.');
            core.setOutput('narrative_route_winner', previousFounderNarrativeSummary.routeWinner || 'n/a');
            core.setOutput('narrative_route_winner_delta', narrativeRouteWinnerDelta);
