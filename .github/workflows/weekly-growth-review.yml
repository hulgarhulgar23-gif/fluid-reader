      - name: Escalate sprint health
        id: escalation
        if: steps.sprint_metrics.outputs.issue_number != '' && steps.sprint_health.outputs.health_status != ''
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.sprint_metrics.outputs.issue_number }}
          WEEK: ${{ steps.sprint_metrics.outputs.week }}
          HEALTH_STATUS: ${{ steps.sprint_health.outputs.health_status }}
          ON_TRACK_COUNT: ${{ steps.sprint_health.outputs.on_track_count }}
          METRIC_FOCUS: ${{ steps.sprint_metrics.outputs.metric_focus }}
          WIN_CARD: ${{ steps.sprint_metrics.outputs.win_card }}
          WIN_RECAP: ${{ steps.sprint_metrics.outputs.win_recap }}
          POSTS: ${{ steps.sprint_metrics.outputs.posts }}
          STORIES: ${{ steps.sprint_metrics.outputs.stories }}
          INSTALLS: ${{ steps.sprint_metrics.outputs.installs }}
          TARGET_WIN_CARD: ${{ inputs.target_win_card }}
          TARGET_WIN_RECAP: ${{ inputs.target_win_recap }}
          TARGET_POSTS: ${{ inputs.target_posts }}
          TARGET_STORIES: ${{ inputs.target_stories }}
          TARGET_INSTALLS: ${{ inputs.target_installs }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const week = process.env.WEEK || '';
            const healthStatus = process.env.HEALTH_STATUS || 'Recovery';
            const onTrackCount = process.env.ON_TRACK_COUNT || '0';
            const metricFocus = process.env.METRIC_FOCUS || 'Win Card copies and reply quality';
            let highlightPlanIssueNumber = '';

            const labels = [
              { name: 'growth-watch', color: 'd73a4a', description: 'Weekly growth sprint needs recovery focus' },
              { name: 'growth-highlight', color: 'fbca04', description: 'Weekly growth sprint exceeded targets' },
              { name: 'growth-risk', color: 'b60205', description: 'Growth recovery plan item' },
              { name: 'growth-scale', color: '0e8a16', description: 'Scale successful growth pattern' }
            ];

            async function ensureLabel(label) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                  core.info(`Created label: ${label.name}`);
                } else {
                  throw error;
                }
              }
            }

            async function removeLabelIfPresent(issue_number, labelName) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name: labelName
                });
                core.info(`Removed label "${labelName}" from issue #${issue_number}.`);
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            async function addLabelIfMissing(issue_number, labelName) {
              const { data: issueLabels } = await github.rest.issues.listLabelsOnIssue({
                owner,
                repo,
                issue_number
              });
              const existingNames = new Set(issueLabels.map((label) => label.name));
              if (!existingNames.has(labelName)) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number,
                  labels: [labelName]
                });
                core.info(`Added label "${labelName}" to issue #${issue_number}.`);
              }
            }

            async function upsertPlanIssue({ title, marker, body, labels }) {
              const { data: allIssues } = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'all',
                per_page: 100
              });
              const existing = allIssues.find((issue) => !issue.pull_request && issue.title === title);
              if (existing) {
                const updated = await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'open',
                  body,
                  labels
                });
                core.info(`Updated plan issue #${updated.data.number}: ${title}`);
                return updated.data.number;
              }
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels
              });
              core.info(`Created plan issue #${created.data.number}: ${title}`);
              return created.data.number;
            }

            async function closePlanIssueByTitle(title, reason) {
              const { data: openIssues } = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                per_page: 100
              });
              const existing = openIssues.find((issue) => !issue.pull_request && issue.title === title);
              if (!existing) return;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: reason
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'closed'
              });
              core.info(`Closed plan issue #${existing.number}: ${title}`);
            }

            for (const label of labels) {
              await ensureLabel(label);
            }

            if (healthStatus === 'Exceptional') {
              await addLabelIfMissing(issueNumber, 'growth-highlight');
              await removeLabelIfPresent(issueNumber, 'growth-watch');
            } else if (healthStatus === 'Recovery') {
              await addLabelIfMissing(issueNumber, 'growth-watch');
              await removeLabelIfPresent(issueNumber, 'growth-highlight');
            } else {
              await removeLabelIfPresent(issueNumber, 'growth-watch');
              await removeLabelIfPresent(issueNumber, 'growth-highlight');
            }

            const recoveryTitle = `Growth Recovery Plan ${week}`;
            const highlightTitle = `Growth Highlight Plan ${week}`;

            const recoveryBody = `<!-- weekly-growth-recovery-plan -->
            # Growth Recovery Plan: ${week}

            Source sprint issue: #${issueNumber}
            Sprint health: ${healthStatus} (${onTrackCount}/5 on track)
            Metric focus: ${metricFocus}

            ## Current KPI Snapshot

            - Win Card copies: ${process.env.WIN_CARD || 'n/a'} (target ${process.env.TARGET_WIN_CARD || '25'})
            - Win Recap copies: ${process.env.WIN_RECAP || 'n/a'} (target ${process.env.TARGET_WIN_RECAP || '20'})
            - Public posts shipped: ${process.env.POSTS || 'n/a'} (target ${process.env.TARGET_POSTS || '3'})
            - User-generated stories: ${process.env.STORIES || 'n/a'} (target ${process.env.TARGET_STORIES || '2'})
            - Inbound installs/trials: ${process.env.INSTALLS || 'n/a'} (target ${process.env.TARGET_INSTALLS || '5'})

            ## 72-Hour Recovery Actions

            - [ ] Ship one additional proof-first post using the highest-performing command.
            - [ ] Respond to all practical questions with exact command sequence within 24 hours.
            - [ ] Convert one repeated objection into docs or workflow update.
            - [ ] Capture one new user story and open/update a win-story issue.
            - [ ] Re-run Friday review to confirm movement.
            `;

            const highlightBody = `<!-- weekly-growth-highlight-plan -->
            # Growth Highlight Plan: ${week}

            Source sprint issue: #${issueNumber}
            Sprint health: ${healthStatus} (${onTrackCount}/5 on track)
            Metric focus: ${metricFocus}

            ## Scale This Week's Winning Pattern

            - Win Card copies: ${process.env.WIN_CARD || 'n/a'}
            - Win Recap copies: ${process.env.WIN_RECAP || 'n/a'}
            - Public posts shipped: ${process.env.POSTS || 'n/a'}
            - User-generated stories: ${process.env.STORIES || 'n/a'}
            - Inbound installs/trials: ${process.env.INSTALLS || 'n/a'}

            ## 7-Day Amplification Actions

            - [ ] Reuse this sprint's top-performing hook in Monday launch post.
            - [ ] Publish one expanded clip/thread showing the exact command flow.
            - [ ] Turn strongest user reply into a reusable testimonial snippet.
            - [ ] Add one new practical example to docs and campaign templates.
            - [ ] Open one "scale experiment" issue for next week's A/B test.
            `;

            if (healthStatus === 'Recovery') {
              const issueId = await upsertPlanIssue({
                title: recoveryTitle,
                marker: 'weekly-growth-recovery-plan',
                body: recoveryBody,
                labels: ['growth', 'growth-risk', 'autopilot']
              });
              await closePlanIssueByTitle(
                highlightTitle,
                `Closing highlight plan because sprint ${week} is currently in recovery mode.`
              );
              core.notice(`Recovery plan issue is active: #${issueId}`);
            } else if (healthStatus === 'Exceptional') {
              const issueId = await upsertPlanIssue({
                title: highlightTitle,
                marker: 'weekly-growth-highlight-plan',
                body: highlightBody,
                labels: ['growth', 'growth-highlight', 'growth-scale', 'autopilot']
              });
              highlightPlanIssueNumber = String(issueId);
              await closePlanIssueByTitle(
                recoveryTitle,
                `Closing recovery plan because sprint ${week} reached exceptional health.`
              );
              core.notice(`Highlight plan issue is active: #${issueId}`);
            } else {
              await closePlanIssueByTitle(
                recoveryTitle,
                `Closing recovery plan because sprint ${week} moved to solid health.`
              );
              await closePlanIssueByTitle(
                highlightTitle,
                `Closing highlight plan because sprint ${week} did not remain exceptional.`
              );
            }

            core.setOutput('highlight_plan_issue_number', highlightPlanIssueNumber);

      - name: Generate Monday draft from highlight plan
        id: monday_draft
        if: steps.escalation.outputs.highlight_plan_issue_number != ''
        uses: actions/github-script@v7
        env:
          HIGHLIGHT_PLAN_ISSUE_NUMBER: ${{ steps.escalation.outputs.highlight_plan_issue_number }}
          WEEK: ${{ steps.sprint_metrics.outputs.week }}
          METRIC_FOCUS: ${{ steps.sprint_metrics.outputs.metric_focus }}
          REVIEW_PATH: ${{ env.review_path }}
          PRIMARY_CHANNEL: ${{ steps.sprint_metrics.outputs.primary_channel }}
          BACKUP_CHANNEL: ${{ steps.sprint_metrics.outputs.backup_channel }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.HIGHLIGHT_PLAN_ISSUE_NUMBER);
            const week = process.env.WEEK || '';
            const metricFocus = process.env.METRIC_FOCUS || 'Win Card copies and reply quality';
            const reviewPath = process.env.REVIEW_PATH || '';
            const primaryChannel = process.env.PRIMARY_CHANNEL || 'X / Threads';
            const backupChannel = process.env.BACKUP_CHANNEL || 'LinkedIn';
            const marker = '<!-- weekly-growth-monday-draft -->';
            const promotedDraftStartMarker = '<!-- weekly-growth-default-drafts-start -->';
            const promotedDraftEndMarker = '<!-- weekly-growth-default-drafts-end -->';

            function clean(value) {
              if (!value) return '';
              return String(value).replace(/\r?\n/g, ' ').trim();
            }

            function extractMetric(body, label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const regex = new RegExp(`^-\\s*${escaped}:\\s*(.*)$`, 'mi');
              const match = (body || '').match(regex);
              return clean(match ? match[1] : '');
            }

            function normalizeVariant(rawVariant) {
              const value = clean(rawVariant).toLowerCase();
              if (!value || value === 'n/a' || value === 'none' || value === 'unknown') {
                return 'n/a';
              }
              if (/(variant\s*a|proof[-\s]?first|(^|[^a-z])a([^a-z]|$))/.test(value)) {
                return 'A';
              }
              if (/(variant\s*b|workflow[-\s]?first|(^|[^a-z])b([^a-z]|$))/.test(value)) {
                return 'B';
              }
              if (/(variant\s*c|objection[-\s]?handler|(^|[^a-z])c([^a-z]|$))/.test(value)) {
                return 'C';
              }
              return 'n/a';
            }

            function parseNumber(value) {
              const match = clean(value).match(/[+-]?\d+(?:\.\d+)?/);
              if (!match) return null;
              const parsed = Number(match[0]);
              return Number.isFinite(parsed) ? parsed : null;
            }

            function extractSectionByHeading(markdownBody, headingText) {
              const lines = String(markdownBody || '').split(/\r?\n/);
              const targetHeading = `### ${clean(headingText).toLowerCase()}`;
              let startIndex = -1;

              for (let index = 0; index < lines.length; index += 1) {
                if (clean(lines[index]).toLowerCase() === targetHeading) {
                  startIndex = index + 1;
                  break;
                }
              }

              if (startIndex < 0) {
                return '';
              }

              const sectionLines = [];
              for (let index = startIndex; index < lines.length; index += 1) {
                if (/^###\s+/.test(lines[index])) {
                  break;
                }
                sectionLines.push(lines[index]);
              }

              return sectionLines.join('\n').trim();
            }

            function extractPromotedScriptsFromReview(reviewBody) {
              const bodyText = String(reviewBody || '');
              if (!bodyText.includes('<!-- weekly-growth-review -->')) {
                return {
                  sourceLabel: 'review marker missing; fallback to generated drafts',
                  primaryChannel: '',
                  primaryVariant: '',
                  primaryScript: '',
                  backupChannel: '',
                  backupVariant: '',
                  backupScript: ''
                };
              }

              const scriptsSection = extractSectionByHeading(bodyText, 'Next-Week Channel Scripts');
              if (!scriptsSection) {
                return {
                  sourceLabel: 'review scripts section missing; fallback to generated drafts',
                  primaryChannel: '',
                  primaryVariant: '',
                  primaryScript: '',
                  backupChannel: '',
                  backupVariant: '',
                  backupScript: ''
                };
              }

              const primaryMatch = scriptsSection.match(/- Primary channel \(`([^`]+)`\): Variant ([A-C])\s*\n+\`\`\`text\n([\s\S]*?)\n\`\`\`/im);
              const backupMatch = scriptsSection.match(/- Backup channel \(`([^`]+)`\): Variant ([A-C])\s*\n+\`\`\`text\n([\s\S]*?)\n\`\`\`/im);

              if (!primaryMatch || !backupMatch) {
                return {
                  sourceLabel: 'review script blocks not parseable; fallback to generated drafts',
                  primaryChannel: '',
                  primaryVariant: '',
                  primaryScript: '',
                  backupChannel: '',
                  backupVariant: '',
                  backupScript: ''
                };
              }

              return {
                sourceLabel: reviewPath,
                primaryChannel: clean(primaryMatch[1]),
                primaryVariant: clean(primaryMatch[2]),
                primaryScript: String(primaryMatch[3] || '').trim(),
                backupChannel: clean(backupMatch[1]),
                backupVariant: clean(backupMatch[2]),
                backupScript: String(backupMatch[3] || '').trim()
              };
            }

            const { data: highlightIssue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber
            });

            const body = highlightIssue.body || '';

            const metrics = [
              { label: 'Win Card copies', value: extractMetric(body, 'Win Card copies') },
              { label: 'Win Recap copies', value: extractMetric(body, 'Win Recap copies') },
              { label: 'Public posts shipped', value: extractMetric(body, 'Public posts shipped') },
              { label: 'User-generated stories', value: extractMetric(body, 'User-generated stories') },
              { label: 'Inbound installs/trials', value: extractMetric(body, 'Inbound installs/trials') }
            ];

            let strongest = null;
            for (const metric of metrics) {
              const numericValue = parseNumber(metric.value);
              if (numericValue === null) continue;
              if (!strongest || numericValue > strongest.numericValue) {
                strongest = {
                  label: metric.label,
                  rawValue: metric.value,
                  numericValue
                };
              }
            }

            const strongestLabel = strongest ? strongest.label : 'Win Card copies';
            const strongestValue = strongest ? strongest.rawValue : 'n/a';
            const openLine = strongest && strongest.numericValue > 0
              ? `This week we hit ${strongestValue} ${strongestLabel.toLowerCase()}.`
              : `This week we focused on ${metricFocus}.`;

            const commandLine = strongestLabel === 'Win Recap copies'
              ? 'Copy Win Recap'
              : 'Copy Win Card';

            const generatedPrimaryDraft = `${openLine}

            Practical flow I used:
            - Option + Shift + Space
            - Read Selected Text
            - ${commandLine}

            Focus: ${metricFocus}.
            Try this exact flow and share your first win.`;

            const generatedBackupDraft = `Weekly build update (${week}):
            ${openLine}

            We turned usage proof into repeatable weekly momentum:
            - Win Card copies: ${metrics[0].value || 'n/a'}
            - Win Recap copies: ${metrics[1].value || 'n/a'}
            - Public posts shipped: ${metrics[2].value || 'n/a'}
            - User-generated stories: ${metrics[3].value || 'n/a'}
            - Inbound installs/trials: ${metrics[4].value || 'n/a'}

            Next move: keep Monday/Wednesday/Friday cadence and tighten replies to practical questions.`;

            const reviewExists = reviewPath && fs.existsSync(reviewPath);
            const reviewBody = reviewExists ? fs.readFileSync(reviewPath, 'utf8') : '';
            const reviewPromotedScripts = reviewExists
              ? extractPromotedScriptsFromReview(reviewBody)
              : {
                sourceLabel: 'review artifact unavailable; fallback to generated drafts',
                primaryChannel: '',
                primaryVariant: '',
                primaryScript: '',
                backupChannel: '',
                backupVariant: '',
                backupScript: ''
              };

            const defaultSourceLabel = reviewExists
              ? (reviewPromotedScripts.sourceLabel || reviewPath)
              : 'review artifact unavailable; fallback to generated drafts';
            const defaultPrimaryChannel = reviewPromotedScripts.primaryChannel || primaryChannel;
            const defaultBackupChannel = reviewPromotedScripts.backupChannel || backupChannel;
            const defaultPrimaryVariant = normalizeVariant(reviewPromotedScripts.primaryVariant);
            const defaultBackupVariant = normalizeVariant(reviewPromotedScripts.backupVariant);
            const defaultPrimaryDraft = reviewPromotedScripts.primaryScript || generatedPrimaryDraft;
            const defaultBackupDraft = reviewPromotedScripts.backupScript || generatedBackupDraft;

            const mondayDraftBody = `${marker}

            ## Monday Draft (Autogenerated)

            Generated from the current **Growth Highlight Plan** issue body, then seeded with Friday review defaults when available.

            ${promotedDraftStartMarker}

            ## Default Publish Drafts (Auto-Promoted)

            - Source review artifact: ${defaultSourceLabel}
            - Primary default draft: ${defaultPrimaryChannel} (Variant ${defaultPrimaryVariant})

            \`\`\`text
            ${defaultPrimaryDraft}
            \`\`\`

            - Backup default draft: ${defaultBackupChannel} (Variant ${defaultBackupVariant})

            \`\`\`text
            ${defaultBackupDraft}
            \`\`\`

            ${promotedDraftEndMarker}

            ### Primary Channel Draft (${defaultPrimaryChannel})

            \`\`\`text
            ${defaultPrimaryDraft}
            \`\`\`

            ### Backup Channel Draft (${defaultBackupChannel})

            \`\`\`text
            ${defaultBackupDraft}
            \`\`\`

            ### Reuse Checklist

            - [ ] Attach one fresh proof image (Win Card or screenshot).
            - [ ] Keep one explicit command in the post body.
            - [ ] Reply with exact command sequence within 24 hours.
            `;

            const outputDir = '.build/growth';
            fs.mkdirSync(outputDir, { recursive: true });
            const mondayDraftPath = path.join(outputDir, `${week}-monday-draft.md`);
            fs.writeFileSync(mondayDraftPath, `${mondayDraftBody}\n`, 'utf8');
            core.info(`Wrote Monday draft artifact: ${mondayDraftPath}`);

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100
            });

            const existing = comments.find((comment) => (comment.body || '').includes(marker));
            if (existing) {
              const updated = await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: mondayDraftBody
              });
              core.info(`Updated Monday draft comment: ${updated.data.html_url}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: mondayDraftBody
              });
              core.info(`Created Monday draft comment: ${created.data.html_url}`);
            }

            core.setOutput('strongest_metric_label', strongestLabel);
            core.setOutput('strongest_metric_value', strongestValue);
            core.setOutput('default_source_label', defaultSourceLabel);
            core.setOutput('default_primary_variant', defaultPrimaryVariant);
            core.setOutput('default_backup_variant', defaultBackupVariant);
            core.setOutput('monday_draft_path', mondayDraftPath);

      - name: Add Monday draft summary
        if: steps.escalation.outputs.highlight_plan_issue_number != ''
        shell: zsh {0}
        run: |
          set -euo pipefail
          {
            echo "- Monday draft source issue: \`#${{ steps.escalation.outputs.highlight_plan_issue_number }}\`"
            echo "- Monday draft strongest metric: \`${{ steps.monday_draft.outputs.strongest_metric_label }}\` (\`${{ steps.monday_draft.outputs.strongest_metric_value }}\`)"
            echo "- Monday draft defaults source: \`${{ steps.monday_draft.outputs.default_source_label }}\`"
            echo "- Monday draft default variants: primary \`${{ steps.monday_draft.outputs.default_primary_variant }}\`, backup \`${{ steps.monday_draft.outputs.default_backup_variant }}\`"
            echo "- Monday draft artifact: \`${{ steps.monday_draft.outputs.monday_draft_path }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert Monday publish checklist issue
        id: monday_publish
        if: steps.monday_draft.outputs.monday_draft_path != ''
        uses: actions/github-script@v7
        env:
          WEEK: ${{ steps.sprint_metrics.outputs.week }}
          SPRINT_ISSUE_NUMBER: ${{ steps.sprint_metrics.outputs.issue_number }}
          HIGHLIGHT_PLAN_ISSUE_NUMBER: ${{ steps.escalation.outputs.highlight_plan_issue_number }}
          MONDAY_DRAFT_PATH: ${{ steps.monday_draft.outputs.monday_draft_path }}
          REVIEW_PATH: ${{ env.review_path }}
          PRIMARY_CHANNEL: ${{ steps.sprint_metrics.outputs.primary_channel }}
          BACKUP_CHANNEL: ${{ steps.sprint_metrics.outputs.backup_channel }}
          STRONGEST_METRIC_LABEL: ${{ steps.monday_draft.outputs.strongest_metric_label }}
          STRONGEST_METRIC_VALUE: ${{ steps.monday_draft.outputs.strongest_metric_value }}
          PRIMARY_CHANNEL_ROI_SCORE: ${{ steps.monday_effectiveness.outputs.primary_channel_roi_score }}
          BACKUP_CHANNEL_ROI_SCORE: ${{ steps.monday_effectiveness.outputs.backup_channel_roi_score }}
          CHANNEL_ROI_RECOMMENDATION: ${{ steps.monday_effectiveness.outputs.channel_roi_recommendation }}
          CHANNEL_ROI_PREFERRED_CHANNEL: ${{ steps.monday_effectiveness.outputs.channel_roi_preferred_channel }}
          OUTREACH_SPRINT_COMPLETION_RATE: ${{ steps.outreach_sprint_outcomes.outputs.outreach_sprint_completion_rate }}
          OUTREACH_SPRINT_CREATOR_TASKS_COMPLETED: ${{ steps.outreach_sprint_outcomes.outputs.outreach_sprint_creator_tasks_completed }}
          OUTREACH_SPRINT_GUESTING_TASKS_COMPLETED: ${{ steps.outreach_sprint_outcomes.outputs.outreach_sprint_guesting_tasks_completed }}
          OUTREACH_SPRINT_VARIANT_PROMOTED: ${{ steps.outreach_sprint_outcomes.outputs.outreach_sprint_variant_promoted }}
          OUTREACH_SPRINT_OUTCOMES_LOGGED: ${{ steps.outreach_sprint_outcomes.outputs.outreach_sprint_outcomes_logged }}
          OUTREACH_SPRINT_PREFERRED_LANE: ${{ steps.outreach_sprint_outcomes.outputs.outreach_sprint_preferred_lane }}
          OUTREACH_SPRINT_RECOMMENDATION: ${{ steps.outreach_sprint_outcomes.outputs.outreach_sprint_recommendation }}
          NARRATIVE_ROUTE_WINNER: ${{ steps.monday_effectiveness.outputs.narrative_route_winner }}
          NARRATIVE_ROUTE_TREND: ${{ steps.monday_effectiveness.outputs.narrative_route_trend }}
          NARRATIVE_FAME_VELOCITY_SCORE: ${{ steps.monday_effectiveness.outputs.narrative_fame_velocity_score }}
          NARRATIVE_LAUNCH_POSTURE: ${{ steps.monday_effectiveness.outputs.narrative_launch_posture }}
          NARRATIVE_NEXT_STANDUP_ACTION: ${{ steps.monday_effectiveness.outputs.narrative_next_standup_action }}
          NARRATIVE_ROUTE_RECOMMENDATION: ${{ steps.monday_effectiveness.outputs.narrative_route_recommendation }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const week = process.env.WEEK || '';
            const sprintIssueNumber = process.env.SPRINT_ISSUE_NUMBER || '';
            const highlightPlanIssueNumber = process.env.HIGHLIGHT_PLAN_ISSUE_NUMBER || '';
            const mondayDraftPath = process.env.MONDAY_DRAFT_PATH || '';
            const reviewPath = process.env.REVIEW_PATH || '';
            const primaryChannel = process.env.PRIMARY_CHANNEL || 'X / Threads';
            const backupChannel = process.env.BACKUP_CHANNEL || 'LinkedIn';
            const strongestMetricLabel = process.env.STRONGEST_METRIC_LABEL || 'Win Card copies';
            const strongestMetricValue = process.env.STRONGEST_METRIC_VALUE || 'n/a';
            const channelROIPreferredChannelInput = process.env.CHANNEL_ROI_PREFERRED_CHANNEL || 'balanced';
            const channelROIRecommendationInput = process.env.CHANNEL_ROI_RECOMMENDATION || 'Collect Monday reply and outreach effectiveness data before routing by channel ROI.';
            const primaryChannelROIScoreInput = process.env.PRIMARY_CHANNEL_ROI_SCORE || 'n/a';
            const backupChannelROIScoreInput = process.env.BACKUP_CHANNEL_ROI_SCORE || 'n/a';
            const outreachSprintCompletionRate = process.env.OUTREACH_SPRINT_COMPLETION_RATE || 'n/a';
            const outreachSprintCreatorTasksCompleted = process.env.OUTREACH_SPRINT_CREATOR_TASKS_COMPLETED || 'n/a';
            const outreachSprintGuestingTasksCompleted = process.env.OUTREACH_SPRINT_GUESTING_TASKS_COMPLETED || 'n/a';
            const outreachSprintVariantPromoted = process.env.OUTREACH_SPRINT_VARIANT_PROMOTED || 'n/a';
            const outreachSprintOutcomesLogged = process.env.OUTREACH_SPRINT_OUTCOMES_LOGGED || 'n/a';
            const outreachSprintPreferredLane = process.env.OUTREACH_SPRINT_PREFERRED_LANE || 'balanced';
            const outreachSprintRecommendation = process.env.OUTREACH_SPRINT_RECOMMENDATION || '';
            const narrativeRouteWinnerInput = process.env.NARRATIVE_ROUTE_WINNER || 'n/a';
            const narrativeRouteTrendInput = process.env.NARRATIVE_ROUTE_TREND || 'n/a';
            const narrativeFameVelocityScoreInput = process.env.NARRATIVE_FAME_VELOCITY_SCORE || 'n/a';
            const narrativeLaunchPostureInput = process.env.NARRATIVE_LAUNCH_POSTURE || 'n/a';
            const narrativeNextStandupActionInput = process.env.NARRATIVE_NEXT_STANDUP_ACTION || 'n/a';
            const narrativeRouteRecommendationInput = process.env.NARRATIVE_ROUTE_RECOMMENDATION || 'Capture founder fame narrative lab comment before Friday review to track route winners.';
            const marker = '<!-- weekly-growth-monday-publish-checklist -->';
            const promotedDraftStartMarker = '<!-- weekly-growth-default-drafts-start -->';
            const promotedDraftEndMarker = '<!-- weekly-growth-default-drafts-end -->';
            const checklistTitle = `Monday Publish Checklist ${week}`;

            if (!mondayDraftPath || !fs.existsSync(mondayDraftPath)) {
              core.setFailed(`Monday draft artifact not found: ${mondayDraftPath}`);
              return;
            }

            const mondayDraft = fs.readFileSync(mondayDraftPath, 'utf8').trim();

            function clean(value) {
              if (!value) return '';
              return String(value).replace(/\r?\n/g, ' ').trim();
            }

            function normalizeVariant(rawVariant) {
              const value = clean(rawVariant).toUpperCase();
              if (value === 'A' || value === 'B' || value === 'C') {
                return value;
              }
              const lowered = clean(rawVariant).toLowerCase();
              if (lowered.includes('variant a') || lowered.includes('proof-first') || lowered === 'a') return 'A';
              if (lowered.includes('variant b') || lowered.includes('workflow-first') || lowered === 'b') return 'B';
              if (lowered.includes('variant c') || lowered.includes('objection-handler') || lowered === 'c') return 'C';
              return 'n/a';
            }

            function normalizePreferredChannel(rawValue) {
              const value = clean(rawValue).toLowerCase();
              if (!value) return 'balanced';
              if (value === 'primary' || value.includes('lead with primary') || value.includes('primary channel')) {
                return 'primary';
              }
              if (value === 'backup' || value.includes('lead with backup') || value.includes('backup channel')) {
                return 'backup';
              }
              return 'balanced';
            }

            function normalizeNarrativeRoute(rawRoute) {
              const value = clean(rawRoute);
              const lowered = value.toLowerCase();
              if (!value || lowered === 'n/a' || lowered === 'none' || lowered === 'unknown') {
                return 'n/a';
              }
              if (/(proof[-\s]?first)/.test(lowered)) return 'Proof-first route';
              if (/(behind[-\s]?the[-\s]?scenes|bts)/.test(lowered)) return 'Behind-the-scenes route';
              if (/(objection[-\s]?breaker|objection[-\s]?handler)/.test(lowered)) return 'Objection-breaker route';
              if (/(hook[-\s]?driven)/.test(lowered)) return 'Hook-driven overlay';
              return value;
            }

            function resolveNarrativePreferredVariant(routeWinner) {
              const normalizedRoute = normalizeNarrativeRoute(routeWinner);
              if (normalizedRoute === 'Proof-first route') return 'A';
              if (normalizedRoute === 'Behind-the-scenes route') return 'B';
              if (normalizedRoute === 'Objection-breaker route') return 'C';
              return 'n/a';
            }

            function extractTextBlocks(markdownBody) {
              const matches = String(markdownBody || '').matchAll(/\`\`\`text\n([\s\S]*?)\n\`\`\`/g);
              const blocks = [];
              for (const match of matches) {
                blocks.push(String(match[1] || '').trim());
              }
              return blocks;
            }

            function extractSectionByHeading(markdownBody, headingText) {
              const lines = String(markdownBody || '').split(/\r?\n/);
              const targetHeading = clean(headingText).toLowerCase();
              let startIndex = -1;

              for (let index = 0; index < lines.length; index += 1) {
                const headingMatch = clean(lines[index]).match(/^#{2,6}\s+(.+)$/);
                if (!headingMatch) continue;
                if (clean(headingMatch[1]).toLowerCase() === targetHeading) {
                  startIndex = index + 1;
                  break;
                }
              }

              if (startIndex < 0) {
                return '';
              }

              const sectionLines = [];
              for (let index = startIndex; index < lines.length; index += 1) {
                if (/^#{2,6}\s+/.test(lines[index])) {
                  break;
                }
                sectionLines.push(lines[index]);
              }

              return sectionLines.join('\n').trim();
            }

            function extractPromotedDefaults(markdownBody) {
              const text = String(markdownBody || '');
              const markerRegex = new RegExp(`${promotedDraftStartMarker}[\\s\\S]*?${promotedDraftEndMarker}`, 'm');
              const markedSection = text.match(markerRegex);
              const source = markedSection ? String(markedSection[0] || '') : extractSectionByHeading(text, 'Default Publish Drafts (Auto-Promoted)');
              if (!source) {
                return {
                  found: false,
                  sourceLabel: '',
                  primaryChannel: '',
                  primaryVariant: '',
                  primaryScript: '',
                  backupChannel: '',
                  backupVariant: '',
                  backupScript: ''
                };
              }

              const sourceMatch = source.match(/^- Source review artifact:\s*(.*)$/mi);
              const primaryMatch = source.match(/- Primary default draft:\s*(.+?)\s+\(Variant ([A-C]|n\/a)\)\s*\n+\`\`\`text\n([\s\S]*?)\n\`\`\`/im);
              const backupMatch = source.match(/- Backup default draft:\s*(.+?)\s+\(Variant ([A-C]|n\/a)\)\s*\n+\`\`\`text\n([\s\S]*?)\n\`\`\`/im);
              if (!primaryMatch || !backupMatch) {
                return {
                  found: false,
                  sourceLabel: clean(sourceMatch ? sourceMatch[1] : ''),
                  primaryChannel: '',
                  primaryVariant: '',
                  primaryScript: '',
                  backupChannel: '',
                  backupVariant: '',
                  backupScript: ''
                };
              }

              return {
                found: true,
                sourceLabel: clean(sourceMatch ? sourceMatch[1] : ''),
                primaryChannel: clean(primaryMatch[1]),
                primaryVariant: clean(primaryMatch[2]),
                primaryScript: String(primaryMatch[3] || '').trim(),
                backupChannel: clean(backupMatch[1]),
                backupVariant: clean(backupMatch[2]),
                backupScript: String(backupMatch[3] || '').trim()
              };
            }

            function extractPromotedScriptsFromReview(reviewBody) {
              const reviewText = String(reviewBody || '');
              if (!reviewText.includes('<!-- weekly-growth-review -->')) {
                return {
                  found: false,
                  sourceLabel: 'review marker missing; fallback to promoted draft markers',
                  primaryChannel: '',
                  primaryVariant: '',
                  primaryScript: '',
                  backupChannel: '',
                  backupVariant: '',
                  backupScript: '',
                  recommendation: ''
                };
              }

              const scriptsSection = extractSectionByHeading(reviewText, 'Next-Week Channel Scripts');
              if (!scriptsSection) {
                return {
                  found: false,
                  sourceLabel: 'review scripts section missing; fallback to promoted draft markers',
                  primaryChannel: '',
                  primaryVariant: '',
                  primaryScript: '',
                  backupChannel: '',
                  backupVariant: '',
                  backupScript: '',
                  recommendation: clean((reviewText.match(/^- Next-week variant recommendation:\s*(.*)$/mi) || [])[1] || '')
                };
              }

              const primaryMatch = scriptsSection.match(/- Primary channel \(`([^`]+)`\): Variant ([A-C])\s*\n+\`\`\`text\n([\s\S]*?)\n\`\`\`/im);
              const backupMatch = scriptsSection.match(/- Backup channel \(`([^`]+)`\): Variant ([A-C])\s*\n+\`\`\`text\n([\s\S]*?)\n\`\`\`/im);
              const recommendationMatch = reviewText.match(/^- Next-week variant recommendation:\s*(.*)$/mi);
              if (!primaryMatch || !backupMatch) {
                return {
                  found: false,
                  sourceLabel: 'review script blocks not parseable; fallback to promoted draft markers',
                  primaryChannel: '',
                  primaryVariant: '',
                  primaryScript: '',
                  backupChannel: '',
                  backupVariant: '',
                  backupScript: '',
                  recommendation: clean(recommendationMatch ? recommendationMatch[1] : '')
                };
              }

              return {
                found: true,
                sourceLabel: reviewPath,
                primaryChannel: clean(primaryMatch[1]),
                primaryVariant: clean(primaryMatch[2]),
                primaryScript: String(primaryMatch[3] || '').trim(),
                backupChannel: clean(backupMatch[1]),
                backupVariant: clean(backupMatch[2]),
                backupScript: String(backupMatch[3] || '').trim(),
                recommendation: clean(recommendationMatch ? recommendationMatch[1] : '')
              };
            }

            const labels = [
              { name: 'monday-publish', color: '1d76db', description: 'Monday growth publish checklist' }
            ];

            async function ensureLabel(label) {
              try {
                await github.rest.issues.getLabel({
                  owner,
                  repo,
                  name: label.name
                });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                  core.info(`Created label: ${label.name}`);
                } else {
                  throw error;
                }
              }
            }

            for (const label of labels) {
              await ensureLabel(label);
            }

            const { data: allIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'all',
              per_page: 100
            });

            const existing = allIssues.find((issue) =>
              !issue.pull_request && issue.title === checklistTitle
            );

            const existingBody = existing ? (existing.body || '') : '';

            function extractExistingField(label, fallbackValue) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const regex = new RegExp(`^-\\s*${escaped}:\\s*(.*)$`, 'mi');
              const match = existingBody.match(regex);
              const parsed = clean(match ? match[1] : '');
              return parsed || fallbackValue;
            }

            function parseNumber(value) {
              const match = clean(value).match(/[+-]?\d+(?:\.\d+)?/);
              if (!match) return null;
              const parsed = Number(match[0]);
              return Number.isFinite(parsed) ? parsed : null;
            }

            function computeRate(numeratorValue, denominatorValue) {
              if (numeratorValue === null || denominatorValue === null) return null;
              if (denominatorValue <= 0) return null;
              return numeratorValue / denominatorValue;
            }

            function formatRate(rateValue) {
              if (rateValue === null || !Number.isFinite(rateValue)) return 'n/a';
              const percent = rateValue * 100;
              const rounded = Math.round(percent * 10) / 10;
              return `${rounded}%`;
            }

            const reviewExists = reviewPath && fs.existsSync(reviewPath);
            const reviewBody = reviewExists ? fs.readFileSync(reviewPath, 'utf8') : '';
            const reviewPromoted = reviewExists
              ? extractPromotedScriptsFromReview(reviewBody)
              : {
                found: false,
                sourceLabel: 'review artifact unavailable; fallback to promoted draft markers',
                primaryChannel: '',
                primaryVariant: '',
                primaryScript: '',
                backupChannel: '',
                backupVariant: '',
                backupScript: '',
                recommendation: ''
              };
            const mondayDraftPromoted = extractPromotedDefaults(mondayDraft);
            const existingPromoted = extractPromotedDefaults(existingBody);
            const mondayDraftBlocks = extractTextBlocks(mondayDraft);
            const mondayPrimaryDraftFallback = mondayDraftBlocks[0] || mondayDraft;
            const mondayBackupDraftFallback = mondayDraftBlocks[1] || mondayPrimaryDraftFallback;

            let promotedSourceLabel = reviewExists
              ? `${reviewPath} (${reviewPromoted.sourceLabel || 'fallback to promoted draft markers'})`
              : 'review artifact unavailable; fallback to promoted draft markers';
            let promotedPrimaryChannel = primaryChannel;
            let promotedBackupChannel = backupChannel;
            let promotedPrimaryVariantRaw = 'n/a';
            let promotedBackupVariantRaw = 'n/a';
            let promotedPrimaryScript = mondayPrimaryDraftFallback;
            let promotedBackupScript = mondayBackupDraftFallback;
            let promotedRecommendation = '';

            if (reviewPromoted.found) {
              promotedSourceLabel = reviewPromoted.sourceLabel || reviewPath;
              promotedPrimaryChannel = reviewPromoted.primaryChannel || promotedPrimaryChannel;
              promotedBackupChannel = reviewPromoted.backupChannel || promotedBackupChannel;
              promotedPrimaryVariantRaw = reviewPromoted.primaryVariant || promotedPrimaryVariantRaw;
              promotedBackupVariantRaw = reviewPromoted.backupVariant || promotedBackupVariantRaw;
              promotedPrimaryScript = reviewPromoted.primaryScript || promotedPrimaryScript;
              promotedBackupScript = reviewPromoted.backupScript || promotedBackupScript;
              promotedRecommendation = clean(reviewPromoted.recommendation);
            } else if (existingPromoted.found) {
              promotedSourceLabel = existingPromoted.sourceLabel || 'existing checklist defaults (auto-promoted section)';
              promotedPrimaryChannel = existingPromoted.primaryChannel || promotedPrimaryChannel;
              promotedBackupChannel = existingPromoted.backupChannel || promotedBackupChannel;
              promotedPrimaryVariantRaw = existingPromoted.primaryVariant || promotedPrimaryVariantRaw;
              promotedBackupVariantRaw = existingPromoted.backupVariant || promotedBackupVariantRaw;
              promotedPrimaryScript = existingPromoted.primaryScript || promotedPrimaryScript;
              promotedBackupScript = existingPromoted.backupScript || promotedBackupScript;
            } else if (mondayDraftPromoted.found) {
              promotedSourceLabel = mondayDraftPromoted.sourceLabel || `${mondayDraftPath} (auto-promoted section)`;
              promotedPrimaryChannel = mondayDraftPromoted.primaryChannel || promotedPrimaryChannel;
              promotedBackupChannel = mondayDraftPromoted.backupChannel || promotedBackupChannel;
              promotedPrimaryVariantRaw = mondayDraftPromoted.primaryVariant || promotedPrimaryVariantRaw;
              promotedBackupVariantRaw = mondayDraftPromoted.backupVariant || promotedBackupVariantRaw;
              promotedPrimaryScript = mondayDraftPromoted.primaryScript || promotedPrimaryScript;
              promotedBackupScript = mondayDraftPromoted.backupScript || promotedBackupScript;
            }

            const promotedPrimaryVariant = normalizeVariant(promotedPrimaryVariantRaw);
            const promotedBackupVariant = normalizeVariant(promotedBackupVariantRaw);

            const mondayPostStatus = extractExistingField('Monday post status', 'not posted');
            const repliesSent = extractExistingField('Replies sent', '0');
            const objectionsCaptured = extractExistingField('Objections captured', '0');
            const docsWorkflowUpdates = extractExistingField('Docs/workflow updates', '0');
            const creatorOutreachSent = extractExistingField('Creator outreach sent', '0');
            const creatorOutreachReplies = extractExistingField('Creator outreach replies', '0');
            const creatorCollaborations = extractExistingField('Creator collaborations', '0');
            const communityCrossPosts = extractExistingField('Community cross-posts', '0');
            const creatorOutreachSentNumber = parseNumber(creatorOutreachSent);
            const creatorOutreachRepliesNumber = parseNumber(creatorOutreachReplies);
            const creatorCollaborationsNumber = parseNumber(creatorCollaborations);
            const communityCrossPostsNumber = parseNumber(communityCrossPosts);
            const creatorReplyRate = formatRate(computeRate(creatorOutreachRepliesNumber, creatorOutreachSentNumber));
            const creatorCollabRate = formatRate(computeRate(creatorCollaborationsNumber, creatorOutreachSentNumber));
            const creatorCrossPostRate = formatRate(computeRate(communityCrossPostsNumber, creatorOutreachSentNumber));
            const primaryTopVariantExisting = normalizeVariant(extractExistingField('Primary channel top variant', 'n/a'));
            const backupTopVariantExisting = normalizeVariant(extractExistingField('Backup channel top variant', 'n/a'));
            const defaultVariantPlan = 'Start with Variant A on primary and Variant B on backup, then log winners.';
            const recommendedVariantPlanExisting = extractExistingField('Recommended next-week variant plan', defaultVariantPlan);
            const defaultOutreachPlan = (() => {
              const completionRateNumber = parseNumber(outreachSprintCompletionRate);
              const creatorTasksCompletedNumber = parseNumber(outreachSprintCreatorTasksCompleted);
              const guestingTasksCompletedNumber = parseNumber(outreachSprintGuestingTasksCompleted);
              const normalizedLane = clean(outreachSprintPreferredLane).toLowerCase();
              const variantPromoted = /^(yes|y|true|1|done|completed)$/i.test(clean(outreachSprintVariantPromoted));
              const outcomesLogged = /^(yes|y|true|1|done|completed)$/i.test(clean(outreachSprintOutcomesLogged));
              const recommendationLine = clean(outreachSprintRecommendation);

              if (recommendationLine) {
                return recommendationLine;
              }
              if (completionRateNumber !== null && completionRateNumber < 50) {
                return 'Close unchecked founder outreach sprint tasks before expanding new creator and guesting targets.';
              }
              if (!variantPromoted) {
                return 'Promote one winning outreach script variant into next-week defaults before Monday publish.';
              }
              if (!outcomesLogged) {
                return 'Log founder outreach sprint outcomes in checklist comments so next-week ranking defaults remain evidence-backed.';
              }
              if (completionRateNumber !== null && completionRateNumber >= 75) {
                if (normalizedLane === 'creator' || (creatorTasksCompletedNumber !== null && guestingTasksCompletedNumber !== null && creatorTasksCompletedNumber > guestingTasksCompletedNumber)) {
                  return 'Creator execution outpaced guesting this week; bias next-week defaults to creator-first while preserving one guesting booking wave.';
                }
                if (normalizedLane === 'guesting' || (creatorTasksCompletedNumber !== null && guestingTasksCompletedNumber !== null && guestingTasksCompletedNumber > creatorTasksCompletedNumber)) {
                  return 'Guesting execution outpaced creator outreach this week; bias next-week defaults to booking-first while preserving creator follow-ups.';
                }
                return 'Keep creator and guesting lanes balanced and scale the winning outreach script route.';
              }
              return 'Send 5 targeted creator messages and log outcomes in Monday checklist.';
            })();
            const creatorOutreachRecommendation = extractExistingField('Creator outreach recommendation', defaultOutreachPlan);
            const defaultROIRecommendation = 'Collect Monday reply and outreach effectiveness data before routing by channel ROI.';
            const primaryChannelROIScore = extractExistingField('Primary channel ROI score', clean(primaryChannelROIScoreInput) || 'n/a');
            const backupChannelROIScore = extractExistingField('Backup channel ROI score', clean(backupChannelROIScoreInput) || 'n/a');
            const channelROIRecommendation = extractExistingField('Channel ROI recommendation', clean(channelROIRecommendationInput) || defaultROIRecommendation);
            const channelROIPreferredChannelExisting = normalizePreferredChannel(extractExistingField('Channel ROI preferred channel', 'balanced'));
            const channelROIPreferredChannelInputNormalized = normalizePreferredChannel(channelROIPreferredChannelInput);
            const channelROIPreferenceFromRecommendation = normalizePreferredChannel(channelROIRecommendation);
            const resolvedChannelROIPreference = channelROIPreferredChannelInputNormalized !== 'balanced'
              ? channelROIPreferredChannelInputNormalized
              : (channelROIPreferredChannelExisting !== 'balanced'
                ? channelROIPreferredChannelExisting
                : channelROIPreferenceFromRecommendation);
            const defaultChannelMixRecommendation = resolvedChannelROIPreference === 'primary'
              ? 'Use a primary-led 60/40 mix until distribution execution score is strong.'
              : (resolvedChannelROIPreference === 'backup'
                ? 'Use a backup-led 60/40 mix until distribution execution score is strong.'
                : 'Keep a balanced 50/50 mix until one channel clearly outperforms.');
            const primaryTopVariant = primaryTopVariantExisting !== 'n/a' ? primaryTopVariantExisting : (promotedPrimaryVariant !== 'n/a' ? promotedPrimaryVariant : 'n/a');
            const backupTopVariant = backupTopVariantExisting !== 'n/a' ? backupTopVariantExisting : (promotedBackupVariant !== 'n/a' ? promotedBackupVariant : 'n/a');
            let recommendedVariantPlan = recommendedVariantPlanExisting !== defaultVariantPlan
              ? recommendedVariantPlanExisting
              : (promotedRecommendation || defaultVariantPlan);
            const distributionFollowupStatus = extractExistingField('Distribution follow-up status', 'not started');
            const distributionDaysCompleted = extractExistingField('Distribution days completed', '0/8');
            const distributionCompletionScore = extractExistingField('Distribution completion score', 'n/a');
            const channelMixRecommendation = extractExistingField('Channel mix recommendation', defaultChannelMixRecommendation);
            const followUpNotes = extractExistingField('Follow-up notes', 'none yet');

            let defaultDraftsSource = promotedSourceLabel;
            let defaultPrimaryChannel = promotedPrimaryChannel || primaryChannel;
            let defaultBackupChannel = promotedBackupChannel || backupChannel;
            let defaultPrimaryVariant = primaryTopVariant !== 'n/a' ? primaryTopVariant : (promotedPrimaryVariant !== 'n/a' ? promotedPrimaryVariant : 'n/a');
            let defaultBackupVariant = backupTopVariant !== 'n/a' ? backupTopVariant : (promotedBackupVariant !== 'n/a' ? promotedBackupVariant : 'n/a');
            let defaultPrimaryScript = promotedPrimaryScript || mondayPrimaryDraftFallback;
            let defaultBackupScript = promotedBackupScript || mondayBackupDraftFallback;

            if (resolvedChannelROIPreference === 'backup') {
              defaultDraftsSource = `${defaultDraftsSource} [ROI lead: backup]`;
              defaultPrimaryChannel = promotedBackupChannel || defaultPrimaryChannel;
              defaultPrimaryVariant = backupTopVariant !== 'n/a'
                ? backupTopVariant
                : (promotedBackupVariant !== 'n/a' ? promotedBackupVariant : defaultPrimaryVariant);
              defaultPrimaryScript = promotedBackupScript || defaultPrimaryScript;
              defaultBackupChannel = promotedPrimaryChannel || defaultBackupChannel;
              defaultBackupVariant = primaryTopVariant !== 'n/a'
                ? primaryTopVariant
                : (promotedPrimaryVariant !== 'n/a' ? promotedPrimaryVariant : defaultBackupVariant);
              defaultBackupScript = promotedPrimaryScript || defaultBackupScript;
            } else if (resolvedChannelROIPreference === 'primary') {
              defaultDraftsSource = `${defaultDraftsSource} [ROI lead: primary]`;
            }

            const normalizedNarrativeRouteWinner = normalizeNarrativeRoute(narrativeRouteWinnerInput);
            const narrativeRouteTrend = clean(narrativeRouteTrendInput) || 'n/a';
            const narrativeFameVelocityScore = clean(narrativeFameVelocityScoreInput) || 'n/a';
            const narrativeLaunchPosture = clean(narrativeLaunchPostureInput) || 'n/a';
            const narrativeNextStandupAction = clean(narrativeNextStandupActionInput) || 'n/a';
            const narrativeRouteRecommendation = clean(narrativeRouteRecommendationInput) || 'Capture founder fame narrative lab comment before Friday review to track route winners.';
            const narrativePreferredVariant = resolveNarrativePreferredVariant(normalizedNarrativeRouteWinner);
            const narrativeTrendLower = narrativeRouteTrend.toLowerCase();
            const narrativePostureLower = narrativeLaunchPosture.toLowerCase();
            const narrativeFameVelocityScoreNumber = parseNumber(narrativeFameVelocityScore);
            const narrativeSignalStrong = narrativeTrendLower.startsWith('shifted from')
              || (Number.isFinite(narrativeFameVelocityScoreNumber) && narrativeFameVelocityScoreNumber >= 70)
              || narrativePostureLower.includes('recovery')
              || narrativePostureLower.includes('stabilize')
              || narrativePostureLower.includes('watch');
            let narrativeRoutingAction = 'not-applied';
            let narrativeRoutingReason = 'Narrative winner is not mapped to a concrete variant.';

            if (narrativePreferredVariant !== 'n/a') {
              const primaryMatchesNarrative = defaultPrimaryVariant === narrativePreferredVariant;
              const backupMatchesNarrative = defaultBackupVariant === narrativePreferredVariant;
              if (primaryMatchesNarrative) {
                narrativeRoutingAction = 'already-primary';
                narrativeRoutingReason = `Primary default already aligns with narrative winner variant ${narrativePreferredVariant}.`;
                defaultDraftsSource = `${defaultDraftsSource} [Narrative lead confirmed: Variant ${narrativePreferredVariant}]`;
              } else if (backupMatchesNarrative) {
                const swappedPrimaryChannel = defaultBackupChannel;
                const swappedPrimaryVariant = defaultBackupVariant;
                const swappedPrimaryScript = defaultBackupScript;
                defaultBackupChannel = defaultPrimaryChannel;
                defaultBackupVariant = defaultPrimaryVariant;
                defaultBackupScript = defaultPrimaryScript;
                defaultPrimaryChannel = swappedPrimaryChannel;
                defaultPrimaryVariant = swappedPrimaryVariant;
                defaultPrimaryScript = swappedPrimaryScript;
                narrativeRoutingAction = 'promoted-backup-to-primary';
                narrativeRoutingReason = `Promoted narrative winner variant ${narrativePreferredVariant} to primary default lane.`;
                defaultDraftsSource = `${defaultDraftsSource} [Narrative lead: Variant ${narrativePreferredVariant}]`;
              } else if (narrativeSignalStrong) {
                defaultPrimaryVariant = narrativePreferredVariant;
                narrativeRoutingAction = 'forced-primary-variant';
                narrativeRoutingReason = `No promoted script matched Variant ${narrativePreferredVariant}; primary variant label forced from narrative signal.`;
                defaultDraftsSource = `${defaultDraftsSource} [Narrative override: Variant ${narrativePreferredVariant}]`;
              } else {
                narrativeRoutingAction = 'watchlist-only';
                narrativeRoutingReason = `Narrative winner points to Variant ${narrativePreferredVariant}, but defaults were kept until stronger confidence.`;
              }

              if (recommendedVariantPlanExisting === defaultVariantPlan) {
                recommendedVariantPlan = `Lead with Variant ${narrativePreferredVariant} to match ${normalizedNarrativeRouteWinner}; ${narrativeRouteRecommendation}`;
              }
            }

            const checklistBody = `${marker}

            # Monday Publish Checklist: ${week}

            Source sprint issue: #${sprintIssueNumber}
            Source highlight plan: #${highlightPlanIssueNumber}
            Strongest metric: ${strongestMetricLabel} (${strongestMetricValue})

            ## Publish Readiness

            - [ ] Confirm one fresh proof asset is attached (Win Card or screenshot).
            - [ ] Confirm one explicit command appears in post body.
            - [ ] Confirm CTA is direct and practical.
            - [ ] Confirm links point to current docs/repo.
            - [ ] Confirm first response window is scheduled within 24 hours.

            ## First 24-Hour Reply Effectiveness

            - Monday post status: ${mondayPostStatus}
            - Replies sent: ${repliesSent}
            - Objections captured: ${objectionsCaptured}
            - Docs/workflow updates: ${docsWorkflowUpdates}
            - Creator outreach sent: ${creatorOutreachSent}
            - Creator outreach replies: ${creatorOutreachReplies}
            - Creator collaborations: ${creatorCollaborations}
            - Community cross-posts: ${communityCrossPosts}
            - Creator reply rate: ${creatorReplyRate}
            - Creator collaboration rate: ${creatorCollabRate}
            - Community cross-post rate: ${creatorCrossPostRate}
            - Primary channel top variant: ${primaryTopVariant}
            - Backup channel top variant: ${backupTopVariant}
            - Primary channel ROI score: ${primaryChannelROIScore}
            - Backup channel ROI score: ${backupChannelROIScore}
            - Channel ROI preferred channel: ${resolvedChannelROIPreference}
            - Channel ROI recommendation: ${channelROIRecommendation}
            - Founder narrative route winner: ${normalizedNarrativeRouteWinner}
            - Founder narrative route trend: ${narrativeRouteTrend}
            - Founder narrative fame velocity score: ${narrativeFameVelocityScore}
            - Founder narrative launch posture: ${narrativeLaunchPosture}
            - Founder narrative next standup action: ${narrativeNextStandupAction}
            - Founder narrative route recommendation: ${narrativeRouteRecommendation}
            - Founder narrative preferred variant: ${narrativePreferredVariant}
            - Founder narrative routing action: ${narrativeRoutingAction}
            - Founder narrative routing reason: ${narrativeRoutingReason}
            - Recommended next-week variant plan: ${recommendedVariantPlan}
            - Creator outreach recommendation: ${creatorOutreachRecommendation}
            - Follow-up notes: ${followUpNotes}

            ## Creator Signal Intake (for next Friday ranking)

            Add or update one comment on this issue with marker \`<!-- weekly-growth-creator-signal -->\`.
            Repeat the block once per creator handle so Friday review can auto-score enrichment signals:

            \`\`\`text
            <!-- weekly-growth-creator-signal -->
            - Handle: @creator_handle
            - Segment: Workflow/tutorial creators
            - Channel: primary
            - Fit score: 78
            - Warm intro: yes
            - Status: replied
            \`\`\`

            ## Founder Guesting Signal Intake (for next Friday ranking)

            Add or update one comment on this issue with marker \`<!-- weekly-growth-founder-guesting-signal -->\`.
            Repeat the block once per guesting target (podcast/newsletter/community):

            \`\`\`text
            <!-- weekly-growth-founder-guesting-signal -->
            - Target: Operator Podcast Network / @host_handle
            - Format: podcast
            - Stage: replied
            - Lead channel: primary
            - Priority score: 76
            - Warm intro: yes
            - Status: booked
            \`\`\`

            ## Founder Outreach Sprint Outcome Intake (for next Friday feedback loop)

            Update the existing comment with marker \`<!-- weekly-growth-founder-fame-outreach-sprint -->\`.
            Keep \`## Execution Checklist\` task checkboxes current so Friday review can auto-ingest creator/guesting execution outcomes.
            Keep \`## Lane Owner Defaults (Auto-Prefilled)\` owner-default checkboxes current so Friday review can score owner coverage across creator/guesting/distribution/ops lanes.

            ## Distribution Follow-Up Execution

            - Distribution follow-up status: ${distributionFollowupStatus}
            - Distribution days completed: ${distributionDaysCompleted}
            - Distribution completion score: ${distributionCompletionScore}
            - Channel mix recommendation: ${channelMixRecommendation}
            - [ ] Day 0 launch proof-first post + initial replies completed.
            - [ ] Day 1 support-channel workflow follow-up completed.
            - [ ] Day 2 creator/community follow-up wave 1 completed.
            - [ ] Day 3 objection-handler repost completed.
            - [ ] Day 4 creator/community follow-up wave 2 completed.
            - [ ] Day 5 docs/workflow conversion completed.
            - [ ] Day 6 proof recap + collaboration nudge completed.
            - [ ] Day 7 Friday review handoff completed.

            ${promotedDraftStartMarker}

            ## Default Publish Drafts (Auto-Promoted)

            - Source review artifact: ${defaultDraftsSource}
            - Primary default draft: ${defaultPrimaryChannel} (Variant ${defaultPrimaryVariant})

            \`\`\`text
            ${defaultPrimaryScript}
            \`\`\`

            - Backup default draft: ${defaultBackupChannel} (Variant ${defaultBackupVariant})

            \`\`\`text
            ${defaultBackupScript}
            \`\`\`

            - Narrative route preferred variant: ${narrativePreferredVariant}
            - Narrative route routing action: ${narrativeRoutingAction}
            - [ ] Start from primary default draft unless fresh proof suggests switching.
            - [ ] If switching variants, log reason in follow-up notes.

            ${promotedDraftEndMarker}

            ## Monday Draft Source

            ${mondayDraft}
            `;

            const labelsToApply = ['growth', 'autopilot', 'monday-publish', 'growth-highlight'];
            let issueNumber;
            if (existing) {
              const updated = await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'open',
                body: checklistBody,
                labels: labelsToApply
              });
              issueNumber = updated.data.number;
              core.info(`Updated Monday publish checklist issue #${issueNumber}: ${checklistTitle}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: checklistTitle,
                body: checklistBody,
                labels: labelsToApply
              });
              issueNumber = created.data.number;
              core.info(`Created Monday publish checklist issue #${issueNumber}: ${checklistTitle}`);
            }

            core.setOutput('monday_publish_issue_number', String(issueNumber));
            core.setOutput('default_primary_variant', defaultPrimaryVariant);
            core.setOutput('default_backup_variant', defaultBackupVariant);
            core.setOutput('default_drafts_source', defaultDraftsSource);
            core.setOutput('channel_roi_recommendation', channelROIRecommendation);
            core.setOutput('channel_roi_preferred_channel', resolvedChannelROIPreference);
            core.setOutput('channel_mix_recommendation', channelMixRecommendation);
            core.setOutput('narrative_route_preferred_variant', narrativePreferredVariant);
            core.setOutput('narrative_route_routing_action', narrativeRoutingAction);
            core.setOutput('narrative_route_routing_reason', narrativeRoutingReason);

      - name: Close Monday publish checklist when not exceptional
        if: steps.sprint_metrics.outputs.issue_number != '' && steps.monday_draft.outputs.monday_draft_path == ''
        uses: actions/github-script@v7
        env:
          WEEK: ${{ steps.sprint_metrics.outputs.week }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const week = process.env.WEEK || '';
            const checklistTitle = `Monday Publish Checklist ${week}`;

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const existing = openIssues.find((issue) =>
              !issue.pull_request && issue.title === checklistTitle
            );

            if (!existing) {
              core.info(`No open Monday publish checklist to close for ${week}.`);
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: existing.number,
              body: `Closing Monday publish checklist for ${week} because sprint health is not exceptional.`
            });

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: existing.number,
              state: 'closed'
            });

            core.info(`Closed Monday publish checklist issue #${existing.number}: ${checklistTitle}`);

      - name: Add Monday checklist summary
        if: steps.monday_publish.outputs.monday_publish_issue_number != ''
        shell: zsh {0}
        run: |
          set -euo pipefail
          {
            echo "- Monday publish checklist issue: \`#${{ steps.monday_publish.outputs.monday_publish_issue_number }}\`"
            echo "- Monday default variants: primary \`${{ steps.monday_publish.outputs.default_primary_variant }}\`, backup \`${{ steps.monday_publish.outputs.default_backup_variant }}\`"
            echo "- Monday default drafts source: \`${{ steps.monday_publish.outputs.default_drafts_source }}\`"
            echo "- Monday default channel ROI route: \`${{ steps.monday_publish.outputs.channel_roi_preferred_channel }}\`"
            echo "- Monday channel ROI recommendation: \`${{ steps.monday_publish.outputs.channel_roi_recommendation }}\`"
            echo "- Monday channel mix recommendation: \`${{ steps.monday_publish.outputs.channel_mix_recommendation }}\`"
            echo "- Monday narrative preferred variant: \`${{ steps.monday_publish.outputs.narrative_route_preferred_variant }}\`"
            echo "- Monday narrative routing action: \`${{ steps.monday_publish.outputs.narrative_route_routing_action }}\`"
            echo "- Monday narrative routing reason: \`${{ steps.monday_publish.outputs.narrative_route_routing_reason }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Monday publish routing live state
        id: monday_publish_routing_live_verify
        if: steps.monday_publish.outputs.monday_publish_issue_number != '' && env.review_path != ''
        continue-on-error: true
        shell: zsh {0}
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK: ${{ steps.sprint_metrics.outputs.week }}
          REPO_SLUG: ${{ github.repository }}
          CHECKLIST_ISSUE_NUMBER: ${{ steps.monday_publish.outputs.monday_publish_issue_number }}
          REVIEW_PATH: ${{ env.review_path }}
        run: |
          set -euo pipefail
          report_path=".build/growth/${WEEK}-monday-publish-routing-live-check.md"
          echo "monday_publish_routing_live_check_path=$report_path" >> "$GITHUB_ENV"

          set +e
          zsh scripts/verify_monday_publish_routing_run.sh \
            --repo "$REPO_SLUG" \
            --issue "$CHECKLIST_ISSUE_NUMBER" \
            --review "$REVIEW_PATH" \
            --strict \
            --out "$report_path"
          verify_exit_code=$?
          set -e

          echo "monday_publish_routing_live_check_exit_code=$verify_exit_code" >> "$GITHUB_ENV"
          exit "$verify_exit_code"

      - name: Add Monday publish routing verification summary
        if: env.monday_publish_routing_live_check_path != ''
        shell: zsh {0}
        run: |
          set -euo pipefail
          {
            echo "- Monday publish routing live verification report: \`$monday_publish_routing_live_check_path\`"
            echo "- Monday publish routing live verification outcome: \`${{ steps.monday_publish_routing_live_verify.outcome }}\`"
            echo "- Monday publish routing live verification exit code: \`${{ env.monday_publish_routing_live_check_exit_code }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Monday publish checkpoint artifact
        if: steps.monday_publish.outputs.monday_publish_issue_number != ''
        shell: zsh {0}
        env:
          WEEK: ${{ steps.sprint_metrics.outputs.week }}
          METRIC_FOCUS: ${{ steps.sprint_metrics.outputs.metric_focus }}
          PRIMARY_CHANNEL: ${{ steps.sprint_metrics.outputs.primary_channel }}
          BACKUP_CHANNEL: ${{ steps.sprint_metrics.outputs.backup_channel }}
          PRIMARY_AUDIENCE_REGION: ${{ inputs.primary_audience_region }}
          BACKUP_AUDIENCE_REGION: ${{ inputs.backup_audience_region }}
          STRONGEST_METRIC_LABEL: ${{ steps.monday_draft.outputs.strongest_metric_label }}
          STRONGEST_METRIC_VALUE: ${{ steps.monday_draft.outputs.strongest_metric_value }}
          PRIMARY_CHANNEL_ROI_SCORE: ${{ steps.monday_effectiveness.outputs.primary_channel_roi_score }}
          BACKUP_CHANNEL_ROI_SCORE: ${{ steps.monday_effectiveness.outputs.backup_channel_roi_score }}
          CHANNEL_ROI_PREFERRED_CHANNEL: ${{ steps.monday_publish.outputs.channel_roi_preferred_channel }}
          CHANNEL_ROI_RECOMMENDATION: ${{ steps.monday_publish.outputs.channel_roi_recommendation }}
          CHANNEL_MIX_RECOMMENDATION: ${{ steps.monday_effectiveness.outputs.channel_mix_recommendation }}
          MONDAY_DRAFT_PATH: ${{ steps.monday_draft.outputs.monday_draft_path }}
        run: |
          set -euo pipefail

          output_dir=".build/growth"
          mkdir -p "$output_dir"
          checkpoint_path="$output_dir/${WEEK}-monday-checkpoint.md"

          primary_channel_value="${PRIMARY_CHANNEL:-X / Threads}"
          backup_channel_value="${BACKUP_CHANNEL:-LinkedIn}"
          primary_audience_region_value="${PRIMARY_AUDIENCE_REGION:-global}"
          backup_audience_region_value="${BACKUP_AUDIENCE_REGION:-global}"
          metric_focus_value="${METRIC_FOCUS:-Win Card copies and reply quality}"
          strongest_label_value="${STRONGEST_METRIC_LABEL:-Win Card copies}"
          strongest_value_value="${STRONGEST_METRIC_VALUE:-n/a}"

          zsh scripts/generate_monday_publish_checkpoint.sh \
            --week "$WEEK" \
            --metric-focus "$metric_focus_value" \
            --primary-channel "$primary_channel_value" \
            --backup-channel "$backup_channel_value" \
            --primary-audience-region "$primary_audience_region_value" \
            --backup-audience-region "$backup_audience_region_value" \
            --primary-channel-roi-score "${PRIMARY_CHANNEL_ROI_SCORE:-n/a}" \
            --backup-channel-roi-score "${BACKUP_CHANNEL_ROI_SCORE:-n/a}" \
            --channel-roi-preferred-channel "${CHANNEL_ROI_PREFERRED_CHANNEL:-balanced}" \
            --channel-roi-recommendation "${CHANNEL_ROI_RECOMMENDATION:-Collect Monday reply + outreach outcomes before locking a single-channel lead.}" \
            --strongest-metric-label "$strongest_label_value" \
            --strongest-metric-value "$strongest_value_value" \
            --draft-path "$MONDAY_DRAFT_PATH" \
            --out "$checkpoint_path"

          echo "checkpoint_path=$checkpoint_path" >> "$GITHUB_ENV"

      - name: Upsert Monday publish checkpoint comment
        if: steps.monday_publish.outputs.monday_publish_issue_number != '' && env.checkpoint_path != ''
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.monday_publish.outputs.monday_publish_issue_number }}
          CHECKPOINT_PATH: ${{ env.checkpoint_path }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const checkpointPath = process.env.CHECKPOINT_PATH;
            const marker = '<!-- weekly-growth-monday-checkpoint -->';
            const body = fs.readFileSync(checkpointPath, 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100
            });

            const existing = comments.find((comment) => (comment.body || '').includes(marker));
            if (existing) {
              const updated = await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
              core.info(`Updated Monday checkpoint comment: ${updated.data.html_url}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body
              });
              core.info(`Created Monday checkpoint comment: ${created.data.html_url}`);
            }

      - name: Add Monday checkpoint summary
        if: env.checkpoint_path != ''
        shell: zsh {0}
        run: |
          set -euo pipefail
          {
            echo "- Monday checkpoint artifact: \`$checkpoint_path\`"
            echo "- Monday checkpoint audience regions: primary \`${{ inputs.primary_audience_region || 'global' }}\`, backup \`${{ inputs.backup_audience_region || 'global' }}\`"
            echo "- Monday checkpoint ROI lead route: \`${{ steps.monday_publish.outputs.channel_roi_preferred_channel }}\`"
            echo "- Monday checkpoint ROI recommendation: \`${{ steps.monday_publish.outputs.channel_roi_recommendation }}\`"
