      - name: Upsert founder fame outreach sprint comment
        if: steps.monday_publish.outputs.monday_publish_issue_number != '' && env.founder_fame_outreach_sprint_path != ''
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.monday_publish.outputs.monday_publish_issue_number }}
          FOUNDER_FAME_OUTREACH_SPRINT_PATH: ${{ env.founder_fame_outreach_sprint_path }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const founderFameOutreachSprintPath = process.env.FOUNDER_FAME_OUTREACH_SPRINT_PATH;
            const marker = '<!-- weekly-growth-founder-fame-outreach-sprint -->';
            const sprintMarkdown = fs.readFileSync(founderFameOutreachSprintPath, 'utf8').trim();

            function clean(value) {
              return String(value || '').replace(/\r?\n/g, ' ').trim();
            }

            function extractSection(body, heading) {
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const regex = new RegExp(`##\\s+${escaped}([\\s\\S]*?)(?:\\n##\\s+|$)`, 'i');
              const match = String(body || '').match(regex);
              return match ? String(match[1] || '') : '';
            }

            function extractScorecardValue(scorecardSection, label, fallback = 'n/a') {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const regex = new RegExp(`^-\\s*${escaped}:\\s*(.+)$`, 'mi');
              const match = String(scorecardSection || '').match(regex);
              const value = clean(match ? match[1] : '');
              return value || fallback;
            }

            const laneScorecardSection = extractSection(sprintMarkdown, 'Lane Allocation Scorecard');
            const laneStrategy = extractScorecardValue(laneScorecardSection, 'Lane strategy');
            const weeklyTouchTargetTotal = extractScorecardValue(laneScorecardSection, 'Weekly touch target total');
            const creatorTouchTarget = extractScorecardValue(laneScorecardSection, 'Creator touch target');
            const guestingTouchTarget = extractScorecardValue(laneScorecardSection, 'Guesting touch target');
            const dailyTouchFloor = extractScorecardValue(laneScorecardSection, 'Daily touch floor (Day 0-Day 2)');
            const practicalReplyTarget = extractScorecardValue(laneScorecardSection, 'Practical reply target');
            const creatorCollabTarget = extractScorecardValue(laneScorecardSection, 'Creator collab-ready target');
            const guestingBookingTarget = extractScorecardValue(laneScorecardSection, 'Guesting booking-stage target');
            const recommendationSource = extractScorecardValue(laneScorecardSection, 'Recommendation source');

            const ownerDefaults = [
              '## Lane Owner Defaults (Auto-Prefilled)',
              '',
              `- Lane strategy: ${laneStrategy}`,
              `- Weekly touch target total: ${weeklyTouchTargetTotal}`,
              `- Creator touch target: ${creatorTouchTarget}`,
              `- Guesting touch target: ${guestingTouchTarget}`,
              `- Daily touch floor (Day 0-Day 2): ${dailyTouchFloor}`,
              `- Practical reply target: ${practicalReplyTarget}`,
              `- Creator collab-ready target: ${creatorCollabTarget}`,
              `- Guesting booking-stage target: ${guestingBookingTarget}`,
              `- Recommendation source: ${recommendationSource}`,
              '',
              '- [ ] Creator owner default: assign owner + ship creator touch target and collab-ready target.',
              '- [ ] Guesting owner default: assign owner + ship guesting touch target and booking-stage target.',
              '- [ ] Distribution owner default: enforce daily touch floor and practical reply target by Day 2.',
              '- [ ] Ops owner default: update this block with owner handles and progress before Friday review.'
            ].join('\n');

            const body = `${marker}\n\n${ownerDefaults}\n\n${sprintMarkdown}\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100
            });

            const existing = comments.find((comment) => (comment.body || '').includes(marker));
            if (existing) {
              const updated = await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
              core.info(`Updated founder fame outreach sprint comment: ${updated.data.html_url}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body
              });
              core.info(`Created founder fame outreach sprint comment: ${created.data.html_url}`);
            }

