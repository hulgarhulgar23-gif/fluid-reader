              if (!weekMatch) return null;
              const year = Number(weekMatch[1]);
              const isoWeek = Number(weekMatch[2]);
              if (!Number.isFinite(year) || !Number.isFinite(isoWeek)) return null;
              return (year * 100) + isoWeek;
            }

            function computeVariantStreak(checklists, startIndex, key) {
              if (startIndex < 0) return 'n/a';
              const startingChecklist = checklists[startIndex];
              if (!startingChecklist) return 'n/a';
              const winningVariant = startingChecklist[key];
              if (!winningVariant || winningVariant === 'n/a') return 'n/a';

              let streak = 0;
              for (let index = startIndex; index < checklists.length; index += 1) {
                const checklist = checklists[index];
                if (!checklist || checklist[key] !== winningVariant) {
                  break;
                }
                streak += 1;
              }

              const weekLabel = streak === 1 ? 'consecutive week' : 'consecutive weeks';
              return `Variant ${winningVariant} (${streak} ${weekLabel})`;
