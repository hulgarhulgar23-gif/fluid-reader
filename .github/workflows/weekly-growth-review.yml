                if (!current) {
                  current = {
                    handleRaw: '',
                    segmentRaw: '',
                    channelRaw: '',
                    fitScoreRaw: '',
                    warmIntroRaw: '',
                    statusRaw: ''
                  };
                }

                if (key === 'segment') current.segmentRaw = value;
