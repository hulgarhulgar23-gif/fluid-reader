            core.setOutput('narrative_fame_velocity_score', previousFounderNarrativeSummary.fameVelocityScore === null ? 'n/a' : `${previousFounderNarrativeSummary.fameVelocityScore}%`);
            core.setOutput('narrative_fame_velocity_score_delta', narrativeFameVelocityScoreDelta);
            core.setOutput('narrative_launch_posture', previousFounderNarrativeSummary.launchPosture || 'n/a');
            core.setOutput('narrative_next_standup_action', previousFounderNarrativeSummary.nextStandupAction || 'n/a');
            core.setOutput('narrative_route_mode', previousFounderNarrativeSummary.routeMode || 'n/a');
            core.setOutput('narrative_route_alignment_target', previousFounderNarrativeSummary.routeAlignmentTarget || 'n/a');
            core.setOutput('narrative_route_lane_status', previousFounderNarrativeSummary.routeLaneStatus || 'n/a');
            core.setOutput('narrative_route_guardrail', previousFounderNarrativeSummary.routeGuardrail || 'n/a');
            core.setOutput('narrative_route_control_recommendation', narrativeRouteControlRecommendation);
            core.setOutput('narrative_route_recommendation', narrativeRouteRecommendation);
            core.setOutput('narrative_distribution_strategy', previousFounderNarrativeSummary.distributionStrategy || 'n/a');
            core.setOutput('narrative_distribution_day0_lead', previousFounderNarrativeSummary.distributionDay0Lead || 'n/a');
            core.setOutput('narrative_distribution_day0_support', previousFounderNarrativeSummary.distributionDay0Support || 'n/a');
            core.setOutput('narrative_distribution_recommendation', narrativeDistributionRecommendation || 'Capture 7-day distribution calendar fields in founder narrative lab before Friday review.');
            core.setOutput('narrative_distribution_first_48h_plan', narrativeDistributionFirst48hPlan || 'Capture Day 0 lead/support lanes first, then script Day 1 proof recap and Day 2 objection-breaker follow-up.');

            if (baselineChecklist) {
              core.setOutput('baseline_week', baselineChecklist.week);
              core.setOutput('baseline_checklist_issue_number', baselineChecklist.issueNumber);
            }

            core.info(`Parsed Monday checklist #${previousChecklist.issueNumber} for ${previousWeek}.`);

      - name: Extract founder outreach sprint outcomes
        id: outreach_sprint_outcomes
        if: steps.sprint_metrics.outputs.issue_number != ''
        uses: actions/github-script@v7
        env:
          PREVIOUS_WEEK: ${{ steps.sprint_metrics.outputs.previous_week }}
          PREVIOUS_BASELINE_WEEK: ${{ steps.sprint_metrics.outputs.previous_baseline_week }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const previousWeek = String(process.env.PREVIOUS_WEEK || '').trim();
            const previousBaselineWeek = String(process.env.PREVIOUS_BASELINE_WEEK || '').trim();

            function clean(value) {
              if (!value) return '';
              return String(value).replace(/\r?\n/g, ' ').trim();
            }

            function parseNumber(value) {
              const match = clean(value).match(/[+-]?\d+(?:\.\d+)?/);
              if (!match) return null;
              const parsed = Number(match[0]);
              return Number.isFinite(parsed) ? parsed : null;
            }

            function formatDelta(currentValue, baselineValue) {
              const currentNumber = parseNumber(currentValue);
              const baselineNumber = parseNumber(baselineValue);
              if (currentNumber === null || baselineNumber === null) return 'n/a';
              const delta = currentNumber - baselineNumber;
              const rounded = Number.isInteger(delta)
                ? String(delta)
                : String(Math.round(delta * 100) / 100);
              return delta > 0 ? `+${rounded}` : rounded;
            }

            function formatRate(rateValue) {
              if (!Number.isFinite(rateValue)) return 'n/a';
              const percent = rateValue * 100;
              const rounded = Math.round(percent * 10) / 10;
              return `${rounded}%`;
            }

            function formatRateDelta(currentRate, baselineRate) {
              if (!Number.isFinite(currentRate) || !Number.isFinite(baselineRate)) return 'n/a';
              const delta = (currentRate - baselineRate) * 100;
              const rounded = Math.round(delta * 10) / 10;
              const formatted = Number.isInteger(rounded)
                ? String(Math.trunc(rounded))
                : String(rounded);
              return rounded > 0 ? `+${formatted}pp` : `${formatted}pp`;
            }

            function parseWeekOrder(weekLabel) {
              const weekMatch = clean(weekLabel).match(/^(\d{4})-W(\d{2})$/i);
              if (!weekMatch) return null;
              const year = Number(weekMatch[1]);
              const isoWeek = Number(weekMatch[2]);
              if (!Number.isFinite(year) || !Number.isFinite(isoWeek)) return null;
              return (year * 100) + isoWeek;
            }

            function parseChecklistIssue(issue) {
              if (!issue || issue.pull_request) return null;
              const title = String(issue.title || '').trim();
              const titleMatch = title.match(/^Monday Publish Checklist\s+(.+)$/i);
              if (!titleMatch) return null;
              const weekLabel = clean(titleMatch[1]);
              if (!weekLabel) return null;
              return {
                week: weekLabel,
                issueNumber: String(issue.number),
                issueUrl: issue.html_url || ''
              };
            }

            function defaultOutreachSprintSummary() {
              return {
                entries: null,
                tasksCompleted: null,
                tasksTotal: null,
                completionRate: null,
                creatorTasksCompleted: null,
                guestingTasksCompleted: null,
                ownerDefaultsTasksCompleted: null,
                ownerDefaultsTasksTotal: null,
                ownerDefaultsCompletionRate: null,
                ownerDefaultCreatorCompleted: null,
                ownerDefaultGuestingCompleted: null,
                ownerDefaultDistributionCompleted: null,
                ownerDefaultOpsCompleted: null,
                variantPromoted: null,
                outcomesLogged: null,
                preferredLane: 'balanced',
                recommendation: 'Capture founder outreach sprint checklist updates in Monday checklist comments before Friday review.'
              };
            }

            function buildOutreachSprintRecommendation(summary) {
              if (!summary || summary.tasksTotal === null || summary.tasksTotal <= 0) {
                return 'Capture founder outreach sprint checklist updates in Monday checklist comments before Friday review.';
              }

              const completionRate = summary.completionRate;
              const creatorCompleted = summary.creatorTasksCompleted || 0;
              const guestingCompleted = summary.guestingTasksCompleted || 0;
              const ownerDefaultsCompletionRate = summary.ownerDefaultsCompletionRate;
              const ownerDefaultCreatorCompleted = summary.ownerDefaultCreatorCompleted === 1;
              const ownerDefaultGuestingCompleted = summary.ownerDefaultGuestingCompleted === 1;
              const ownerDefaultDistributionCompleted = summary.ownerDefaultDistributionCompleted === 1;
              const ownerDefaultOpsCompleted = summary.ownerDefaultOpsCompleted === 1;
              const variantPromoted = summary.variantPromoted === true;
              const outcomesLogged = summary.outcomesLogged === true;

              if (completionRate !== null && completionRate < 0.5) {
                return 'Outreach sprint completion is below 50%; close unchecked checklist tasks before expanding new creator or guesting lanes.';
              }

              if (ownerDefaultsCompletionRate !== null && ownerDefaultsCompletionRate < 0.5) {
                return 'Lane owner defaults are mostly unchecked; assign creator/guesting/distribution/ops owners before Friday review so next-week routing stays accountable.';
              }

              if (!variantPromoted) {
                return 'Promote one winning outreach script variant into next-week defaults to keep distribution compounding.';
              }

              if (!outcomesLogged) {
                return 'Log founder outreach sprint outcomes in Monday checklist comments before Friday review to keep ranking defaults evidence-backed.';
              }

              if (ownerDefaultsCompletionRate !== null) {
                if (!ownerDefaultDistributionCompleted) {
                  return 'Distribution owner default is unchecked; enforce daily touch-floor and practical reply targets by Day 2 before expanding outreach lanes.';
                }
                if (!ownerDefaultOpsCompleted) {
                  return 'Ops owner default is unchecked; update owner handles and owner-default progress before Friday review.';
                }
                if (!ownerDefaultCreatorCompleted || !ownerDefaultGuestingCompleted) {
                  return 'Creator/guesting owner defaults are incomplete; assign owners and close lane-default tasks before Friday review.';
                }
              }

              if (completionRate !== null && completionRate >= 0.85) {
                if (creatorCompleted >= guestingCompleted + 1) {
                  return 'Outreach sprint execution is strong; bias next-week creator ranking defaults to creator-first while keeping one guesting booking wave.';
                }
                if (guestingCompleted >= creatorCompleted + 1) {
                  return 'Outreach sprint execution is strong; bias next-week guesting ranking defaults to booking-first while preserving creator follow-ups.';
                }
                return 'Outreach sprint execution is strong; keep balanced creator + guesting defaults and scale the winning script route.';
              }

              if (creatorCompleted >= guestingCompleted + 1) {
                return 'Creator execution outpaced guesting this week; bias next-week creator targets toward top-segment handles and keep guesting touchpoints active.';
              }
              if (guestingCompleted >= creatorCompleted + 1) {
                return 'Guesting execution outpaced creator outreach this week; bias next-week guesting queue toward booked targets and keep one creator follow-up lane active.';
              }

              return 'Maintain balanced creator + guesting outreach defaults and close remaining checklist tasks before Friday review.';
            }

            function parseOutreachSprintSummaryFromComment(commentBody) {
              const marker = '<!-- weekly-growth-founder-fame-outreach-sprint -->';
              const body = String(commentBody || '');
              if (!body.includes(marker)) return null;

              const checklistMatch = body.match(/##\s+Execution Checklist([\s\S]*?)(?:\n##\s+|$)/i);
              const checklistSection = checklistMatch ? String(checklistMatch[1] || '') : '';
              const lines = checklistSection.split(/\r?\n/);
              const ownerDefaultsMatch = body.match(/##\s+Lane Owner Defaults \(Auto-Prefilled\)([\s\S]*?)(?:\n##\s+|$)/i);
              const ownerDefaultsSection = ownerDefaultsMatch ? String(ownerDefaultsMatch[1] || '') : '';
              const ownerDefaultLines = ownerDefaultsSection.split(/\r?\n/);

              let tasksTotal = 0;
              let tasksCompleted = 0;
              let creatorTasksCompleted = 0;
              let guestingTasksCompleted = 0;
              let ownerDefaultsTasksTotal = 0;
              let ownerDefaultsTasksCompleted = 0;
              let ownerDefaultCreatorCompleted = null;
              let ownerDefaultGuestingCompleted = null;
              let ownerDefaultDistributionCompleted = null;
              let ownerDefaultOpsCompleted = null;
              let variantPromoted = false;
              let outcomesLogged = false;

              for (const line of lines) {
                const match = line.match(/^\s*-\s*\[([ xX])\]\s*(.+)\s*$/);
                if (!match) continue;
                tasksTotal += 1;
                const checked = clean(match[1]).toLowerCase() === 'x';
                const taskText = clean(match[2]);
                const taskLower = taskText.toLowerCase();

                if (checked) {
                  tasksCompleted += 1;
                  if (/(creator|outreach|collab|collaboration|reply)/.test(taskLower)) {
                    creatorTasksCompleted += 1;
                  }
                  if (/(guesting|booking|interview|podcast|newsletter)/.test(taskLower)) {
                    guestingTasksCompleted += 1;
                  }
                }

                if (checked && taskLower.includes('promote one winning script variant')) {
                  variantPromoted = true;
                }
                if (checked && taskLower.includes('log outcomes in monday checklist')) {
                  outcomesLogged = true;
                }
              }

              for (const line of ownerDefaultLines) {
                const match = line.match(/^\s*-\s*\[([ xX])\]\s*(.+)\s*$/);
                if (!match) continue;
                ownerDefaultsTasksTotal += 1;
                const checked = clean(match[1]).toLowerCase() === 'x';
                const taskText = clean(match[2]);
                const taskLower = taskText.toLowerCase();

                if (checked) {
                  ownerDefaultsTasksCompleted += 1;
                }

                if (taskLower.includes('creator owner default')) {
                  ownerDefaultCreatorCompleted = checked ? 1 : 0;
                } else if (taskLower.includes('guesting owner default')) {
                  ownerDefaultGuestingCompleted = checked ? 1 : 0;
                } else if (taskLower.includes('distribution owner default')) {
                  ownerDefaultDistributionCompleted = checked ? 1 : 0;
                } else if (taskLower.includes('ops owner default')) {
                  ownerDefaultOpsCompleted = checked ? 1 : 0;
                }
              }

              if (ownerDefaultsTasksTotal <= 0) {
                ownerDefaultsTasksTotal = null;
                ownerDefaultsTasksCompleted = null;
                ownerDefaultCreatorCompleted = null;
                ownerDefaultGuestingCompleted = null;
                ownerDefaultDistributionCompleted = null;
                ownerDefaultOpsCompleted = null;
              }

              let preferredLane = 'balanced';
              if (creatorTasksCompleted >= guestingTasksCompleted + 1) {
                preferredLane = 'creator';
              } else if (guestingTasksCompleted >= creatorTasksCompleted + 1) {
                preferredLane = 'guesting';
              }

              const completionRate = tasksTotal > 0 ? tasksCompleted / tasksTotal : null;
              const ownerDefaultsCompletionRate = ownerDefaultsTasksTotal && ownerDefaultsTasksTotal > 0
                ? ownerDefaultsTasksCompleted / ownerDefaultsTasksTotal
                : null;
              const summary = {
                entries: 1,
                tasksCompleted,
                tasksTotal,
                completionRate,
                creatorTasksCompleted,
                guestingTasksCompleted,
                ownerDefaultsTasksCompleted,
                ownerDefaultsTasksTotal,
                ownerDefaultsCompletionRate,
                ownerDefaultCreatorCompleted,
                ownerDefaultGuestingCompleted,
                ownerDefaultDistributionCompleted,
                ownerDefaultOpsCompleted,
                variantPromoted,
                outcomesLogged,
                preferredLane,
                recommendation: ''
              };
              summary.recommendation = buildOutreachSprintRecommendation(summary);
              return summary;
            }

            async function extractOutreachSprintSummary(issueNumber) {
              const normalizedIssueNumber = Number(issueNumber);
              if (!Number.isFinite(normalizedIssueNumber) || normalizedIssueNumber <= 0) {
                return defaultOutreachSprintSummary();
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: normalizedIssueNumber,
                per_page: 100
              });

              const parsedSummaries = comments
                .map((comment) => parseOutreachSprintSummaryFromComment(comment.body || ''))
                .filter((summary) => summary !== null);

              if (parsedSummaries.length === 0) {
                return defaultOutreachSprintSummary();
              }

              const latestSummary = parsedSummaries[parsedSummaries.length - 1];
              const summary = {
                ...latestSummary,
                entries: parsedSummaries.length
              };
              summary.recommendation = buildOutreachSprintRecommendation(summary);
              return summary;
            }

            core.setOutput('source_week', previousWeek);
            core.setOutput('baseline_week', '');
            core.setOutput('checklist_issue_number', '');
            core.setOutput('baseline_checklist_issue_number', '');
            core.setOutput('checklist_issue_url', '');
            core.setOutput('outreach_sprint_comment_entries', 'n/a');
            core.setOutput('outreach_sprint_comment_entries_delta', 'n/a');
            core.setOutput('outreach_sprint_tasks_completed', 'n/a');
            core.setOutput('outreach_sprint_tasks_completed_delta', 'n/a');
            core.setOutput('outreach_sprint_tasks_total', 'n/a');
            core.setOutput('outreach_sprint_completion_rate', 'n/a');
            core.setOutput('outreach_sprint_completion_rate_delta', 'n/a');
            core.setOutput('outreach_sprint_creator_tasks_completed', 'n/a');
            core.setOutput('outreach_sprint_creator_tasks_completed_delta', 'n/a');
            core.setOutput('outreach_sprint_guesting_tasks_completed', 'n/a');
            core.setOutput('outreach_sprint_guesting_tasks_completed_delta', 'n/a');
            core.setOutput('outreach_sprint_owner_defaults_tasks_completed', 'n/a');
            core.setOutput('outreach_sprint_owner_defaults_tasks_completed_delta', 'n/a');
            core.setOutput('outreach_sprint_owner_defaults_tasks_total', 'n/a');
            core.setOutput('outreach_sprint_owner_defaults_completion_rate', 'n/a');
            core.setOutput('outreach_sprint_owner_defaults_completion_rate_delta', 'n/a');
            core.setOutput('outreach_sprint_owner_default_creator_completed', 'n/a');
            core.setOutput('outreach_sprint_owner_default_creator_completed_delta', 'n/a');
            core.setOutput('outreach_sprint_owner_default_guesting_completed', 'n/a');
            core.setOutput('outreach_sprint_owner_default_guesting_completed_delta', 'n/a');
            core.setOutput('outreach_sprint_owner_default_distribution_completed', 'n/a');
            core.setOutput('outreach_sprint_owner_default_distribution_completed_delta', 'n/a');
            core.setOutput('outreach_sprint_owner_default_ops_completed', 'n/a');
            core.setOutput('outreach_sprint_owner_default_ops_completed_delta', 'n/a');
            core.setOutput('outreach_sprint_variant_promoted', 'n/a');
            core.setOutput('outreach_sprint_outcomes_logged', 'n/a');
            core.setOutput('outreach_sprint_preferred_lane', 'balanced');
            core.setOutput('outreach_sprint_recommendation', 'Capture founder outreach sprint checklist updates in Monday checklist comments before Friday review.');

            if (!previousWeek) {
              core.info('No previous week found; skipping outreach sprint outcome extraction.');
              return;
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'all',
              per_page: 100
            });

            const mondayChecklists = issues
              .map((issue) => parseChecklistIssue(issue))
              .filter((checklist) => checklist !== null)
              .sort((left, right) => {
                const leftOrder = parseWeekOrder(left.week);
                const rightOrder = parseWeekOrder(right.week);
                if (leftOrder !== null && rightOrder !== null && leftOrder !== rightOrder) {
                  return rightOrder - leftOrder;
                }
                return Number(right.issueNumber) - Number(left.issueNumber);
              });

            const previousChecklist = mondayChecklists.find((checklist) => checklist.week === previousWeek);
            if (!previousChecklist) {
              core.info(`No Monday publish checklist found for ${previousWeek}; skipping outreach sprint outcome extraction.`);
              return;
            }

            const baselineChecklist = mondayChecklists.find((checklist) => checklist.week === previousBaselineWeek);
            const previousSummary = await extractOutreachSprintSummary(previousChecklist.issueNumber);
            const baselineSummary = baselineChecklist
              ? await extractOutreachSprintSummary(baselineChecklist.issueNumber)
              : defaultOutreachSprintSummary();

            const entriesDelta = baselineChecklist && previousSummary.entries !== null && baselineSummary.entries !== null
              ? formatDelta(String(previousSummary.entries), String(baselineSummary.entries))
              : 'n/a';
            const completedDelta = baselineChecklist && previousSummary.tasksCompleted !== null && baselineSummary.tasksCompleted !== null
              ? formatDelta(String(previousSummary.tasksCompleted), String(baselineSummary.tasksCompleted))
              : 'n/a';
            const creatorCompletedDelta = baselineChecklist && previousSummary.creatorTasksCompleted !== null && baselineSummary.creatorTasksCompleted !== null
              ? formatDelta(String(previousSummary.creatorTasksCompleted), String(baselineSummary.creatorTasksCompleted))
              : 'n/a';
            const guestingCompletedDelta = baselineChecklist && previousSummary.guestingTasksCompleted !== null && baselineSummary.guestingTasksCompleted !== null
              ? formatDelta(String(previousSummary.guestingTasksCompleted), String(baselineSummary.guestingTasksCompleted))
              : 'n/a';
            const ownerDefaultsCompletedDelta = baselineChecklist && previousSummary.ownerDefaultsTasksCompleted !== null && baselineSummary.ownerDefaultsTasksCompleted !== null
              ? formatDelta(String(previousSummary.ownerDefaultsTasksCompleted), String(baselineSummary.ownerDefaultsTasksCompleted))
              : 'n/a';
            const ownerDefaultCreatorCompletedDelta = baselineChecklist && previousSummary.ownerDefaultCreatorCompleted !== null && baselineSummary.ownerDefaultCreatorCompleted !== null
              ? formatDelta(String(previousSummary.ownerDefaultCreatorCompleted), String(baselineSummary.ownerDefaultCreatorCompleted))
              : 'n/a';
            const ownerDefaultGuestingCompletedDelta = baselineChecklist && previousSummary.ownerDefaultGuestingCompleted !== null && baselineSummary.ownerDefaultGuestingCompleted !== null
              ? formatDelta(String(previousSummary.ownerDefaultGuestingCompleted), String(baselineSummary.ownerDefaultGuestingCompleted))
              : 'n/a';
            const ownerDefaultDistributionCompletedDelta = baselineChecklist && previousSummary.ownerDefaultDistributionCompleted !== null && baselineSummary.ownerDefaultDistributionCompleted !== null
              ? formatDelta(String(previousSummary.ownerDefaultDistributionCompleted), String(baselineSummary.ownerDefaultDistributionCompleted))
              : 'n/a';
            const ownerDefaultOpsCompletedDelta = baselineChecklist && previousSummary.ownerDefaultOpsCompleted !== null && baselineSummary.ownerDefaultOpsCompleted !== null
              ? formatDelta(String(previousSummary.ownerDefaultOpsCompleted), String(baselineSummary.ownerDefaultOpsCompleted))
              : 'n/a';
            const completionRateDelta = baselineChecklist
              ? formatRateDelta(previousSummary.completionRate, baselineSummary.completionRate)
              : 'n/a';
            const ownerDefaultsCompletionRateDelta = baselineChecklist
              ? formatRateDelta(previousSummary.ownerDefaultsCompletionRate, baselineSummary.ownerDefaultsCompletionRate)
              : 'n/a';

            core.setOutput('checklist_issue_number', previousChecklist.issueNumber);
            core.setOutput('checklist_issue_url', previousChecklist.issueUrl);
            core.setOutput('outreach_sprint_comment_entries', previousSummary.entries === null ? 'n/a' : String(previousSummary.entries));
            core.setOutput('outreach_sprint_comment_entries_delta', entriesDelta);
            core.setOutput('outreach_sprint_tasks_completed', previousSummary.tasksCompleted === null ? 'n/a' : String(previousSummary.tasksCompleted));
            core.setOutput('outreach_sprint_tasks_completed_delta', completedDelta);
            core.setOutput('outreach_sprint_tasks_total', previousSummary.tasksTotal === null ? 'n/a' : String(previousSummary.tasksTotal));
            core.setOutput('outreach_sprint_completion_rate', formatRate(previousSummary.completionRate));
            core.setOutput('outreach_sprint_completion_rate_delta', completionRateDelta);
            core.setOutput('outreach_sprint_creator_tasks_completed', previousSummary.creatorTasksCompleted === null ? 'n/a' : String(previousSummary.creatorTasksCompleted));
            core.setOutput('outreach_sprint_creator_tasks_completed_delta', creatorCompletedDelta);
            core.setOutput('outreach_sprint_guesting_tasks_completed', previousSummary.guestingTasksCompleted === null ? 'n/a' : String(previousSummary.guestingTasksCompleted));
            core.setOutput('outreach_sprint_guesting_tasks_completed_delta', guestingCompletedDelta);
            core.setOutput('outreach_sprint_owner_defaults_tasks_completed', previousSummary.ownerDefaultsTasksCompleted === null ? 'n/a' : String(previousSummary.ownerDefaultsTasksCompleted));
            core.setOutput('outreach_sprint_owner_defaults_tasks_completed_delta', ownerDefaultsCompletedDelta);
            core.setOutput('outreach_sprint_owner_defaults_tasks_total', previousSummary.ownerDefaultsTasksTotal === null ? 'n/a' : String(previousSummary.ownerDefaultsTasksTotal));
            core.setOutput('outreach_sprint_owner_defaults_completion_rate', formatRate(previousSummary.ownerDefaultsCompletionRate));
            core.setOutput('outreach_sprint_owner_defaults_completion_rate_delta', ownerDefaultsCompletionRateDelta);
            core.setOutput('outreach_sprint_owner_default_creator_completed', previousSummary.ownerDefaultCreatorCompleted === null ? 'n/a' : String(previousSummary.ownerDefaultCreatorCompleted));
            core.setOutput('outreach_sprint_owner_default_creator_completed_delta', ownerDefaultCreatorCompletedDelta);
            core.setOutput('outreach_sprint_owner_default_guesting_completed', previousSummary.ownerDefaultGuestingCompleted === null ? 'n/a' : String(previousSummary.ownerDefaultGuestingCompleted));
