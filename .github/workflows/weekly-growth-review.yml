      - name: Enforce founder fame war-room checklist comment upsert
        if: steps.founder_fame_war_room_comment.outcome == 'failure'
        shell: zsh {0}
        run: |
          set -euo pipefail
          {
            echo "- Founder fame war-room checklist comment enforcement: \`failed\`"
            echo "- Founder fame war-room checklist comment draft: \`$founder_fame_war_room_comment_path\`"
          } >> "$GITHUB_STEP_SUMMARY"
