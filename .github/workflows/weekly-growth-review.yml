      - name: Upsert founder fame pack comment
        if: steps.monday_publish.outputs.monday_publish_issue_number != '' && env.founder_fame_path != ''
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.monday_publish.outputs.monday_publish_issue_number }}
          FOUNDER_FAME_PATH: ${{ env.founder_fame_path }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const founderFamePath = process.env.FOUNDER_FAME_PATH;
            const marker = '<!-- weekly-growth-founder-fame-pack -->';
            const body = `${marker}\n\n${fs.readFileSync(founderFamePath, 'utf8').trim()}\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100
            });

            const existing = comments.find((comment) => (comment.body || '').includes(marker));
            if (existing) {
              const updated = await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
              core.info(`Updated founder fame pack comment: ${updated.data.html_url}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body
              });
              core.info(`Created founder fame pack comment: ${created.data.html_url}`);
            }

